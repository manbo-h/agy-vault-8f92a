<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0">
<title>💬 宁德时代（300750.SZ）投委会群聊辩论剧场</title>
<style>
  :root {
    --bg-app: #f1f5f9;
    --bg-panel: #ffffff;
    --bg-card: #f8fafc;
    --bg-card-hover: #eef2f7;
    --bg-bubble-host: #eff6ff;
    --bg-bubble-bull: #ecfdf5;
    --bg-bubble-bear: #fff1f2;
    --bg-bubble-judge: #faf5ff;
    --border-subtle: rgba(15, 23, 42, 0.10);
    --border-strong: rgba(15, 23, 42, 0.20);
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #64748b;
    --accent-host: #0284c7;
    --accent-bull: #059669;
    --accent-bear: #e11d48;
    --accent-judge: #7c3aed;
    --accent-gold: #d97706;
    --quote-bg: rgba(15, 23, 42, 0.055);
    --pill-bg: #e2e8f0;
    --shadow-lg: 0 8px 24px rgba(15, 23, 42, 0.08);
    --highlight-ring: #f59e0b;
  }
  [data-theme="dark"] {
    --bg-app: #0b1120;
    --bg-panel: #111827;
    --bg-card: #1e293b;
    --bg-card-hover: #273549;
    --bg-bubble-host: #172554;
    --bg-bubble-bull: #052e2b;
    --bg-bubble-bear: #33131c;
    --bg-bubble-judge: #251a3f;
    --border-subtle: rgba(148, 163, 184, 0.16);
    --border-strong: rgba(148, 163, 184, 0.30);
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent-host: #38bdf8;
    --accent-bull: #34d399;
    --accent-bear: #fb7185;
    --accent-judge: #c084fc;
    --accent-gold: #fbbf24;
    --quote-bg: rgba(15, 23, 42, 0.55);
    --pill-bg: rgba(30, 41, 59, 0.85);
    --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.42);
    --highlight-ring: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg-app); color: var(--text-primary);
    line-height: 1.66; -webkit-font-smoothing: antialiased;
  }
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg-panel); border-bottom: 1px solid var(--border-subtle);
    backdrop-filter: blur(12px); padding: 11px 18px; box-shadow: var(--shadow-lg);
  }
  .topbar-inner {
    max-width: 1480px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .group-title-wrap { display: flex; flex-direction: column; gap: 2px; }
  .group-title { font-size: 16.5px; font-weight: 800; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .group-badge {
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: rgba(2, 132, 199, 0.14); color: var(--accent-host); border: 1px solid rgba(2, 132, 199, 0.30);
  }
  .group-sub { font-size: 12px; color: var(--text-secondary); }
  .top-actions { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }

  /* 双模式切换胶囊（核心亮点） */
  .mode-switch {
    display: inline-flex; padding: 3px; border-radius: 11px;
    background: var(--bg-card); border: 1.5px solid var(--accent-host); gap: 2px;
  }
  .mode-btn {
    border: none; background: transparent; color: var(--text-secondary);
    padding: 5px 11px; border-radius: 8px; font-size: 12.5px; font-weight: 800;
    cursor: pointer; transition: all 0.18s ease; display: inline-flex; align-items: center; gap: 4px;
  }
  .mode-btn.active-plain { background: linear-gradient(135deg, #10b981, #059669); color: #fff; box-shadow: 0 2px 8px rgba(16, 185, 129, 0.30); }
  .mode-btn.active-pro { background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; box-shadow: 0 2px 8px rgba(99, 102, 241, 0.30); }

  .btn {
    border: 1px solid var(--border-strong); background: var(--bg-card); color: var(--text-primary);
    padding: 6px 11px; border-radius: 9px; font-size: 12.5px; font-weight: 600;
    cursor: pointer; transition: all 0.18s ease; display: inline-flex; align-items: center; gap: 5px;
    text-decoration: none;
  }
  .btn:hover { background: var(--bg-card-hover); transform: translateY(-1px); }
  .btn.active { background: var(--accent-host); color: #fff; border-color: var(--accent-host); }
  .btn-gold { background: linear-gradient(135deg, #f59e0b, #ea580c); color: #fff; border-color: transparent; }
  .btn-gold:hover { filter: brightness(1.08); }

  .roster-strip {
    max-width: 1480px; margin: 8px auto 0;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    padding-top: 8px; border-top: 1px dashed var(--border-subtle);
  }
  .member-chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; padding: 3px 10px;
    border-radius: 999px; background: var(--bg-card); border: 1px solid var(--border-subtle);
    color: var(--text-secondary); cursor: pointer; transition: all 0.15s;
  }
  .member-chip:hover { border-color: var(--border-strong); color: var(--text-primary); }
  .member-chip.selected { border-color: var(--accent-gold); color: var(--text-primary); box-shadow: 0 0 0 1px var(--accent-gold); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot-host { background: var(--accent-host); } .dot-bull { background: var(--accent-bull); }
  .dot-bear { background: var(--accent-bear); } .dot-judge { background: var(--accent-judge); }

  /* 三栏自适应布局：左导航 + 中间群聊 + 右侧术语白话栏 */
  .layout {
    max-width: 1480px; margin: 16px auto 40px; padding: 0 16px;
    display: grid; grid-template-columns: 255px minmax(0, 1fr) 290px; gap: 16px; align-items: start;
  }
  .layout.hide-glossary { grid-template-columns: 255px minmax(0, 1fr); }
  .layout.hide-glossary .glossary-sidebar { display: none; }
  @media (max-width: 1200px) {
    .layout { grid-template-columns: 245px minmax(0, 1fr); }
    .glossary-sidebar {
      position: fixed !important; right: 16px; bottom: 16px; top: auto !important; z-index: 200;
      width: min(360px, calc(100vw - 32px)); max-height: 70vh; box-shadow: 0 16px 48px rgba(0,0,0,0.32);
      display: none;
    }
    .glossary-sidebar.drawer-open { display: flex !important; }
  }
  @media (max-width: 900px) {
    .layout, .layout.hide-glossary { grid-template-columns: 1fr; }
    .sidebar { position: static !important; }
  }

  .sidebar, .glossary-sidebar {
    position: sticky; top: 118px; background: var(--bg-panel); border: 1px solid var(--border-subtle);
    border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px;
    max-height: calc(100vh - 134px); overflow-y: auto;
  }
  .side-title {
    font-size: 12px; font-weight: 800; letter-spacing: 0.03em; color: var(--text-muted);
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
  }
  .topic-list { display: flex; flex-direction: column; gap: 5px; }
  .topic-btn {
    text-align: left; width: 100%; border: 1px solid transparent; background: transparent; color: var(--text-secondary);
    padding: 7px 9px; border-radius: 10px; cursor: pointer; font-size: 12.5px; font-weight: 600;
    transition: all 0.15s; display: flex; justify-content: space-between; align-items: center; gap: 6px;
  }
  .topic-btn > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topic-btn:hover { background: var(--bg-card); color: var(--text-primary); }
  .topic-btn.active { background: rgba(2, 132, 199, 0.12); color: var(--accent-host); border-color: rgba(2, 132, 199, 0.35); }
  .topic-count { font-size: 10.5px; padding: 1px 6px; border-radius: 999px; background: var(--pill-bg); color: var(--text-secondary); font-weight: 700; }
  .topic-status { font-size: 10.5px; white-space: nowrap; }
  .convergence-box { background: var(--bg-card); border-radius: 11px; padding: 10px; border: 1px solid var(--border-subtle); font-size: 12px; }
  .conv-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px dashed var(--border-subtle); gap: 6px; }
  .conv-row:last-child { border-bottom: none; }
  .conv-label { color: var(--text-secondary); font-size: 11.5px; }
  .conv-val { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; font-size: 11.5px; }

  /* 术语注解侧边栏样式 */
  .glossary-search {
    width: 100%; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--border-strong);
    background: var(--bg-card); color: var(--text-primary); font-size: 12.5px; outline: none;
  }
  .glossary-search:focus { border-color: var(--accent-host); }
  .glossary-list { display: flex; flex-direction: column; gap: 8px; }
  .g-card {
    background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 10px;
    padding: 9px 10px; font-size: 12px; transition: all 0.22s ease; cursor: pointer;
  }
  .g-card:hover { border-color: var(--accent-host); }
  .g-card.flash-term { border-color: var(--accent-gold); box-shadow: 0 0 0 2.5px rgba(245, 158, 11, 0.35); background: rgba(245, 158, 11, 0.10); }
  .g-term { font-weight: 800; font-size: 12.5px; color: var(--accent-host); margin-bottom: 3px; }
  .g-plain { color: var(--text-primary); line-height: 1.55; }
  .g-usage { margin-top: 4px; font-size: 11px; color: var(--text-muted); border-top: 1px dashed var(--border-subtle); padding-top: 4px; }

  /* 正文内联可点击术语胶囊 */
  .term-link {
    border-bottom: 1.5px dashed var(--accent-host); cursor: help; font-weight: 700;
    color: inherit; padding: 0 1px; border-radius: 3px; transition: background 0.15s;
  }
  .term-link:hover { background: rgba(2, 132, 199, 0.14); }

  .chat-stage { background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 16px 18px 28px; min-height: 75vh; }
  .stage-banner {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    padding: 10px 13px; border-radius: 11px; margin-bottom: 16px;
    background: var(--bg-card); border: 1px solid var(--border-subtle); font-size: 12.5px; color: var(--text-secondary);
  }
  .mode-pill-banner {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 800;
    padding: 2px 9px; border-radius: 999px;
  }
  .mode-pill-banner.plain { background: rgba(16, 185, 129, 0.15); color: #059669; }
  .mode-pill-banner.pro { background: rgba(99, 102, 241, 0.15); color: #4f46e5; }
  [data-theme="dark"] .mode-pill-banner.plain { color: #34d399; }
  [data-theme="dark"] .mode-pill-banner.pro { color: #a5b4fc; }

  .round-divider { display: flex; align-items: center; gap: 10px; margin: 22px 0 14px; color: var(--text-muted); font-size: 12px; font-weight: 700; }
  .round-divider::before, .round-divider::after { content: ""; flex: 1; height: 1px; background: var(--border-subtle); }
  .round-pill { padding: 3px 12px; border-radius: 999px; background: var(--bg-card); border: 1px solid var(--border-strong); color: var(--text-primary); }
  .msg-row { display: flex; gap: 11px; margin-bottom: 14px; align-items: flex-start; scroll-margin-top: 140px; }
  .msg-row.side-right { flex-direction: row-reverse; }
  .avatar {
    width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 18px; user-select: none; border: 1px solid var(--border-strong);
  }
  .av-host { background: rgba(56, 189, 248, 0.16); } .av-bull { background: rgba(52, 211, 153, 0.16); }
  .av-bear { background: rgba(251, 113, 133, 0.16); } .av-judge { background: rgba(192, 132, 252, 0.16); }
  .msg-body-wrap { max-width: 84%; min-width: 240px; display: flex; flex-direction: column; gap: 4px; }
  @media (max-width: 680px) { .msg-body-wrap { max-width: 89%; } }
  .msg-row.side-right .msg-body-wrap { align-items: flex-end; }
  .msg-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-secondary); padding: 0 2px; }
  .msg-row.side-right .msg-meta { flex-direction: row-reverse; }
  .sender-name { font-weight: 800; color: var(--text-primary); }
  .model-tag { font-size: 10.5px; padding: 1px 6px; border-radius: 5px; background: var(--bg-card); border: 1px solid var(--border-subtle); color: var(--text-muted); }
  .msg-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; color: var(--text-muted); }
  .act-tag { font-size: 10.5px; font-weight: 800; padding: 1.5px 7px; border-radius: 6px; }
  .act-attack { background: rgba(244, 63, 94, 0.14); color: #be123c; border: 1px solid rgba(244, 63, 94, 0.30); }
  .act-defend { background: rgba(16, 185, 129, 0.14); color: #047857; border: 1px solid rgba(16, 185, 129, 0.30); }
  .act-concede { background: rgba(245, 158, 11, 0.14); color: #b45309; border: 1px solid rgba(245, 158, 11, 0.30); }
  .act-withdraw { background: rgba(2, 132, 199, 0.14); color: #0369a1; border: 1px solid rgba(2, 132, 199, 0.30); }
  .act-verdict { background: rgba(124, 58, 237, 0.14); color: #6d28d9; border: 1px solid rgba(124, 58, 237, 0.32); }
  .act-system { background: rgba(100, 116, 139, 0.14); color: var(--text-secondary); }
  [data-theme="dark"] .act-attack { color: #fb7185; } [data-theme="dark"] .act-defend { color: #34d399; }
  [data-theme="dark"] .act-concede { color: #fbbf24; } [data-theme="dark"] .act-withdraw { color: #38bdf8; }
  [data-theme="dark"] .act-verdict { color: #d8b4fe; }
  .bubble { padding: 11px 14px; border-radius: 14px; border: 1px solid var(--border-subtle); font-size: 14px; width: 100%; transition: box-shadow 0.25s, border-color 0.25s; }
  .bubble-host { background: var(--bg-bubble-host); border-color: rgba(2, 132, 199, 0.24); }
  .bubble-bull { background: var(--bg-bubble-bull); border-color: rgba(5, 150, 105, 0.26); border-top-left-radius: 4px; }
  .bubble-bear { background: var(--bg-bubble-bear); border-color: rgba(225, 29, 72, 0.24); border-top-right-radius: 4px; }
  .bubble-judge { background: var(--bg-bubble-judge); border-color: rgba(124, 58, 237, 0.28); }
  .bubble.flash-highlight { box-shadow: 0 0 0 3px var(--highlight-ring), 0 0 24px rgba(251, 191, 36, 0.35); border-color: var(--highlight-ring); }
  .quote-box { background: var(--quote-bg); border-left: 3px solid var(--accent-gold); border-radius: 7px; padding: 6px 9px; margin-bottom: 8px; font-size: 12px; color: var(--text-secondary); cursor: pointer; }
  .quote-box:hover { filter: brightness(0.96); }
  .quote-head { font-weight: 700; color: var(--text-primary); font-size: 11.5px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
  .quote-jump { font-size: 10.5px; color: var(--accent-host); font-weight: 600; }
  .num { display: inline-block; padding: 0 5px; border-radius: 5px; background: rgba(217, 119, 6, 0.12); color: #b45309; font-weight: 800; font-variant-numeric: tabular-nums; font-size: 13px; }
  [data-theme="dark"] .num { background: rgba(251, 191, 36, 0.16); color: #fbbf24; }
  .cite-row { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .cite-chip { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--quote-bg); border: 1px solid var(--border-subtle); color: var(--text-secondary); font-weight: 600; }
  .impact-chip { font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 800; background: rgba(244, 63, 94, 0.14); color: #be123c; }
  .impact-chip.pos { background: rgba(16, 185, 129, 0.14); color: #047857; }
  [data-theme="dark"] .impact-chip { color: #fb7185; } [data-theme="dark"] .impact-chip.pos { color: #34d399; }
  .topic-tag-mini { font-size: 10.5px; padding: 1px 6px; border-radius: 5px; background: rgba(2, 132, 199, 0.10); color: var(--accent-host); cursor: pointer; font-weight: 700; }
  .mini-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; background: var(--quote-bg); border-radius: 8px; overflow: hidden; }
  .mini-table th, .mini-table td { padding: 5px 8px; border-bottom: 1px solid var(--border-subtle); text-align: left; }
  .mini-table th { color: var(--text-muted); font-weight: 700; font-size: 11px; }
  .mini-table tr:last-child td { border-bottom: none; }
  .unblind-box { margin-top: 10px; border-radius: 12px; padding: 14px; border: 1.5px dashed var(--accent-gold); background: linear-gradient(135deg, rgba(251, 191, 36, 0.10), rgba(56, 189, 248, 0.08)); }
  .unblind-sealed { text-align: center; padding: 14px 10px; }
  .unblind-content { display: none; } .unblind-content.open { display: block; animation: fadeIn 0.35s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
  .stat-card { background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: 9px; padding: 9px 10px; }
  .stat-k { font-size: 11px; color: var(--text-muted); } .stat-v { font-size: 15.5px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .matrix-view { display: none; flex-direction: column; gap: 16px; } .matrix-view.active { display: flex; }
  .chat-view.hidden { display: none; }
  .clash-card { background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: 14px; overflow: hidden; }
  .clash-header { padding: 12px 16px; background: var(--quote-bg); border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .clash-title { font-weight: 800; font-size: 14.5px; }
  .clash-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 14px; }
  @media (max-width: 820px) { .clash-grid { grid-template-columns: 1fr; } }
  .clash-col { background: var(--bg-panel); border-radius: 10px; padding: 11px; border: 1px solid var(--border-subtle); font-size: 13px; }
  .clash-col-head { font-size: 12px; font-weight: 800; margin-bottom: 6px; }
  .clash-verdict { margin: 0 14px 14px; padding: 10px 13px; border-radius: 10px; background: var(--bg-bubble-judge); border: 1px solid rgba(124, 58, 237, 0.30); font-size: 13px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="group-title-wrap">
      <div class="group-title">
        <span>⚖️ 宁德时代（300750.SZ）投委会红蓝辩论群 (4)</span>
        <span class="group-badge">V2.1 双模式 · 物理双盲 · 含加时赛</span>
      </div>
      <div class="group-sub">2026-11-25 ｜ 全程 0 现价盲定 · 2026三季报/半年报/2025年报巨潮原件 ＋ 4家同行对照</div>
    </div>
    <div class="top-actions">
      <a href="./index.html" class="btn">← 书架</a>
      <div class="mode-switch" title="一键切换大白话小白版与专业硬核版">
        <button class="mode-btn" id="btnModePlain" onclick="switchMode('plain')">🐣 小白大白话</button>
        <button class="mode-btn" id="btnModePro" onclick="switchMode('pro')">🎓 专业硬核版</button>
      </div>
      <button class="btn active" id="btnChatView" onclick="switchView('chat')">💬 群聊实景</button>
      <button class="btn" id="btnMatrixView" onclick="switchView('matrix')">⚔️ 议题对质表</button>
      <button class="btn btn-gold" onclick="jumpAndUnblind()">🔓 揭盲看现价</button>
      <button class="btn" id="btnGlossary" onclick="toggleGlossary()">📖 术语词典</button>
      <button class="btn" id="btnTheme" onclick="toggleTheme()">🌙 深色</button>
    </div>
  </div>
  <div class="roster-strip" id="rosterStrip"></div>
</header>

<div class="layout" id="mainLayout">
  <aside class="sidebar">
    <div>
      <div class="side-title">
        <span>📌 按议题追踪（一一对应）</span>
        <span style="font-weight:600;color:var(--accent-host);cursor:pointer;" onclick="filterTopic('all')">重置</span>
      </div>
      <div class="topic-list" id="topicList"></div>
    </div>
    <div class="convergence-box">
      <div class="side-title" style="margin-bottom:8px;"><span>📊 盲定数字收敛轨迹</span></div>
      <div id="convList"></div>
    </div>
  </aside>

  <main class="chat-stage">
    <div class="stage-banner">
      <span id="stageTip"></span>
      <span id="msgCounter" style="font-weight:700;color:var(--accent-host);"></span>
    </div>
    <div class="chat-view" id="chatView"></div>
    <div class="matrix-view" id="matrixView"></div>
  </main>

  <aside class="glossary-sidebar" id="glossarySidebar">

<script>
const DATA = {"company": "宁德时代", "code": "300750.SZ", "date": "2026-11-25", "default_mode": "plain", "badge": "V2.1 双模式 · 物理双盲 · 含加时赛", "subtitle": "2026-11-25 ｜ 全程 0 现价盲定 · 2026三季报/半年报/2025年报巨潮原件 ＋ 4家同行对照", "glossary": [{"key": "GWh", "match": ["GWh", "单Wh", "单瓦时"], "term": "电池产能单位（GWh / 瓦时 Wh）", "plain": "1 GWh = 10 亿瓦时（等于 100 万度电）。一辆纯电动汽车大概装 60–80 度电，所以 1 GWh 电池大约够装 1.3 万辆电车；宁德时代在建 764 GWh，相当于未来要再造出约 1,000 万辆电车的电池产能！", "usage": "「单瓦时（Wh）净利」就像算奶茶店“每卖一杯奶茶净赚几毛钱”，宁德卖 1 度电能赚约 74 元，是二线厂的 2–3 倍。"}, {"key": "出口退税", "match": ["出口退税", "加计抵减"], "term": "2027 出口退税取消 & 5% 加计抵减到期", "plain": "以前中国电池卖到国外，国家退还一部分增值税当补贴（2026 年 4 月从 9% 降到 6%，2027 年 1 月 1 日起彻底归零）。以后直接从中国出口少了一块国家退税，要么自己涨价让老外分摊，要么靠在欧洲当地建厂（德国/匈牙利/西班牙）绕过去。", "usage": "本场辩论中，双方核实宁德 2026 三季度实际收到的退税不多，按 60% 自己扛算，每年扣掉约 25 亿元利润。"}, {"key": "产销率", "match": ["产销率", "产销比"], "term": "产销率（卖出量 ÷ 生产量）", "plain": "工厂造了 100 块电池，当年实际交到客户手里结账的有 88 块，剩下 12 块还在海运路上或仓库备货里（叫发出商品/存货），产销率就是 88%。", "usage": "空头一开始误拿「产量」当分母算单块电池利润，显得利润偏低；用「实际销量」纠偏后，双方数字瞬间对齐！"}, {"key": "汇兑损失", "match": ["汇兑损失", "汇兑"], "term": "汇兑损益（汇率波动账面盈亏）", "plain": "宁德时代海外生意多，账上存着大量美元、欧元。如果人民币升值了，外币折算回人民币账面上就会少掉一块，这叫「汇兑损失」。它不是电池卖亏了，属于随汇率来回晃的一次性波动。", "usage": "2026 前三季度宁德吃了 34.4 亿汇兑哑巴亏，算“正常年份能赚多少钱”时要把它合理还原回来。"}, {"key": "联营平滑", "match": ["联营", "洛阳钼业"], "term": "联营投资收益平滑（参股洛阳钼业）", "plain": "宁德时代持有矿业巨头洛阳钼业近 25% 股份。2026 年铜价和矿价大涨，洛阳钼业给宁德贡献了上百亿投资收益。为了防矿价高位泡沫，不能按今年最高点当永续利润，必须往下砍掉一截（平滑到正常水平）。", "usage": "多头主动认领往下砍了 35.6 亿元/年，体现不吹泡沫的买方纪律。"}, {"key": "资本承诺", "match": ["资本承诺"], "term": "资本承诺（已签合同待付的建厂款）", "plain": "指报表截止日那天，公司已经签了正式工程/设备采购合同、但还没付钱的尾款余额。因为盖大工厂是边盖边分批签合同的，所以“已签余额”往往远小于未来几年的总投资。", "usage": "空头曾质疑已签合同才 98.8 亿，多头用去年对比实锤：去年底已签才 137 亿，但今年前三季实际花了 422 亿（3 倍多）。"}, {"key": "steady_oe", "term": "常态自由盈余（steady_oe / OE）", "plain": "扣掉每年修机器、换旧设备的必要花销后，这家公司正常年份「真正能装进股东口袋的纯现金利润」。就像开饭店，营业额扣掉房租水电食材和换新灶台的钱，年底能随便提现分红的那笔钱。", "usage": "买方估值最核心的分子，比账面净利润更真实，不怕会计做账粉饰。"}, {"key": "full_oe", "term": "达产自由盈余（full_oe）", "plain": "公司手里正在盖的新工厂、新产线全部建好并正常运转后，未来每年能装进股东口袋的纯现金利润。", "usage": "用来衡量公司未来 2–3 年扩产落地后的成长弹性，但必须同步扣除建厂还要花的钱（防白嫖）。"}, {"key": "ev_delta", "term": "净现金调整额（ev_delta）与真实企业价值（True EV）", "plain": "买下一整家公司的真实净成本 = 股票总市值 + 欠别人的真债 - 账上闲置可随便花的现金。如果账上闲钱比欠债多（净现金），ev_delta 就是负数，相当于你买房子发现屋里保险柜自带一箱现金，实际买价更便宜。", "usage": "估值核心分母；反向保理、少数股东份额、受限保证金全在这儿挤干水分。"}, {"key": "OCF", "term": "经营现金流（OCF）", "plain": "公司靠卖产品真正收进银行卡的现金，减去买原料发工资付出去的现金。利润表可能只是“打了白条”，经营现金流才是真金白银进账。", "usage": "检验利润含金量的照妖镜；若单季骤降要查是客户欠账（真恶化）还是主动给供应商提前结账（假警报）。"}, {"key": "FCF", "term": "自由现金流（FCF）", "plain": "经营赚进来的现金（OCF），再扣掉盖新厂、买新设备花的钱（CapEx）之后还剩的余钱。正数说明自己养活自己还有结余，负数说明还在烧钱或借钱扩张。", "usage": "判断企业是“印钞机”还是“吞金兽”的硬标准。"}, {"key": "CapEx", "term": "资本开支（CapEx）", "plain": "公司盖厂房、买生产线、买矿权这类大件固定资产花的钱。分为「维持性 CapEx」（给老产线修修补补保饭碗）和「扩张性 CapEx」（盖新厂抢增量）。", "usage": "算常态盈余必须扣维持性开支；算未来达产利润必须把剩余扩张开支从现金里扣干净。"}, {"key": "DCF", "term": "未来现金流折现估值（DCF）", "plain": "把公司未来十几年每年能赚到的真现金，按你要求的年化回报率（比如 9%）折算成今天的钱加总，算出这家公司“理论上今天值多少钱”。", "usage": "价值投资的锚定器；两阶段 DCF 会把前 3–4 年扩产爬坡期和后面的平稳永续期分开精算。"}, {"key": "RONIC", "term": "新投入资本回报率（RONIC）与再投资扣减（1 - g/RONIC）", "plain": "公司想让利润以后每年继续长 3%（g），就得每年从利润里留一部分钱继续买设备建新线，不能 100% 全分红！如果新砸 100 块每年能多赚 30 块（RONIC=30%），想每年多赚 3%，就得扣掉 3%÷30%=10% 的利润拿去再投资。", "usage": "防止估值拍高：如果忘了扣 (1 - g/RONIC)，就等于幻想公司“一分钱不投、利润凭空永续增长”。"}, {"key": "Ke", "term": "股东要求年化回报率（Ke）", "plain": "买这家公司股票，你心里要求的最低年化复合收益门槛（通常在无风险国债利率 1.6%–1.9% 上加 7% 左右风险补偿，定在 9% 左右）。", "usage": "门槛定得越高，算出来的公允股价就越保守、安全垫越厚。"}, {"key": "NPV", "term": "净现值（NPV）", "plain": "一个扩产项目未来所有赚回来的钱折算到今天，减去你要掏出去的建厂成本。NPV 大于 0 说明扩产是在给股东创造超额财富，不能当零价值忽略。", "usage": "检验高回报扩产项目（如 764 GWh 新产线）究竟值不值钱。"}, {"key": "反向保理", "term": "反向保理 / 融单（供应链金融类债）", "plain": "公司欠供应商货款先不直接付，开一张“无条件必须兑付的欠条”，供应商拿去银行提前变现拿走现金。到期时公司必须铁打不动还钱给银行，本质上就是披着应付账款外衣的“变相短期银行贷款”。", "usage": "做空法医必查科目！必须从账上净现金里扣掉，才不会把借来的钱误当成自家闲钱。"}, {"key": "少数股东权益", "term": "少数股东权益 / 归母口径", "plain": "上市公司旗下有些合资子公司不是 100% 独资（比如自己占 92%，合作伙伴占 8%）。报表合并时把 100% 的利润和现金都加进来了，但真正属于咱们买股票的小股东的只是「归母（归属母公司）」那 92%。", "usage": "分子算利润用了归母口径，分母算净现金也只能扣合作伙伴占现金的那 8%，不能胡乱全扣。"}, {"key": "质保预计负债", "term": "售后质保预计负债", "plain": "卖出去的电池承诺保修 8 年，公司提前每年从营业成本里计提一笔“保修准备金”存在账上。因为利润里已经每年扣过这笔钱了，只要公司正常持续卖货，这笔池子就不会一次性掏空。", "usage": "严守“绝不双扣”铁律：利润里已经每年扣过，就不能再当银行欠债在市值里重扣一遍。"}, {"key": "PE_PB", "term": "市盈率（PE）与市净率（PB）", "plain": "市盈率 PE = 买下公司要花几年净利润回本（如 11.6 倍就是约 11 年半回本）；市净率 PB = 股价是每股净资产（账面家底）的几倍。", "usage": "快速对比历史极值位置（比如对比 2024 年熊市大底），防止在周期底部过度恐慌。"}, {"key": "TTM", "term": "过去 12 个月滚动口径（TTM）", "plain": "Trailing Twelve Months 的缩写，就是把最近连续 4 个季度的数据加起来凑满整整一年，比如「TTM 股息率」就是过去一整年实打实发到你手里的现金分红除以今天股价。", "usage": "比看去年旧年报更及时，严禁把没落地的口头回购混进即期股息率。"}, {"key": "物理双盲", "term": "物理双盲定价（0 现价隔离）", "plain": "辩论和裁判定价期间，把今天股票实时价格彻底封在信封里，不让多头、空头、裁判偷看！逼着大家纯按公司一年赚多少钱、账上有多少净现金算出真实底价，最后由主持人拆信封对照今天现价。", "usage": "彻底杜绝人脑看到现价后“故意把买点压到现价下面一点装稳健”的心理锚定偏见。"}], "topics": [{"id": "all", "name": "全部群聊实录", "icon": "💬", "badge": ""}, {"id": "t0", "name": "双盲封箱与家底", "icon": "🔒", "badge": "0现价"}, {"id": "t1", "name": "三季度现金流之谜", "icon": "💧", "badge": "🛡️反杀"}, {"id": "t2", "name": "反向保理 504 亿", "icon": "⛓️", "badge": "🩸命中"}, {"id": "t3", "name": "保修金与合伙人账", "icon": "🛡️", "badge": "撤2刺"}, {"id": "t4", "name": "2027 退税与赚钱力", "icon": "⚡", "badge": "🩸命中"}, {"id": "t5", "name": "加时赛·估值终极死结", "icon": "🔥", "badge": "神转折"}, {"id": "t6", "name": "裁判落锤与拆封现价", "icon": "⚖️", "badge": "重锤区"}], "roles": {"host": {"name": "主席 · 宿主主持", "model": "双盲封箱", "avatar": "🏛️", "cls": "host", "side": "left"}, "bull": {"name": "多头猎手 · 林奇", "model": "Gemini 4 Neon", "avatar": "🐂", "cls": "bull", "side": "left"}, "bear": {"name": "零信任空头 · 法医", "model": "Claude Opus 5.5", "avatar": "🐻", "cls": "bear", "side": "right"}, "judge": {"name": "安全边际裁判 · 马克斯", "model": "Gemini 4 Neon", "avatar": "⚖️", "cls": "judge", "side": "left"}}, "convergence": [{"label": "常态自由盈余（steady_oe）", "label_plain": "每年真能落袋的钱", "value": "740 vs 696 → 725.0亿", "color": "judge"}, {"label": "净现金抵扣（ev_delta）", "label_plain": "账上多余净现金盾牌", "value": "1388 vs 1086 → 1267.8亿", "color": "judge"}, {"label": "公允中枢收敛轨迹", "label_plain": "合理价值从吵架到统一", "value": "350/257 → 310.0元", "color": "bull"}, {"label": "第二档正常建仓区  元，空头看 257 元！", "pos": true}}, {"id": "M08", "round": "第二轮（R2）· 逐刺铁证反杀、坦诚认账与空头致命补刀", "round_plain": "第二轮 · 多头认了一笔真账、连杀三记误判，空头突然甩出一记神补刀！", "topic": "t2", "role": "bull", "time": "10:38", "replyTo": "M03", "act": {"cls": "act-concede", "text": "🩸 爽快认账刺 2"}, "text": "复核 2026半年报 P158 原文，融单 203.91亿与反向保理 373.73亿均承担“无条件不可撤销付款义务”，银行已垫付 <b><span class=\"num\">504.06亿</span></b>！我方绝不嘴硬，全额接受空头口径，将类债扣减从 373.73亿上调至 <b><span class=\"num\">504.06亿</span></b>，归母净现金下修至 <code>-1,267.8亿</code>；同时顺应三季度节奏将常态自由盈余（steady_oe）微调至 <b><span class=\"num\">730.0亿</span></b>、达产自由盈余（full_oe）下修至 <b><span class=\"num\">980.0亿</span></b>！", "plain": "空头你这第二根刺扎得准，我翻了原版报表，融单和反向保理确实都要无条件还钱给银行，我绝不嘴硬！<b>我爽快认账：把这 <span class=\"num\">504亿</span> 全部按银行债扣掉</b>，账上多余净现金从 1,388 亿调低到 <span class=\"num\">1,268亿</span>，同时把每年落袋利润微调到 <span class=\"num\">730亿</span>！", "cites": ["📄 2026半年报 P158"], "impact": {"text": "双方常态盈余分歧骤降至 4.87%（730 vs 696）", "plain": "认账后，两人对赚钱能力的看法瞬间拉近到不到 5%！"}}, {"id": "M09", "topic": "t1", "role": "bull", "time": "10:38", "replyTo": "M02", "act": {"cls": "act-defend", "text": "🛡️ 铁证反杀刺 1"}, "text": "说三季度“现金不进门、借债填坑”完全看反了！查 2026三季报 P11 减半年报 P81：<b>三季度单季销售收现高达 <span class=\"num\">1,448.01亿</span>（收现比 <span class=\"num\">87.64%</span>）</b>，广义应收还净降 <span class=\"num\">-19.61亿</span>！钱去哪了？三季度主动净还应付账款 <b><span class=\"num\">220.67亿</span></b> + 旺季备货增存货 <span class=\"num\">139.51亿</span>，纯属响应 60 天账期的一次性付现规范化；发债则是 1.48%—1.70% 超低息科创债置换！", "plain": "但你说三季度“现金不进门”，这可是彻底看反了！翻开流水账：<b>三季度客户实打实给宁德打进了 <span class=\"num\">1,448亿</span> 真现金（回款率近 88%）</b>，欠条不仅没多反而少了 20 亿！那现金为啥只剩 14 亿？因为宁德响应 60 天结账倡议，一口气给供应商多还了 <b><span class=\"num\">221亿</span></b> 货款，又提前备了 <span class=\"num\">140亿</span> 旺季库存！发债则是借 1.5% 的超低利息省息钱，绝不是没钱填坑！", "cites": ["📄 2026三季报 P11 - 半年报 P81", "📄 2026半年报 P147"], "impact": {"text": "证伪“回款恶化”与“借债填坑”指控", "plain": "铁证反杀：不是卖不出去收不到钱，而是主动给供应商还账了！", "pos": true}}, {"id": "M10", "topic": "t3", "role": "bull", "time": "10:38", "replyTo": "M04", "act": {"cls": "act-defend", "text": "🛡️ 连杀刺 3A / 3B"}, "text": "刺 3 两处硬伤：<b>① 售后质保金 493.23亿严禁分母再扣</b>——2024→2025→2026上半年售后质保余额年净增 <span class=\"num\">120—158亿</span>，已 100% 进营业成本压低了扣非净利润，分母再扣就是教科书式分子分母双扣！<b>② 少数股东权益 363.36亿全扣违反企业价值（EV）代数</b>——分子盈余已是归母口径，分母凭什么把少数股东在子公司厂房设备的全部账面净资产从母公司现金里扣掉？只需扣少数股东占净现金的 ~8%，此项直接误杀约 <b><span class=\"num\">250亿</span></b>！", "plain": "你第三根刺里的两笔账，全算重、算错了！<br>① <b>保修金 <span class=\"num\">493亿</span> 不能再扣</b>：宁德每年利润里已经提前扣掉了 120–158 亿保修费，咱们算的赚钱能力已经是扣过保修的！你利润里扣一遍、账上现金再砍一遍，这是<b>同一笔钱罚两次（双扣）</b>！<br>② <b>合伙人 <span class=\"num\">363亿</span> 更不能全扣</b>：合伙人那 363 亿大部分是合资厂里的厂房和机器，不是现金！你把别人盖厂房的钱全从宁德母公司银行卡里扣掉，凭空把宁德现金多砍了 <b><span class=\"num\">250亿</span></b>！", "cites": ["📄 2025年报 P192", "📄 2026半年报 P75/P148"], "impact": {"text": "揪出 493亿双扣 + 250亿代数误杀，累计平反 +743亿企业价值", "plain": "连抓两处重复扣账，帮宁德平反回 743 亿元家底！", "pos": true}}, {"id": "M11", "topic": "t4", "role": "bull", "time": "10:38", "replyTo": "M05", "act": {"cls": "act-defend", "text": "🛡️ 实证反杀刺 4"}, "text": "两处漏算：第一，2026前三季财务费用 -14.47亿 vs 净利息收入 +48.84亿，<b>隐含汇兑损失高达 <span class=\"num\">-34.37亿</span></b>，你拿含汇兑损失的三季度年化还扣超额利息，却不还原汇兑！第二，三季度实收退税仅 <span class=\"num\">10.86亿</span>（旺季年化 52.13亿），按你 60% 未传导算正好 <b><span class=\"num\">-24.45亿/年</span></b>，直接自证我方 -25亿口径！修正后多头公允 <b><span class=\"num\">335.0元</span></b>（19.5倍），请复核！", "plain": "第四根刺也有两处算狠了：第一，今年前三季因为汇率波动，宁德账面吃了 <b><span class=\"num\">34.4亿</span> 汇兑哑巴亏</b>，这又不是电池卖亏了，算常态赚钱能力得加回来；第二，三季度实际拿到手的出口退税才 <span class=\"num\">10.9亿</span>，就算全年按旺季算也才 52 亿，扣掉涨价转嫁和税，每年实际影响就是 <b><span class=\"num\">25亿</span></b>（不是你算的 38 亿）！综上我把合理价微调到 <b><span class=\"num\">335元</span></b>！", "cites": ["📄 2026三季报 P9/P11", "📄 2026半年报 P77/P152"], "impact": {"text": "汇兑还原 +32亿，退税实证锁定 -25亿/年", "plain": "加回汇率波动哑巴亏，退税冲击敲定每年 25 亿", "pos": true}}, {"id": "M12", "topic": "t3", "role": "bear", "time": "10:40", "replyTo": "M10", "act": {"cls": "act-withdraw", "text": "✅ 爽快撤回 3 刺"}, "text": "硬核证据面前绝不嘴硬，我方当场撤回 3 刺：<b>① 撤少数股东全扣</b>（改按损益占比 7.15% 扣超额净现金）；<b>② 撤售后质保 493亿分母扣除</b>（承认稳态浮存金不净清偿，再扣确系双扣）；<b>③ 撤三季度回款恶化</b>（认可 87.6% 收现比，仅保留 2026 净回购为负作分红约束）；同时认汇兑加回 +32.2亿与退税 -25.0亿！", "plain": "讲证据我服气！多头刚才拿出的三页原版报表没毛病，<b>我当场撤回三根刺</b>：不再乱扣合伙人厂房钱、不再重复扣 493 亿保修金、不再说三季度回款差，也同意把汇率波动加回来、退税按 25 亿算！我只坚持一条：今年 H 股配售增发比回购多，别拿画大饼的回购吹股息率。<br>改完之后你瞧：<b>咱俩算出来的“每年落袋利润”（<span class=\"num\">723亿 vs 730亿</span>）和“多余净现金”（<span class=\"num\">1,280亿 vs 1,268亿</span>）误差不到 1%，几乎完全一致了！</b>", "cites": ["📄 2026半年报 P152", "📄 2026三季报 P11"], "impact": {"text": "财务底座惊人合拢：常态盈余 723.3 vs 730（差 0.9%），净现金 1,279.5 vs 1,267.8（差 0.9%）!", "plain": "神级名场面：多空算出来的赚钱能力和家底，居然误差不到 1%！", "pos": true}}, {"id": "M13", "topic": "t5", "role": "bear", "time": "10:40", "replyTo": "M11", "act": {"cls": "act-attack", "text": "🗡️ 致命补刀 · 漏扣再投资"}, "text": "但别高兴太早——<b>你的 19.5倍 / 335 元公允倍数，用你自己报的股东要求回报率（Ke=9%）、永续增速（g=3.5%）一算根本不成立！</b>永续增长要花钱再投资：按公式 <code>(1+增速)×(1-增速/新投入资本回报率)÷(要求回报率-增速)</code>，就算新产线回报率（RONIC）高达 30% 也只值 <b><span class=\"num\">16.06—16.62倍</span></b>！你一面在常态倍数里默认增长免费，一面又在达产口径扣 1,130亿建厂投入，同一笔增长被重复计价！按纠错后的 16.3倍，空头公允只给 <b><span class=\"num\">282.4元</span></b>（一档 ≤215.2元）！", "plain": "慢着！家底咱俩对齐了，但<b>你最后算股价时犯了一个致命数学错误！</b>你想让宁德以后每年利润继续涨 3.5%，它就必须每年从利润里留下一笔钱去买新设备，不可能一分不花、利润凭空天上掉下来！你刚才给 19.5 倍估值（335 元），等于忘了扣这笔“为了继续增长必须留下的买设备钱”！把这笔再投资钱扣掉，只配给 <b><span class=\"num\">16.3倍</span></b>，合理价只值 <b><span class=\"num\">282.4元</span></b>，根本到不了 335 元！", "cites": ["📄 永续增长再投资公式", "📄 2026半年报 P173 资本承诺98.8亿"], "impact": {"text": "R2 末尾突发重磅新刀：公允中枢仍存 18.6% 撕裂（335 vs 282.4元）", "plain": "反转！明明家底一致，合理股价却因为数学公式还差了 53 元（335 vs 282）！"}}, {"id": "M14", "round": "加时赛（R2.5）· 裁判触发法庭限时质询（2+1 新制立奇功！）", "round_plain": "加时赛 · 裁判一拍惊堂木：你们俩刚好各算漏了一半！限时回答！", "topic": "t5", "role": "judge", "time": "10:43", "replyTo": "M13", "act": {"cls": "act-verdict", "text": "🚨 触发 R2.5 加时"}, "text": "【中场收口闸门触发！】双方在常态自由盈余（steady_oe）与净现金抵扣（ev_delta）已收敛至 <span class=\"num\">&lt;1%</span>，但 R2 末尾冒出重磅倍数新刀致公允中枢分歧高达 <span class=\"num\">18.6%</span>。现启动 <b>R2.5 法庭限时短答（严禁复读旧话）</b>，直击各自漏算的一半：<br>① <b>问多头</b>：你的 362.8元现金流折现估值（DCF）终值是否漏扣了永续再投资 <code>(1 - 增速/新投入资本回报率)</code>？补扣后是多少？<br>② <b>问空头</b>：你的 16.3倍单阶段公式直接套在现有 723.3亿盈余上，是不是把 <b>在建 764 GWh 剩余 1,130亿建厂投入（CapEx）换每年 +248亿利润（增量回报 ~22%）的未来 3 年超额净现值（NPV）直接归零了</b>？显性算进两阶段估值是多少？", "plain": "<b>暂停！开启加时赛！</b>我核对完发现太有意思了——你们俩算家底误差不到 1%，但合理价还差 53 块钱，原因竟然是<b>你们刚好每人算漏了一半</b>，限时每人一句话重算：<br>① <b>问多头</b>：空头抓得对，你算远期价值时是不是忘了扣“继续增长要留下的买设备钱”？老实扣掉之后还剩多少钱？<br>② <b>问空头</b>：你也偷懒了！你直接拿 16.3 倍乘以“现在的利润”，相当于默认宁德正在盖的 <b>764 GWh 超级大新厂（花 1,130 亿每年多赚 248 亿，年化回报高达 22%！）一分钱不值、全当白送</b>！把这批在建新厂老老实实算进去，合理价是多少？", "cites": ["📄 2026半年报 P137/P173", "📄 2025年报 P26 产销率"]}, {"id": "M15", "topic": "t5", "role": "bear", "time": "10:43", "replyTo": "M14", "act": {"cls": "act-concede", "text": "🩸 空头认错上修至 300元"}, "text": "<b>🩸 认！</b>我的 16.3倍单阶段公式确实把 764 GWh 扩产超额净现值（NPV）算成了 0。现改用显性两阶段现金流折现估值（DCF，要求回报率 Ke=9%、3–4年爬坡全扣 1,130亿建厂投入、终值保留再投资扣减）：3 年爬坡值 <b><span class=\"num\">305.1元</span></b>、4 年爬坡值 <b><span class=\"num\">296.3元</span></b>、完全不扩产的纯现有产能值 <b><span class=\"num\">269.2元</span></b>！空头公允上修至 <b><span class=\"num\">≈300元</span></b>，并改用“扩产期权白送”定价：<b>二档 <span class=\"num\">251—269元</span>、一档重锤 <span class=\"num\">≤231元</span></b>！同时撤回产量分母算法（按 88.4% 产销率推单瓦时净利确为 0.075元）。", "plain": "<b>我认错！</b>裁判一针见血，我确实偷懒把在建的 764 GWh 新厂当 0 元算了！现在我老老实实把未来 3–4 年花 1,130 亿建新厂、多赚 248 亿这笔大账算进模型（同时严扣远期再投资钱）：<br>• 如果只算老工厂、在建新厂一分不算，都值 <b><span class=\"num\">269.2元</span></b>；<br>• 把在建新厂算上，3–4 年建成合理价是 <b><span class=\"num\">296—305元</span></b>（我认 <b><span class=\"num\">300元</span></b>）！<br>所以连我这个最苛刻的空头都得改口：<b>买在 <span class=\"num\">269元</span> 以下等于新厂全白送，跌到 <span class=\"num\">≤231元</span> 就是闭眼重锤区！</b>", "cites": ["📄 2025年报 P26 产销比 0.884"], "impact": {"text": "Claude Opus 5.5 极度坦诚：盲定一档重锤线上修至 ≤231元!", "plain": "震撼转折：连最狠的 Opus 5.5 空头，都把重锤买点提高到了 ≤231元！", "pos": true}}, {"id": "M16", "topic": "t5", "role": "bull", "time": "10:43", "replyTo": "M14", "act": {"cls": "act-concede", "text": "🩸 多头认错下修至 322元"}, "text": "<b>🩸 认！</b>坦承 R2 的 362.8元现金流折现估值（DCF）终值确实漏扣了永续再投资 <code>(1 - 增速/新投入资本回报率)</code>。现补扣终值再投资并全额扣 3 年 1,130亿建厂投入（要求回报率 Ke=9%、新投入资本回报率 RONIC 25%–30%）：增速 3.0% 对应 <span class=\"num\">302.1—307.7元</span>，增速 3.5% 对应 <span class=\"num\">319.7—326.9元</span>。我方诚实将公允价从 335元下修至 <b><span class=\"num\">320—325元</span></b>（中枢 322元）。另查 2026半年报 P173，2025年末资本承诺仅 137亿而今年前三季实付建厂 422亿（3.07倍），证伪已签合同额为投资上限！", "plain": "<b>我也认错！</b>刚才确实忘了扣远期“为了继续增长要留下的买设备钱”。我现在老实扣掉，并把未来 3 年要花的 1,130 亿建厂钱全额算进去，重算下来合理价是 <b><span class=\"num\">302—327元</span></b>，我诚实把自己的合理价从 335 元降到 <b><span class=\"num\">322元</span></b>！另外证明一下：宁德建厂是边盖边签合同的，去年底已签合同才 137 亿，但今年前三季实打实花了 422 亿，所以 1,130 亿建厂预算没毛病。", "cites": ["📄 2026半年报 P130/P137/P173", "📄 2025年报 P26"], "impact": {"text": "R2.5 神收口：多空公允中枢从 350 vs 257 收敛至 322 vs 300（仅差 7%）!", "plain": "加时赛封神！两人一开始差 93 元，现在彻底收敛到 300 vs 322（只差 7%）！", "pos": true}}, {"id": "M17", "round": "第三轮（R3）· 裁判物理双盲终审落锤（0 现价终极坐标）", "round_plain": "第三轮 · 裁判一锤定音：不偷看现价，敲定唯一买点价目表", "topic": "t6", "role": "judge", "time": "10:46", "act": {"cls": "act-verdict", "text": "⚖️ 物理双盲终审落锤"}, "text": "经 Python 独立核验巨潮原件，多空财务底座已收敛至 <span class=\"num\">&lt;1%</span>、公允中枢收口至 <span class=\"num\">300—322元</span>。按三道铁闸正式定标（法定总股本 46.2725 亿股，纯 A 股人民币）：<br>• 净现金抵扣（ev_delta）= <code>-1,267.80亿</code>（含全额 504.06亿反向保理类债化、350亿底仓、92%归母）｜达产净现金抵扣（full_ev_delta）= <code>-137.80亿</code>（全扣 1,130亿扩产净投入）<br>• 常态自由盈余（steady_oe）= <code>725.00亿/年</code>（扣联营平滑 -35.6亿、2027 退税 -25亿、剥息 -21.6亿、还原汇兑 +31.9亿）｜达产自由盈余（full_oe）= <code>973.00亿/年</code><br>• <b>公允价值中枢 <span class=\"num\">310.00元</span></b>（两阶段 DCF 要求回报率 9%/永续增速 3.25%/新投资回报率 28%）｜<b>二档建仓 <span class=\"num\">230—272元</span></b>（272元以下等于 764 GWh 扩产免费白送）｜<b>一档左侧重锤 <span class=\"num\">≤230.00元</span></b>｜定级 <b>T1</b>（上限 15%）！", "plain": "漂亮！经过两轮正赛加一轮加时赛，你们俩从天壤之别吵成了高度一致！我用程序逐项核对官方报表后，正式一锤定音（此时我们依然不知道今天股价）：<br>• <b>账上真正多余的闲钱</b>：扣完 504 亿反向保理、350 亿运营备付金、算清合伙人份额后，还稳稳躺着 <b><span class=\"num\">1,267.8亿</span></b> 纯净现金！<br>• <b>每年真能落袋的钱</b>：挤干政府补贴、砍掉矿价高点泡沫、实扣 2027 退税 25 亿后，现在每年稳赚 <b><span class=\"num\">725亿</span></b>；等花掉 1,130 亿把在建新厂盖好，每年稳赚 <b><span class=\"num\">973亿</span></b>！<br>• <b>终审价目表</b>：<b>合理值 <span class=\"num\">310元</span></b>；跌到 <b><span class=\"num\">230—272元</span></b> 等于在建大新厂全部白送，可以安心买底仓；如果 const COLOR_MAP = {
  host: 'var(--accent-host)', bull: 'var(--accent-bull)',
  bear: 'var(--accent-bear)', judge: 'var(--accent-judge)', gold: 'var(--accent-gold)'
};

let currentTopic = 'all';
let currentRole = 'all';
let currentMode = DATA.default_mode || 'plain';
let isUnblinded = false;

function getText(obj, proKey, plainKey) {
  if (currentMode === 'plain' && obj && obj[plainKey]) return obj[plainKey];
  return (obj && obj[proKey]) || '';
}

function linkifyTerms(htmlStr) {
  if (!htmlStr || !GLOSSARY.length) return htmlStr;
  // Highlight known abbreviations/keywords safely outside HTML tags
  const rules = [];
  GLOSSARY.forEach(g => {
    const keys = (g.match || [g.key]).filter(k => k && k.length >= 2);
    keys.forEach(k => rules.push({ k, key: g.key, tip: g.term + '：' + g.plain }));
  });
  rules.sort((a, b) => b.k.length - a.k.length);
  const parts = htmlStr.split(/(<[^>]+>)/g);
  for (let i = 0; i < parts.length; i += 2) {
    let seg = parts[i];
    if (!seg) continue;
    const replaced = new Set();
    for (const r of rules) {
      if (replaced.has(r.key)) continue;
      const esc = r.k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(esc);
      if (re.test(seg)) {
        const safeTip = r.tip.replace(/"/g, '&quot;');
        seg = seg.replace(re, `<span class="term-link" title="${safeTip}" onclick="jumpToTerm('${r.key}')">$&</span>`);
        replaced.add(r.key);
      }
    }
    parts[i] = seg;
  }
  return parts.join('');
}

function renderTopics() {
  document.getElementById('topicList').innerHTML = TOPICS.map(t => {

  }).join('');
}

function renderGlossary() {
  const q = (document.getElementById('glossarySearch').value || '').trim().toLowerCase();
  const list = GLOSSARY.filter(g =>
    !q || (g.term + ' ' + g.key + ' ' + g.plain + ' ' + (g.usage||'')).toLowerCase().includes(q)
  );
  document.getElementById('glossaryList').innerHTML = list.map(g => `
    <div class="g-card" id="term-${g.key}">
      <div class="g-term">📘 ${g.term}</div>
      <div class="g-plain">${g.plain}</div>
      ${g.usage ? `<div class="g-usage">🎯 实战用法：${g.usage}</div>` : ''}
    </div>
  `).join('') || `<div style="font-size:12px;color:var(--text-muted);text-align:center;padding:16px;">未找到匹配术语</div>`;
}

function toggleGlossary() {
  const layout = document.getElementById('mainLayout');
  const side = document.getElementById('glossarySidebar');
  if (window.innerWidth <= 1200) {
    side.classList.toggle('drawer-open');
  } else {
    layout.classList.toggle('hide-glossary');
  }
}

function jumpToTerm(key) {
  const layout = document.getElementById('mainLayout');
  const side = document.getElementById('glossarySidebar');
  if (window.innerWidth <= 1200) {
    side.classList.add('drawer-open');
  } else {
    layout.classList.remove('hide-glossary');
  }
  const search = document.getElementById('glossarySearch');
  if (search && search.value) { search.value = ''; renderGlossary(); }
  const card = document.getElementById('term-' + key);
  if (card) {
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.classList.remove('flash-term');
    void card.offsetWidth;
    card.classList.add('flash-term');
    setTimeout(() => card.classList.remove('flash-term'), 2400);
  }
}

function buildUnblindHTML() {
  if (!UNBLIND) return '';
  const statsArr = (currentMode === 'plain' && UNBLIND.stats_plain) ? UNBLIND.stats_plain : (UNBLIND.stats || []);
  const statsHtml = statsArr.map(s =>
    `<div class="stat-card"><div class="stat-k">${s.k}</div><div class="stat-v" style="color:${COLOR_MAP[s.color]||'var(--text-primary)'};">${s.v}</div></div>`
  ).join('');
  const hdrs = (currentMode === 'plain' && UNBLIND.grid_headers_plain) ? UNBLIND.grid_headers_plain : UNBLIND.grid_headers;
  const rows = (currentMode === 'plain' && UNBLIND.grid_rows_plain) ? UNBLIND.grid_rows_plain : UNBLIND.grid_rows;
  const tblHtml = (hdrs && rows)
    ? `<table class="mini-table" style="margin-top:10px;"><thead><tr>${hdrs.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`
      + rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')
      + `</tbody></table>` : '';
  return `<div class="unblind-box">
    <div class="unblind-sealed" id="unblindSealed" style="display:${isUnblinded?'none':'block'};">
      <div style="font-size:15px;font-weight:800;margin-bottom:6px;">${UNBLIND.sealed_title||'🔒 实时股价信封已封存'}</div>

    </div>
    <div class="unblind-content ${isUnblinded?'open':''}" id="unblindContent">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
        <span style="font-weight:800;font-size:15px;color:var(--accent-gold);">${UNBLIND.header_title||''}</span>
        ${UNBLIND.header_badge ? `<span class="act-tag act-concede">${UNBLIND.header_badge}</span>` : ''}
      </div>
      <div class="grid-cards">${statsHtml}</div>

    if (tblObj) {
      tableHtml = `<table class="mini-table"><thead><tr>${tblObj.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`
        + tblObj.rows.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('') + `</tbody></table>`;
    }
    let citesHtml = '';
    if ((m.cites && m.cites.length) || m.impact) {
      const impText = m.impact ? getText(m.impact, 'text', 'plain') : '';
      citesHtml = `<div class="cite-row">`
        + (m.cites || []).map(c => `<span class="cite-chip">${c}</span>`).join('')
        + (m.impact ? `<span class="impact-chip ${m.impact.pos?'pos':''}">${impText}</span>` : '')
        + `</div>`;
    }
    const bodyHtml = linkifyTerms(getText(m, 'text', 'plain'));
    out += `<div class="msg-row ${r.side==='right'?'side-right':''}" id="msg-${m.id}">
      <div class="avatar av-${r.cls}">${r.avatar}</div>
      <div class="msg-body-wrap">
        <div class="msg-meta">
          <span class="sender-name">${r.name}</span>
          <span class="model-tag">${r.model}</span>
          ${m.act ? `<span class="act-tag ${m.act.cls}">${m.act.text}</span>` : ''}
          ${tObj ? `<span class="topic-tag-mini" onclick="filterTopic('${m.topic}')">${tObj.icon||''} ${tObj.name.split('·')[0].trim()}</span>` : ''}
          <span class="msg-id">${m.id} · ${m.time||''}</span>
        </div>
        <div class="bubble bubble-${r.cls}" id="bubble-${m.id}">
          ${quoteHtml}<div>${bodyHtml}</div>${tableHtml}${m.isUnblindBox?buildUnblindHTML():''}${citesHtml}
        </div>
      </div>
    </div>`;
  });
  container.innerHTML = out || `<div style="text-align:center;padding:48px 16px;color:var(--text-muted);">当前筛选条件下暂无发言。</div>`;
}

function renderMatrix() {
  const el = document.getElementById('matrixView');
  const cards = (currentTopic === 'all' || !CLASH_CARDS.some(c => c.topic === currentTopic))
    ? CLASH_CARDS : CLASH_CARDS.filter(c => c.topic === currentTopic);
  el.innerHTML = cards.map(c => `<div class="clash-card">
    <div class="clash-header">
      <span class="clash-title">${getText(c, 'title', 'title_plain')}</span>
      <div style="display:flex;gap:8px;align-items:center;">
        <span class="act-tag act-verdict">${c.verdictBadge}</span>
        <button class="btn" style="padding:3px 9px;font-size:11.5px;" onclick="viewTopicInChat('${c.topic}')">💬 回群聊看原话</button>
      </div>
    </div>
    <div class="clash-grid">
      <div class="clash-col"><div class="clash-col-head" style="color:var(--accent-bear);">🐻 空头亮刺</div><div>${linkifyTerms(getText(c, 'bear', 'bear_plain'))}</div></div>
      <div class="clash-col"><div class="clash-col-head" style="color:var(--accent-bull);">🐂 多头反杀/认领</div><div>${linkifyTerms(getText(c, 'bull', 'bull_plain'))}</div></div>
      <div class="clash-col"><div class="clash-col-head" style="color:var(--accent-host);">🔄 核验补刀 / 撤回</div><div>${linkifyTerms(getText(c, 'rebuttal', 'rebuttal_plain'))}</div></div>
    </div>
    <div class="clash-verdict">${linkifyTerms(getText(c, 'judge', 'judge_plain'))}</div>
  </div>`).join('');
}

function filterTopic(tid) { currentTopic = tid; renderTopics(); renderChat(); renderMatrix(); }
function filterRole(role) { currentRole = role; renderRoster(); renderChat(); }
function switchView(v) {
  document.getElementById('btnChatView').classList.toggle('active', v === 'chat');
  document.getElementById('btnMatrixView').classList.toggle('active', v === 'matrix');
  document.getElementById('chatView').classList.toggle('hidden', v !== 'chat');
  document.getElementById('matrixView').classList.toggle('active', v === 'matrix');
}
function viewTopicInChat(tid) { switchView('chat'); filterRole('all'); filterTopic(tid); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function jumpToMsg(id) {
  let target = document.getElementById('msg-' + id);
  if (!target) { currentTopic = 'all'; currentRole = 'all'; renderRoster(); renderTopics(); renderChat(); target = document.getElementById('msg-' + id); }
  if (target) {
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const b = document.getElementById('bubble-' + id);
    if (b) { b.classList.remove('flash-highlight'); void b.offsetWidth; b.classList.add('flash-highlight'); setTimeout(() => b.classList.remove('flash-highlight'), 2200); }
  }
}
function doUnblind() { isUnblinded = true; const s = document.getElementById('unblindSealed'), c = document.getElementById('unblindContent'); if (s) s.style.display = 'none'; if (c) c.classList.add('open'); }
function jumpAndUnblind() {
  switchView('chat'); isUnblinded = true; currentTopic = 'all'; currentRole = 'all';
  renderRoster(); renderTopics(); renderChat();
  const ub = MESSAGES.find(m => m.isUnblindBox);
  if (ub) setTimeout(() => jumpToMsg(ub.id), 60);
}
function toggleTheme() {
  const h = document.documentElement, n = h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  h.setAttribute('data-theme', n); document.getElementById('btnTheme').textContent = n === 'dark' ? '☀️ 浅色' : '🌙 深色';
}

renderModeUI(); renderRoster(); renderConvergence(); renderTopics(); renderGlossary(); renderChat(); renderMatrix();
</script>
</body>
</html>
