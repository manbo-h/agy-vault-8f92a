渠道革命型", "company": "贵州茅台", "code": "600519.SH", "stage_name": "第三跃迁：穿越三公寒冬 × 民间消费接棒 × 外资重估冲万亿（1,249亿 → 9,763亿）", "period": "2014.01—2018.01", "mktcap_leap": "1,248.9亿 → 9,763.4亿（7.82倍）", "archetype": "经营效率与渠道革命型", "lead_lag_type": "⚡ 双击共振型", "early_filing_clues": ["在同行业绩腰斩的大寒冬里，茅台2013—2015年营收竟然实现正增长（311亿→322亿→334亿），证明民间承接力远超市场想象。", "两大核弹级先行指纹：①在建工程从2013年4.56亿暴涨至2015年48.95亿（占固定资产42.9%）；②预收账款从2014年末冰点14.76亿暴涨460%至2015年末82.62亿，2016年末再翻倍至175.41亿（当年OCF 374.5亿，是净利的2.24倍）！"], "trigger_mechanism": "2017Q3单季净利暴增+138.4%（蓄水池彻底开闸）；时隔5年官宣提价18.3%至969元 + 沪港通/MSCI外资重估", "small_cap_playbook": "当消费或制造业龙头经历政策/行业黑天鹅后账面利润看似停滞，但「合同负债(预收款)同比暴增>100% + 经营现金流远超净利润 + 行业寒冬逆势建厂(在建工程激增)」同时亮灯，说明真实需求已拐点反转，利润表爆发只差2—4个季度！"}, {"pattern_id": "600519.SH_S4_治理整合与整体上市型", "company": "贵州茅台", "code": "600519.SH", "stage_name": "第四跃迁：反腐清理渠道回收价差 × 核心资产登顶3.27万亿（6,996亿 → 32,674亿）", "period": "2018.11—2021.02", "mktcap_leap": "6,995.8亿 → 32,673.7亿（4.67倍）", "archetype": "治理整合与整体上市型", "lead_lag_type": "🏃 股价抢跑型", "early_filing_clues": ["财报披露直销收入占比从2018年5.9%跳升至2019年8.5%、2020年14.0%、2021年22.7%（并在2022年i茅台上线后一路狂飙至2025年50.1%过半），即使不提969元出厂价也能靠渠道结构变相提价。", "2018—2020年ROE稳定在29%—31%，经营现金流连续三年突破414亿→452亿→517亿，零有息负债、账上躺着上千亿现金。"], "trigger_mechanism": "2018Q4(+47.6%)与2019Q1(+31.9%)连环证伪崩盘论；疫情后全球大放水 + 公募爆款基金极致抱团", "small_cap_playbook": "国企或家族消费龙头若出现「渠道灰色价差巨大（批价远高于出厂价）+ 新管理层铁腕反腐收权 + 直销占比从个位数起步跳升」，往往释放巨大隐蔽利润；但切记给10%—15%增速的成熟龙头盯死估值上限（PE突破历史80%分位38x—50x必须兑现止盈）。"}]};
    let curArch = 'ALL', curLL = 'ALL', curComp = 'ALL';
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    const pats = LIB.patterns || [];
    const comps = LIB.companies_indexed || [];
    const cntPerf = pats.filter(p => (p.lead_lag_type||'').includes('业绩')).length;
    const cntPrice = pats.filter(p => (p.lead_lag_type||'').includes('股价')).length;
    const cntBoth = pats.filter(p => (p.lead_lag_type||'').includes('双击')).length;

    document.getElementById('hub-kpis').innerHTML = `
      <div class="kpi"><div class="kpi-k">已解剖巨头样板</div><div class="kpi-v num" style="color:var(--accent)">${comps.length} 家</div></div>
      <div class="kpi"><div class="kpi-k">沉淀可复用跃迁原型</div><div class="kpi-v num" style="color:var(--purple)">${pats.length} 条</div></div>
      <div class="kpi"><div class="kpi-k">🐢 业绩抢跑型（可等右侧）</div><div class="kpi-v num" style="color:var(--emerald)">${cntPerf} 条</div></div>
      <div class="kpi"><div class="kpi-k">⚡ 双击 / 🏃 股价抢跑型</div><div class="kpi-v num" style="color:var(--rose)">${cntBoth + cntPrice} 条</div></div>
    `;

    const uniq = arr => Array.from(new Set(arr.filter(Boolean)));
    const archs = uniq(pats.map(p => p.archetype));
    const lls = uniq(pats.map(p => p.lead_lag_type));
    const cnames = uniq(pats.map(p => p.company));

    function renderFilters() {
      document.getElementById('f-arch').innerHTML = `<span class="filter-lbl">跃迁原型：</span>` +
        `<button class="chip ${curArch==='ALL'?'active':''}" onclick="curArch='ALL';renderFilters();renderCards()">全部</button>` +
        archs.map(a => `<button class="chip ${curArch===a?'active':''}" onclick="curArch='${esc(a)}';renderFilters();renderCards()">${esc(a)}</button>`).join('');
      document.getElementById('f-ll').innerHTML = `<span class="filter-lbl">业绩/股价节奏：</span>` +
        `<button class="chip ${curLL==='ALL'?'active':''}" onclick="curLL='ALL';renderFilters();renderCards()">全部</button>` +
        lls.map(x => `<button class="chip ${curLL===x?'active':''}" onclick="curLL='${esc(x)}';renderFilters();renderCards()">${esc(x)}</button>`).join('');
      document.getElementById('f-comp').innerHTML = `<span class="filter-lbl">来源巨头：</span>` +
        `<button class="chip ${curComp==='ALL'?'active':''}" onclick="curComp='ALL';renderFilters();renderCards()">全部</button>` +
        cnames.map(c => `<button class="chip ${curComp===c?'active':''}" onclick="curComp='${esc(c)}';renderFilters();renderCards()">${esc(c)}</button>`).join('');
    }

    function renderCards() {
      const q = (document.getElementById('q').value || '').trim().toLowerCase();
      const filtered = pats.filter(p => {
        if (curArch !== 'ALL' && p.archetype !== curArch) return false;
        if (curLL !== 'ALL' && p.lead_lag_type !== curLL) return false;
        if (curComp !== 'ALL' && p.company !== curComp) return false;
        if (q) {
          const hay = JSON.stringify(p).toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
      document.getElementById('cards').innerHTML = filtered.length ? filtered.map(p => {
        const llCls = (p.lead_lag_type||'').includes('业绩') ? 'em' : ((p.lead_lag_type||'').includes('股价') ? 'ro' : 'pu');
        const clues = (p.early_filing_clues || []).map(c => `<div>• ${esc(c)}</div>`).join('');
        return `
          <div class="pcard">
            <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
              <span class="pill em">🧬 ${esc(p.archetype)}</span>
              <span class="pill ${llCls}">${esc(p.lead_lag_type || '')}</span>
            </div>
            <div>
              <div style="font-size:15.5px;font-weight:800">${esc(p.company)} · ${esc(p.stage_name)}</div>
              <div class="num" style="font-size:12px;color:var(--purple);margin-top:2px">${esc(p.period)} ｜ 市值跃迁：${esc(p.mktcap_leap)}</div>
            </div>
            ${clues ? `<div class="box-clue"><strong>🔎 提前 1–2 年财报/公告指纹：</strong>${clues}</div>` : ''}
            <div style="font-size:12.5px;color:var(--muted)"><strong>⚡ 引爆机制：</strong>${esc(p.trigger_mechanism)}</div>
            <div class="box-rule"><strong>🧭 小市值实战复用口诀：</strong>${esc(p.small_cap_playbook)}</div>
            <div class="card-foot">
              <span class="num">${esc(p.code)}</span>
              <a class="link" href="./${encodeURIComponent(p.company + '_上市跃迁图谱.html')}">查看该巨头完整跃迁图谱 →</a>
            </div>
          </div>
        `;
      }).join('') : '<div style="color:var(--muted);padding:24px">未匹配到符合条件的跃迁模式</div>';
    }
    renderFilters();
    renderCards();
  </script>
