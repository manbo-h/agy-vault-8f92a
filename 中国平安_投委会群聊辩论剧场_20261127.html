<head>

<style>

    --bg-panel: #111827;
    --bg-card: #1e293b;
    --bg-card-hover: #273549;
    --bg-bubble-host: #172554;
    --bg-bubble-bull: #052e2b;
    --bg-bubble-bear: #33131c;
    --bg-bubble-judge: #251a3f;
    --border-subtle: rgba(148, 163, 184, 0.16);
    --border-strong: rgba(148, 163, 184, 0.30);
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent-host: #38bdf8;
    --accent-bull: #34d399;
    --accent-bear: #fb7185;
    --accent-judge: #c084fc;

  .layout {

  .sidebar, .glossary-sidebar {

  .topic-list { display: flex; flex-direction: column; gap: 5px; }
  .topic-btn {

  .topic-btn > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .g-card:hover { border-color: var(--accent-host); }

  .g-term { font-weight: 800; font-size: 12.5px; color: var(--accent-host); margin-bottom: 3px; }

  /* 正文内联可点击术语胶囊 */
  .term-link {
    border-bottom: 1.5px dashed var(--accent-host); cursor: help; font-weight: 700;
    color: inherit; padding: 0 1px; border-radius: 3px; transition: background 0.15s;
  }
  .term-link:hover { background: rgba(2, 132, 199, 0.14); }

  .chat-stage { background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 16px 18px 28px; min-height: 75vh; }
  .stage-banner {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    padding: 10px 13px; border-radius: 11px; margin-bottom: 16px;
    background: var(--bg-card); border: 1px solid var(--border-subtle); font-size: 12.5px; color: var(--text-secondary);
  }
  .mode-pill-banner {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 800;
    padding: 2px 9px; border-radius: 999px;
  }
  .mode-pill-banner.plain { background: rgba(16, 185, 129, 0.15); color: #059669; }
  .mode-pill-banner.pro { background: rgba(99, 102, 241, 0.15); color: #4f46e5; }
  [data-theme="dark"] .mode-pill-banner.plain { color: #34d399; }
  [data-theme="dark"] .mode-pill-banner.pro { color: #a5b4fc; }

  .round-divider { display: flex; align-items: center; gap: 10px; margin: 22px 0 14px; color: var(--text-muted); font-size: 12px; font-weight: 700; }
  .round-divider::before, .round-divider::after { content: ""; flex: 1; height: 1px; background: var(--border-subtle); }
  .round-pill { padding: 3px 12px; border-radius: 999px; background: var(--bg-card); border: 1px solid var(--border-strong); color: var(--text-primary); }
  .msg-row { display: flex; gap: 11px; margin-bottom: 14px; align-items: flex-start; scroll-margin-top: 140px; }
  .msg-row.side-right { flex-direction: row-reverse; }
  .avatar {
    width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 18px; user-select: none; border: 1px solid var(--border-strong);
  }
  .av-host { background: rgba(56, 189, 248, 0.16); } .av-bull { background: rgba(52, 211, 153, 0.16); }
  .av-bear { background: rgba(251, 113, 133, 0.16); } .av-judge { background: rgba(192, 132, 252, 0.16); }
  .msg-body-wrap { max-width: 84%; min-width: 240px; display: flex; flex-direction: column; gap: 4px; }
  @media (max-width: 680px) { .msg-body-wrap { max-width: 89%; } }
  .msg-row.side-right .msg-body-wrap { align-items: flex-end; }
  .msg-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-secondary); padding: 0 2px; }
  .msg-row.side-right .msg-meta { flex-direction: row-reverse; }
  .sender-name { font-weight: 800; color: var(--text-primary); }
  .model-tag { font-size: 10.5px; padding: 1px 6px; border-radius: 5px; background: var(--bg-card); border: 1px solid var(--border-subtle); color: var(--text-muted); }
  .msg-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; color: var(--text-muted); }
  .act-tag { font-size: 10.5px; font-weight: 800; padding: 1.5px 7px; border-radius: 6px; }
  .act-attack { background: rgba(244, 63, 94, 0.14); color: #be123c; border: 1px solid rgba(244, 63, 94, 0.30); }
  .act-defend { background: rgba(16, 185, 129, 0.14); color: #047857; border: 1px solid rgba(16, 185, 129, 0.30); }
  .act-concede { background: rgba(245, 158, 11, 0.14); color: #b45309; border: 1px solid rgba(245, 158, 11, 0.30); }
  .act-withdraw { background: rgba(2, 132, 199, 0.14); color: #0369a1; border: 1px solid rgba(2, 132, 199, 0.30); }
  .act-verdict { background: rgba(124, 58, 237, 0.14); color: #6d28d9; border: 1px solid rgba(124, 58, 237, 0.32); }
  .act-system { background: rgba(100, 116, 139, 0.14); color: var(--text-secondary); }
  [data-theme="dark"] .act-attack { color: #fb7185; } [data-theme="dark"] .act-defend { color: #34d399; }
  [data-theme="dark"] .act-concede { color: #fbbf24; } [data-theme="dark"] .act-withdraw { color: #38bdf8; }
  [data-theme="dark"] .act-verdict { color: #d8b4fe; }
  .bubble { padding: 11px 14px; border-radius: 14px; border: 1px solid var(--border-subtle); font-size: 14px; width: 100%; transition: box-shadow 0.25s, border-color 0.25s; }
  .bubble-host { background: var(--bg-bubble-host); border-color: rgba(2, 132, 199, 0.24); }
  .bubble-bull { background: var(--bg-bubble-bull); border-color: rgba(5, 150, 105, 0.26); border-top-left-radius: 4px; }
  .bubble-bear { background: var(--bg-bubble-bear); border-color: rgba(225, 29, 72, 0.24); border-top-right-radius: 4px; }
  .bubble-judge { background: var(--bg-bubble-judge); border-color: rgba(124, 58, 237, 0.28); }
  .bubble.flash-highlight { box-shadow: 0 0 0 3px var(--highlight-ring), 0 0 24px rgba(251, 191, 36, 0.35); border-color: var(--highlight-ring); }
  .quote-box { background: var(--quote-bg); border-left: 3px solid var(--accent-gold); border-radius: 7px; padding: 6px 9px; margin-bottom: 8px; font-size: 12px; color: var(--text-secondary); cursor: pointer; }
  .quote-box:hover { filter: brightness(0.96); }
  .quote-head { font-weight: 700; color: var(--text-primary); font-size: 11.5px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
  .quote-jump { font-size: 10.5px; color: var(--accent-host); font-weight: 600; }
  .num { display: inline-block; padding: 0 5px; border-radius: 5px; background: rgba(217, 119, 6, 0.12); color: #b45309; font-weight: 800; font-variant-numeric: tabular-nums; font-size: 13px; }
  [data-theme="dark"] .num { background: rgba(251, 191, 36, 0.16); color: #fbbf24; }
  .cite-row { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .cite-chip { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--quote-bg); border: 1px solid var(--border-subtle); color: var(--text-secondary); font-weight: 600; }
  .impact-chip { font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 800; background: rgba(244, 63, 94, 0.14); color: #be123c; }
  .impact-chip.pos { background: rgba(16, 185, 129, 0.14); color: #047857; }
  [data-theme="dark"] .impact-chip { color: #fb7185; } [data-theme="dark"] .impact-chip.pos { color: #34d399; }
  .topic-tag-mini { font-size: 10.5px; padding: 1px 6px; border-radius: 5px; background: rgba(2, 132, 199, 0.10); color: var(--accent-host); cursor: pointer; font-weight: 700; }
  .mini-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; background: var(--quote-bg); border-radius: 8px; overflow: hidden; }
  .mini-table th, .mini-table td { padding: 5px 8px; border-bottom: 1px solid var(--border-subtle); text-align: left; }
  .mini-table th { color: var(--text-muted); font-weight: 700; font-size: 11px; }
  .mini-table tr:last-child td { border-bottom: none; }
  .unblind-box { margin-top: 10px; border-radius: 12px; padding: 14px; border: 1.5px dashed var(--accent-gold); background: linear-gradient(135deg, rgba(251, 191, 36, 0.10), rgba(56, 189, 248, 0.08)); }
  .unblind-sealed { text-align: center; padding: 14px 10px; }
  .unblind-content { display: none; } .unblind-content.open { display: block; animation: fadeIn 0.35s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
  .stat-card { background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: 9px; padding: 9px 10px; }
  .stat-k { font-size: 11px; color: var(--text-muted); } .stat-v { font-size: 15.5px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .matrix-view { display: none; flex-direction: column; gap: 16px; } .matrix-view.active { display: flex; }
  .chat-view.hidden { display: none; }
  .clash-card { background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: 14px; overflow: hidden; }
  .clash-header { padding: 12px 16px; background: var(--quote-bg); border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .clash-title { font-weight: 800; font-size: 14.5px; }
  .clash-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 14px; }
  @media (max-width: 820px) { .clash-grid { grid-template-columns: 1fr; } }
  .clash-col { background: var(--bg-panel); border-radius: 10px; padding: 11px; border: 1px solid var(--border-subtle); font-size: 13px; }
  .clash-col-head { font-size: 12px; font-weight: 800; margin-bottom: 6px; }
  .clash-verdict { margin: 0 14px 14px; padding: 10px 13px; border-radius: 10px; background: var(--bg-bubble-judge); border: 1px solid rgba(124, 58, 237, 0.30); font-size: 13px; }
</style>

<header class="topbar">
  <div class="topbar-inner">

      <button class="btn" id="btnTheme" onclick="toggleTheme()">🌙 深色</button>

  </div>
  <div class="roster-strip" id="rosterStrip"></div>
</header>

<div class="layout" id="mainLayout">

    <div>

        <span>📌 按议题追踪（一一对应）</span>

      </div>
      <div class="topic-list" id="topicList"></div>
    </div>
    <div class="convergence-box">
      <div class="side-title" style="margin-bottom:8px;"><span>📊 盲定数字收敛轨迹</span></div>
      <div id="convList"></div>
    </div>
  </aside>

  <main class="chat-stage">

有个经典公式叫「(ROE - 增速) ÷ (要求回报 - 增速)」，它背后暗藏一个铁律：没用来增长的利润必须全部现金分红！多头第一轮套了 12.6% 的收益率和 1.5% 的低增速，数学上等于假设平安把 88% 的利润全分给股东了！但平安实际只分红 36.4%，剩下钱要留着补监管资本和消化负 OCI，这就把合理价虚抬了十几块钱。空头一剑捅破后，裁判喊停加时赛直接帮多头把水分挤干！", "usage": "空头 Claude Opus 5.5 在第二轮扭转估值战局的教科书级补刀。"}, {"key": "可转债摊薄与化债回补", "match": ["可转债", "190.28亿股", "9.21亿股", "355亿", "412.44亿", "57.05元", "100%尚未动用"], "term": "境外可转债（摊薄股本 vs 化债回补 + 100% 未动用）", "plain": "平安在海外发了两笔极低息的 H 股可转债（35 亿美元 + 117.65 亿港元）。如果以后全换成股票，总股本会多出 9.21 亿股（稀释约 5.1%）；但好消息是债转成股后，账上 412.44 亿的债务和期权负债会瞬间一笔勾销变成净资产，而且 26 中报 102 页白纸黑字写着融来的 355 亿现金一分钱还没动！一增一抵，真实净稀释只有约 2%。", "usage": "既彻底反杀了“借新债还分红”的误判，又精准算清了每股摊薄成本。"}, {"key": "AH五年折价走廊", "match": ["五年走廊", "折价走廊", "20.0%", "14.3%", "港股通红利税", "50.55港元", "65.55港元"], "term": "A+H 股 5 年真实折价走廊与港股通红利税算账", "plain": "同一家平安，港股历史上常年比 A 股便宜 11.2% 左右（过去 5 年大部分时间在 5.7%—18.3% 折价之间晃荡）。今天港股比 A 股足足便宜了 20.0%，已经跌穿了过去 5 年 75% 分位！内地买港股通分红要扣 20% 红利税，但因为本金便宜了两成，算下来港股扣完税到手的股息率（5.08%）依然跟 A 股税前完全一样，还白捡了两成安全垫！", "usage": "宿主揭盲后决定“同股同权优先买 H 股”的核心数学依据。"}, {"key": "steady_oe", "term": "常态自由盈余（steady_oe / OE）", "plain": "扣掉每年修机器、换旧设备的必要花销后，这家公司正常年份「真正能装进股东口袋的纯现金利润」。就像开饭店，营业额扣掉房租水电食材和换新灶台的钱，年底能随便提现分红的那笔钱。", "usage": "买方估值最核心的分子，比账面净利润更真实，不怕会计做账粉饰。"}, {"key": "full_oe", "term": "达产自由盈余（full_oe）", "plain": "公司手里正在盖的新工厂、新产线全部建好并正常运转后，未来每年能装进股东口袋的纯现金利润。", "usage": "用来衡量公司未来 2–3 年扩产落地后的成长弹性，但必须同步扣除建厂还要花的钱（防白嫖）。"}, {"key": "ev_delta", "term": "净现金调整额（ev_delta）与真实企业价值（True EV）", "plain": "买下一整家公司的真实净成本 = 股票总市值 + 欠别人的真债 - 账上闲置可随便花的现金。如果账上闲钱比欠债多（净现金），ev_delta 就是负数，相当于你买房子发现屋里保险柜自带一箱现金，实际买价更便宜。", "usage": "估值核心分母；反向保理、少数股东份额、受限保证金全在这儿挤干水分。"}, {"key": "OCF", "term": "经营现金流（OCF）", "plain": "公司靠卖产品真正收进银行卡的现金，减去买原料发工资付出去的现金。利润表可能只是“打了白条”，经营现金流才是真金白银进账。", "usage": "检验利润含金量的照妖镜；若单季骤降要查是客户欠账（真恶化）还是主动给供应商提前结账（假警报）。"}, {"key": "FCF", "term": "自由现金流（FCF）", "plain": "经营赚进来的现金（OCF），再扣掉盖新厂、买新设备花的钱（CapEx）之后还剩的余钱。正数说明自己养活自己还有结余，负数说明还在烧钱或借钱扩张。", "usage": "判断企业是“印钞机”还是“吞金兽”的硬标准。"}, {"key": "CapEx", "term": "资本开支（CapEx）", "plain": "公司盖厂房、买生产线、买矿权这类大件固定资产花的钱。分为「维持性 CapEx」（给老产线修修补补保饭碗）和「扩张性 CapEx」（盖新厂抢增量）。", "usage": "算常态盈余必须扣维持性开支；算未来达产利润必须把剩余扩张开支从现金里扣干净。"}, {"key": "DCF", "term": "未来现金流折现估值（DCF）", "plain": "把公司未来十几年每年能赚到的真现金，按你要求的年化回报率（比如 9%）折算成今天的钱加总，算出这家公司“理论上今天值多少钱”。", "usage": "价值投资的锚定器；两阶段 DCF 会把前 3–4 年扩产爬坡期和后面的平稳永续期分开精算。"}, {"key": "RONIC", "term": "新投入资本回报率（RONIC）与再投资扣减（1 - g/RONIC）", "plain": "公司想让利润以后每年继续长 3%（g），就得每年从利润里留一部分钱继续买设备建新线，不能 100% 全分红！如果新砸 100 块每年能多赚 30 块（RONIC=30%），想每年多赚 3%，就得扣掉 3%÷30%=10% 的利润拿去再投资。", "usage": "防止估值拍高：如果忘了扣 (1 - g/RONIC)，就等于幻想公司“一分钱不投、利润凭空永续增长”。"}, {"key": "Ke", "term": "股东要求年化回报率（Ke）", "plain": "买这家公司股票，你心里要求的最低年化复合收益门槛（通常在无风险国债利率 1.6%–1.9% 上加 7% 左右风险补偿，定在 9% 左右）。", "usage": "门槛定得越高，算出来的公允股价就越保守、安全垫越厚。"}, {"key": "NPV", "term": "净现值（NPV）", "plain": "一个扩产项目未来所有赚回来的钱折算到今天，减去你要掏出去的建厂成本。NPV 大于 0 说明扩产是在给股东创造超额财富，不能当零价值忽略。", "usage": "检验高回报扩产项目（如 764 GWh 新产线）究竟值不值钱。"}, {"key": "反向保理", "term": "反向保理 / 融单（供应链金融类债）", "plain": "公司欠供应商货款先不直接付，开一张“无条件必须兑付的欠条”，供应商拿去银行提前变现拿走现金。到期时公司必须铁打不动还钱给银行，本质上就是披着应付账款外衣的“变相短期银行贷款”。", "usage": "做空法医必查科目！必须从账上净现金里扣掉，才不会把借来的钱误当成自家闲钱。"}, {"key": "少数股东权益", "term": "少数股东权益 / 归母口径", "plain": "上市公司旗下有些合资子公司不是 100% 独资（比如自己占 92%，合作伙伴占 8%）。报表合并时把 100% 的利润和现金都加进来了，但真正属于咱们买股票的小股东的只是「归母（归属母公司）」那 92%。", "usage": "分子算利润用了归母口径，分母算净现金也只能扣合作伙伴占现金的那 8%，不能胡乱全扣。"}, {"key": "质保预计负债", "term": "售后质保预计负债", "plain": "卖出去的电池承诺保修 8 年，公司提前每年从营业成本里计提一笔“保修准备金”存在账上。因为利润里已经每年扣过这笔钱了，只要公司正常持续卖货，这笔池子就不会一次性掏空。", "usage": "严守“绝不双扣”铁律：利润里已经每年扣过，就不能再当银行欠债在市值里重扣一遍。"}, {"key": "PE_PB", "term": "市盈率（PE）与市净率（PB）", "plain": "市盈率 PE = 买下公司要花几年净利润回本（如 11.6 倍就是约 11 年半回本）；市净率 PB = 股价是每股净资产（账面家底）的几倍。", "usage": "快速对比历史极值位置（比如对比 2024 年熊市大底），防止在周期底部过度恐慌。"}, {"key": "TTM", "term": "过去 12 个月滚动口径（TTM）", "plain": "Trailing Twelve Months 的缩写，就是把最近连续 4 个季度的数据加起来凑满整整一年，比如「TTM 股息率」就是过去一整年实打实发到你手里的现金分红除以今天股价。", "usage": "比看去年旧年报更及时，严禁把没落地的口头回购混进即期股息率。"}, {"key": "物理双盲", "term": "物理双盲定价（0 现价隔离）", "plain": "辩论和裁判定价期间，把今天股票实时价格彻底封在信封里，不让多头、空头、裁判偷看！逼着大家纯按公司一年赚多少钱、账上有多少净现金算出真实底价，最后由主持人拆信封对照今天现价。", "usage": "彻底杜绝人脑看到现价后“故意把买点压到现价下面一点装稳健”的心理锚定偏见。"}], "messages": [{"id": "M01", "role": "host", "topic": "rate_gap", "round": "开场封箱 · 物理双盲交底（0 现价泄露）", "round_plain": "开场封箱 · 股价锁进黑信封，三模型铁三角蒙眼开审平安！", "time": "12:40", "act": {"text": "🔒 物理封箱 · 法定 181.08 亿股 + 6 年铁底", "cls": "act-host"}, "text": "欢迎进入 <b>中国平安（601318.SH）</b> 2.2 版跨模型物理双盲投委会！今日 A/H 实时股价与总市值已物理封箱，三席统一仅做 <b>A 股人民币主定价</b>，做空审计官 <b>Claude Opus 5.5</b> 实行双重隔离（禁读多头业务简本），裁判由 <b>Gemini 4 Carbon</b> 坐镇。共享官方底座（2026 三季报）：法定总股本 <b>181.08 亿股</b>，归母普通股净资产 10,443.66 亿元（永续债为 0，每股净资产 <b>57.67 元</b>）；宿主实测近 6 年真实最低市净率铁底 <b>0.74 倍</b>（2024 年）/ 近 2 年最低 <b>0.81 倍</b>（2026 年），最低市盈率 <b>5.4 倍</b> / 近 2 年 <b>6.3 倍</b>；国内 10 年期国债利率 1.6%—1.9%。请围绕 4% 回报假设利差、资管与产险真相、母公司分红注资、两笔境外可转债与估值倍数五大死结开战！", "plain": "中国平安跨模型投委会正式开审！为了彻底杜绝看着现价找理由，今天股价已经锁进黑信封！先对齐硬家底：总股本 <b>181.08 亿股</b>，每股净资产 <b>57.67 元</b>（没有永续债）；过去 6 年最惨跌到过 <b>0.74 倍市净率</b>，最近两年最低是 <b>0.81 倍</b>；现在国债无风险利率约 1.75%。下面请 Claude 空头和 Gemini 多头蒙眼亮剑！", "cites": ["2026三季报官方三表", "宿主实测6年PB/PE铁底"]}, {"id": "M02", "role": "bear", "topic": "rate_gap", "round": "第一轮 · 空头亮刺①：4.0% 锁死投资回报是给自己记假账", "round_plain": "第一轮 · 空头第一刀：国债都跌到 1.75% 了，平安还在按 4.0% 回报给自己算账！", "time": "12:45", "act": {"text": "💣 亮刺① · 4% 回报缺口年均 -99 亿", "cls": "act-bear"}, "replyTo": "M01", "text": "<b>第一刀直劈寿险营运利润的底层假设！</b>翻开官方财报原文：平安计算非浮动收费法（非 VFA）寿险营运利润时，将长期投资回报率<b>硬性锁定为 4.0%</b>，且以公允价值计量债券按成本口径记账。可现实呢？2025 年净投资收益率已降至 <b>3.7%</b>，2026 年前三季度非年化净/综合收益率仅 <b>2.5% / 2.3%</b>（年化约 3.3% / 3.1%），国内 10 年国债更在 <b>1.6%—1.9%</b>！结果被平安踢出营运利润的「短期投资波动」在 2024 年为 -39.25 亿、2025 年 +90.64 亿、2026 前三季度暴亏 <b>-339.57 亿</b>（单三季度 -381.23 亿），2.75 年累计 <b>-288.18 亿</b>，归母年均亏 <b>-99 亿元</b>！这是系统性利差缺口，绝非“短期波动”——近 5 年归母综合收益均值只有 <b>959 亿</b>，远低于账面 1,344 亿营运利润！", "plain": "<b>第一刀直接掀开平安营运利润的遮羞布！</b>国债收益率都掉到 1.6%—1.9% 了，平安算传统寿险营运利润时居然还按每年稳赚 <b>4.0%</b> 记账！今年前 9 个月实际年化净投资收益只有 3.3%，少赚出来的差额全被踢进「短期投资波动」藏起来了——过去快 3 年累计亏了 <b>288 亿</b>，平均每年归母少赚 <b>99 个亿</b>！这根本不是短期波动，是低利率时代硬生生的缺口！", "cites": ["2026三季报利润表与营运利润调节表", "2025年报投资收益率附注"], "impact": {"text": "实扣 4.0% 锁定回报现实缺口 → 常态盈利直砍 -99.1 亿元/年", "plain": "按真实利率挤水分，每年少赚约 99 亿元！", "pos": false}}, {"id": "M03", "role": "bear", "topic": "am_pc_sbc", "round": "第一轮 · 空头亮刺②：9M26 盈利增长全靠资管“一枪”硬撑", "round_plain": "第一轮 · 空头第二刀：前三季增长 8.3% 全靠资管突然暴赚，主业其实倒跌 6.3%！", "time": "12:45", "act": {"text": "💣 亮刺② · 剔资管营运利润实跌 -6.3%", "cls": "act-bear"}, "replyTo": "M01", "text": "<b>第二刀戳穿前三季度营运利润 +8.3% 的“增长假象”！</b>拆开分部账本看资产管理板块归母营运利润：2024 年亏 <b>-118.99 亿</b>、2025 年亏 <b>-37.85 亿</b>，2026 前三季度突然暴增至 <b>+194.23 亿</b>（仅三季度单季就狂赚 <b>+102.51 亿</b>），三季报里却连来源明细都没解释！如果把资管这笔极不稳定的“一枪买卖”剥掉，集团其余主业前三季营运利润从 1,136.10 亿跌到 <b>1,064.82 亿</b>，实质同比倒跌 <b>-6.3%</b>！同时产险三季度单季营运利润更是转亏 <b>-40.76 亿</b>，寿险营运净资产收益率也从 30.2% 降到 21.3%。跨周期常态绝不能外推资管暴利，资管按 3 年均值只能给 <b>+12.5 亿</b>！", "plain": "<b>别被前三季度利润增长 8.3% 骗了，那全靠资管板块突然放了一颗大卫星！</b>前两年资管还连亏上百亿，今年前三季度莫名其妙狂赚 <b>194 亿</b>（光三季度就赚了 102 亿）。把资管剔掉一看，平安其他核心业务其实同比倒跌了 <b>6.3%</b>，而且产险三季度单季还亏了 40 亿！这种看天吃饭的暴利绝不能当常态，拉 3 年平均资管只能算 <b>12.5 亿</b>！", "cites": ["2026三季报分部营运利润表"], "impact": {"text": "资管从 +194.23 亿压回跨周期均值 +12.5 亿，产险取两年均值 159.4 亿", "plain": "砍掉资管“一枪暴利”，核心利润水分大幅挤压", "pos": false}}, {"id": "M04", "role": "bear", "topic": "cash_cb", "round": "第一轮 · 空头亮刺③：增资寿险挤占分红 + 转债摊薄 + 7,968 亿股票敞口", "round_plain": "第一轮 · 空头第三刀：左手收分红右手补寿险，靠可转债补洞，还扛着快 8 千亿股票！", "time": "12:45", "act": {"text": "💣 亮刺③ · 空头首轮盲定 59.5 元（8.5×）", "cls": "act-bear"}, "replyTo": "M01", "text": "<b>第三刀直指母公司真现金与净资产弹性！</b>2025 年子公司上缴 <b>530.22 亿</b>，但母公司反手给寿险增资 <b>199.83 亿</b>（因 24 末寿险核心偿付率掉到 116.4%），净上缴只有 <b>330.39 亿</b>，根本不够付 <b>465.37 亿</b>对外分红，135 亿缺口得靠发可转债填！两笔境外可转债转股价已下调至 39.29 / 52.30 港元，全转将摊薄 <b>9.21 亿股（+5.09%）</b>，每股净资产从 57.67 元摊薄至 <b>56.75 元</b>。更要命的是，账面其他权益工具股票（FVOCI）飙至 <b>7,967.83 亿</b>（占净资产 76%），股市跌 20% 就能吃掉约 873 亿净资产且永不进利润表！（为防双扣，我主动认输地产非黑洞：投资性房地产公允 1,719.87 亿高于账面 1,514.11 亿；员工持股暂按已入薪酬不重扣。）空头首轮盲定：常态自由盈余 <b>1,331 亿</b>、净债偏移 0、按 190.29 亿摊薄股本给 <b>8.5 倍 = 59.5 元</b>（二档 52.5 元 / 重锤 45.5 元）！", "plain": "<b>第三刀查真金白银和股本稀释！</b>25 年子公司虽然交了 530 亿分红，可母公司反手又给寿险贴进去 200 亿救偿付率，净到手才 330 亿，根本不够发 465 亿股息，得靠发海外可转债补窟窿！这两笔转债以后转股要多印 9.21 亿股摊薄老股东，而且账上还屯了快 8 千亿股票，股市一跌净资产就得抖三抖。我老实认账地产没暴雷不硬黑，首轮蒙眼算完：平安正常赚 1,331 亿，合理价 <b>59.5 元</b>，52.5 元以下再看！", "cites": ["2025年报母公司现金流", "2026中报可转债附注 P100-102", "2026三季报资产负债表"], "impact": {"text": "空头 R1 盲定：常态自由盈余 1,331 亿 / 摊薄 190.29 亿股 / 公允 59.5 元", "plain": "空头第一轮定调：合理价 59.5 元（45.5 元以下重锤）", "pos": false}}, {"id": "M05", "role": "bull", "topic": "rate_gap", "round": "第一轮 · 多头立论①：分红险暴增 143.5% + 7,378 亿利润蓄水池钝化利差", "round_plain": "第一轮 · 多头亮牌①：新保单全换分红险、利润水库止跌回升，利差损没你想的惨！", "time": "12:44", "act": {"text": "🛡️ 支柱① · 主动预扣 -80 亿利差仍守 78 元 EV", "cls": "act-bull"}, "replyTo": "M02", "text": "<b>低利率绝非平安的绝症，负债端已经在彻底换血！</b>翻开 <b>2026 中报 P49</b>：上半年分红险规模保费同比暴增 <b>+143.5%</b> 至 <b>1,215.49 亿</b>，传统刚性利率寿险主动收缩 -20.4%——新单全面转向「低保底 + 浮动分红（VFA）」，从源头切断了新增利差损！存量 <b>合同服务边际（CSM）</b> 利润蓄水池也从 25 末 7,251.19 亿止跌反弹至 26 中报 <b>7,377.75 亿</b>（P47），25 年死差和费差主导的保险服务业绩占寿险税前营运利润高达 <b>75.5%</b>！更重要的是，我方并不盲目乐观——我第一轮就已经在寿险盈利里<b>主动硬扣 -80 亿</b>应对低利率压测；即便按 <b>25 年报 P81</b> 官方敏感性把长期回报假设硬砍 50 个基点到 <b>3.5%</b>，集团内含价值（EV）依然高达 <b>14,153.22 亿（78.16 元/股）</b>！", "plain": "<b>别拿老眼光看平安，它的寿险早就换好防弹衣了！</b>今年上半年平安把固定高息保单砍掉两成，把风险共担的分红险卖爆了 <b>+143.5%</b>，以后新卖的保单根本不怕低利率！老保单里锁着 <b>7,378 亿元</b>稳赚死差和费差的利润大水库，今年水位还在往上涨！而且我没装看不见低利率，一上来就主动扣了 <b>80 亿</b>利润当缓冲——就算把投资回报狠砍到 3.5%，平安的精算家底（内含价值）照样值 <b>78 块钱一股</b>！", "cites": ["2026中报 P47 / P49", "2025年报 P50 / P81"], "impact": {"text": "主动预扣 -80 亿低利率缓冲；3.5% 压测后集团内含价值仍达 78.16 元/股", "plain": "负债换血 + 主动扣 80 亿缓冲，3.5% 极寒家底仍值 78 元", "pos": true}}, {"id": "M06", "role": "bull", "topic": "am_pc_sbc", "round": "第一轮 · 多头立论②：产险 Q3 亏损纯系会计口径误杀，我方分子反比空头严", "round_plain": "第一轮 · 多头亮牌②：产险三季度承保狂赚 115 亿纯被会计规则冤枉，我算的利润比空头还保守！", "time": "12:44", "act": {"text": "🛡️ 支柱② · 平反产险 COR 95.6% + 主动扣 SBC", "cls": "act-bull"}, "replyTo": "M03", "text": "<b>空头指控产险 Q3 单季亏 -40.76 亿是恶化？请翻开 2026 三季报 P9 会计定义！</b>官方白纸黑字写着：「剔除短期投资波动<b>仅适用于非浮动收费法寿险</b>」。三季度全集团交易性金融资产（FVTPL）公允价值波动骤降 -900.6 亿，产险按规则未做剔除、把股市纸面浮亏直接砸进了营运利润！看真正的主业生命线——平安产险前三季综合成本率（COR）同比大幅优化 <b>1.4 个百分点至 95.6%</b>，9 个月纯承保利润就赚了 <b>115.7 亿</b>，稳态还原应为 <b>175 亿</b>！至于资管，我同样绝不外推 194 亿暴利，直接压到 <b>+50 亿</b>，还主动从盈利里多扣了 <b>-30 亿</b>员工持股购股净差额——我方首轮常态自由盈余仅 <b>1,320 亿</b>（比空头 1,331 亿还严 11 亿！），首轮公允暂锚 <b>78.0 元</b>（二档 58.0 / 重锤 47.0 元）。", "plain": "<b>产险三季度账面变负纯属天大冤案！</b>三季报第 9 页白纸黑字写着：股市浮亏只帮寿险剔掉，不帮产险剔！三季度股市一波动，账面浮亏全砸在产险头上了；其实产险自己干得极好，综合成本率降到 <b>95.6%</b>，光靠卖车险前 9 个月就纯赚 <b>115.7 亿</b>！资管我也没吹牛，直接砍到 50 亿，还比空头多扣了 30 亿员工买股钱——算下来我给的常态利润（<b>1,320 亿</b>）居然比空头（1,331 亿）还保守！首轮合理价估 <b>78.0 元</b>！", "cites": ["2026三季报 P9 / P10", "2025年报 P304"], "impact": {"text": "多头 R1 常态自由盈余 1,320 亿（比空头更保守 11 亿）｜公允 78.0 元", "plain": "洗清产险冤案！多头首轮利润比空头还保守，估值看 78 元", "pos": true}}, {"id": "M07", "role": "bull", "topic": "cash_cb", "round": "第二轮 · 多头原表反杀“发债分红”+ 抓出空头两处算术漏项", "round_plain": "第二轮 · 多头亮出铁证反杀：可转债融的钱 100% 没动，哪来的发债填分红？还抓出空头两处漏算！", "time": "12:47", "act": {"text": "⚔️ 反杀 · 转债募资 100% 未用 + 抓 2 处漏算", "cls": "act-bull"}, "replyTo": "M04", "text": "<b>用三份巨潮原文彻底击碎“靠可转债补分红洞”的指控！</b>① 查 <b>2025 年报 P363</b>，25 年向寿险增资 199.84 亿系偿二代过渡期一次性补足，26 上半年寿险核心偿付率已跃升至 <b>133.8%</b>（监管线 2.68 倍）；② 查 <b>2026 中报 P83</b>，上半年母公司对子公司注资为 <b>0 元</b>、子公司实缴分红 <b>+340.55 亿</b>，母公司可动用资金净增至 <b>817.45 亿</b>（26Q3 稳居净现金 <b>+210.11 亿</b>）；③ 最致命的一页在 <b>2026 中报 P102</b>——白纸黑字写明<b>两笔可转债约 355 亿净募资截至上半年末 100% 尚未使用</b>，根本没拿去填分红！顺手帮空头纠两处漏算：算每股价值除以 190.29 亿股时漏加了转股同步消灭的 <b>358.5 亿本金债务（+1.88 元/股）</b>；投资性房地产 <b>25 年报 P270</b> 漏加了 306.40 亿土地，总公允高达 <b>2,026.27 亿（表外浮盈 +512.16 亿）</b>！", "plain": "<b>拿中报原文打脸“借新债还分红”！</b>第一，去年给寿险补钱是一次性应对监管过渡期，今年上半年母公司一分钱没注资，反倒收了子公司 <b>340 亿</b>真金白银分红，母公司账上净现金稳居 <b>+210 亿</b>！第二，中报 102 页白纸黑字写着：海外发可转债融的 <b>355 亿现金 100% 躺着没动过</b>，怎么可能拿去补分红？另外抓到空头两个算术漏项：转股少算了销掉的 358 亿债，查地产评估还漏加了 306 亿土地！", "cites": ["2025年报 P270 / P363", "2026中报 P83 / P102"], "impact": {"text": "彻底证伪发债分红；补回转债化债 +1.88 元/股与 306.4 亿土地公允值", "plain": "铁证洗清发债分红嫌疑，还顺手抓出空头两处漏算！", "pos": true}}, {"id": "M08", "role": "bear", "topic": "am_pc_sbc", "round": "第二轮 · 空头硬核自我纠错：核实员工持股绕开利润表，补扣 -33 亿！", "round_plain": "第二轮 · 空头当庭光速认错：查完年报 300 页，员工买股确实有 33 亿绕开了利润表，我补扣！", "time": "12:47", "act": {"text": "🔄 认错纠偏 · 分子收敛至 1,298 亿（差 1.7%）", "cls": "act-bear"}, "replyTo": "M06", "text": "<b>先把第一轮我自己的判断失误当庭纠偏！</b>我重新穿透 <b>2025 年报 P300 资本公积变动表</b> 发现：长期服务计划二级市场真金白银购股成本高达 <b>-38.75 亿元</b>，而当期利润表确认的股份支付费用只有区区 <b>+6.43 亿元</b>！两者净差额 <b>-32.32 亿</b>，与内含价值表里「购股及当期摊销回冲 -32.00 亿」严丝合缝！这说明利润表只摊了零头，每年实打实有 <b>32—33 亿元</b>现金流出绕开了营运利润！我第一轮判断“已入薪酬不扣”是错的，立刻认错并实扣 <b>-33 亿</b>，将空头常态自由盈余从 1,331 亿下修至 <b>1,298 亿元</b>（全面摊薄每股 6.82 元）——至此与多头 1,320 亿只差 <b>1.7%</b>，分子端彻底收敛！", "plain": "<b>是我的错我立刻认！</b>我重翻了 25 年报 300 页发现：平安花 <b>38.75 亿</b>真钱在股市买股发给员工，利润表当年只算了 <b>6.43 亿</b>成本，中间足足有 <b>32—33 亿</b>现金开销绕开了营运利润！我第一轮没扣这笔钱是算错了，现在痛快补扣 <b>-33 亿</b>，把我的常态利润调到 <b>1,298 亿</b>——算到这儿，咱俩在“公司一年真赚多少钱”上只差 <b>1.7%</b> 了！", "cites": ["2025年报 P300 资本公积表", "2025年报内含价值变动表"], "impact": {"text": "空头主动补扣 -33 亿员工持股差额 → 多空分子分歧从模糊缩至仅 1.7%", "plain": "空头硬核认错补扣 33 亿，多空盈利账彻底对齐！", "pos": false}}, {"id": "M09", "role": "bear", "topic": "ggm_valuation", "round": "第二轮 · 空头核弹补刀：一剑捅穿多头 78 元的“88% 派息率伪估值”！", "round_plain": "第二轮 · 空头神来补刀：你 78 块的估值公式偷偷假设分红 88%，可平安实际只分 36%！", "time": "12:47", "act": {"text": "🩸 补刀命中 · 戳穿伪 GGM 悖论，空头锚 61.0 元", "cls": "act-bear"}, "replyTo": "M05", "text": "<b>分子既然已对齐，现在一剑捅穿多头 78 元估值的致命数学病根！</b>多头用净资产收益率 <b>12.64%</b> 配永续增速 <b>1.5%</b> 套进戈登增长模型（GGM），数学上隐含的派息率 = 1 - 1.5/12.64 = <b>88%</b>！可平安 2025 年实际分红 488.91 亿占营运利润只有 <b>36.4%</b>！剩下 63% 利润既没分给股东，也没换来 8% 的增速，而是被锁进了监管偿付资本和消化负其他综合收益——实测 2021 至 26Q3 归母净资产年化仅增 <b>+5.43%</b>，近 5 年归母综合收益真实净资产收益率只有 <b>10.64%</b>！把真实 10.64% 代回你自己的公式：10% 折现率只值 <b>1.07 倍市净率 = 61.0 元</b>（9.5% 也才 64.8 元）！顺便刺破 +512 亿地产浮盈：年租金 72.56 亿 ÷ 2,026 亿评估值 = <b>3.58% 毛租金回报</b>，靠三级估值撑出的溢价不进估值！空头次轮定锚：公允 <b>61.0 元</b>（二档 47.6—51.9 元 / 重锤 ≤44.5 元）！", "plain": "<b>既然盈利吵平了，那我一刀捅破你 78 块钱估值的数学陷阱！</b>你把 12.6% 收益率和 1.5% 增速直接代进市净率公式，背后等于偷换概念假设平安每年把 <b>88% 的利润全分红</b>！可实际上平安只分了 <b>36.4%</b>，剩下六成多利润全留在肚子里补资本金和扛负收益了，过去 5 年真实综合收益率只有 <b>10.64%</b>！拿这个真数算回来，平安只值 <b>61 块钱</b>！顺便说一句，地产评估 2,026 亿一年才收 72 亿房租（毛回报 3.58%），也就账面水平别吹浮盈了！", "cites": ["2021-2026Q3归母综合收益与净资产实测", "2025年报投资性房地产租金附注"], "impact": {"text": "戳穿多头伪 GGM 88% 派息悖论 → 空头终版锚定 61.0 元（1.07× 摊薄 PB）", "plain": "教科书级补刀！直接把多头 78 元的水分公式捅漏！", "pos": false}}, {"id": "M10", "role": "bull", "topic": "ggm_valuation", "round": "第二轮 · 多头反杀空头双杀：国债 1.75% 却给 8.5 倍是清算股待遇！", "round_plain": "第二轮 · 多头反击：你分子已经把水分全挤干了，国债才 1.75% 还只给 8.5 倍太狠了！", "time": "12:47", "act": {"text": "⚔️ 反杀双杀 · 质询 1,000bps 风险溢价，微调 75 元", "cls": "act-bull"}, "replyTo": "M04", "text": "<b>反过来质询空头：绝不允许分子分母“双重杀估值”！</b>你的分子常态盈利已经实打实扣光了 -99 亿低利率缺口、把资管从 194 亿砍到 12.5 亿，对应摊薄后常态净资产收益率依然高达 <b>12.3%</b>！在当前中国 10 年期国债无风险利率仅 <b>1.75%</b> 的大环境下，你给公允中枢仅仅 <b>8.5 倍</b>（相当于哪怕零成长也要求 <b>11.8%</b> 永续回报、超国债 <b>+1,000 个基点</b>的极端股权风险溢价，且只给压测后内含价值的 0.76 倍）——这不等于把挤干泡沫的盈利又按破产清算股狠杀第二刀吗？我方愿把公允倍数温和下调至 <b>10.5 倍 = 75.0 元</b>（二档 57.5 / 重锤 47.0 元），请空头正面算账！", "plain": "<b>我也反问空头一句：不带这么里外剥两层皮的！</b>你算利润的时候已经把低利率缺口全扣完了、资管也压到地板上了，剩下来的全是最硬的干货。现在买国债一年才赚 1.75%，你却只肯给平安 8.5 倍（要求一年赚近 12%、比国债高出整整 10 个百分点），这等于把好公司按快倒闭的破产股再狠砍一刀！我先把我的合理价微调到 <b>75.0 元</b>，等你接招！", "cites": ["10年期国债无风险利率基准（1.75%）"], "impact": {"text": "多头 R2 微调至 75.0 元（10.5×），与空头 61.0 元尚存 23% 分母鸿沟", "plain": "多头质询空头“双杀”，微调至 75 元，两方估值仍差 14 块", "pos": true}}, {"id": "M11", "role": "judge", "topic": "ggm_valuation", "round": "中场裁定 · 启动 R2.5 法庭限时质询加时赛！", "round_plain": "中场暂停 · 裁判拉响加时赛警报：盈利只差 1.7%，合理价还差 14 块，当庭点名交卷！", "time": "12:49", "act": {"text": "⏱️ 启动 R2.5 加时 · 点名 2 道必答题", "cls": "act-judge"}, "replyTo": "M09", "text": "<b>本席核验前两轮交锋，现依法启动 1 轮 R2.5 法庭限时质询！</b>双方分子端已奇迹收敛（多头 1,320 亿 对比 空头 1,298 亿，仅差 <b>1.69%</b>），但因第二轮并发擦肩而过，公允中枢仍差 <b>23%（75.0 元 对比 61.0 元）</b>。请两席各用 400 字内直答本席点题，严禁复读旧话：<br>1️⃣ <b>质询多头</b>：空头一针见血捅破你隐含 88% 派息率的伪戈登模型（真实分红率 36.4%）。请彻底扔掉该公式，改用与真实留存自洽的<b>两阶段股息折现（DDM）或 3.5% 压测分部加总（SOTP）</b>重算无水分公允价！<br>2️⃣ <b>质询空头</b>：请回应多头 #7 证据——26Q3 负债端账面已计可转债 <b>412.44 亿</b>（303.42 亿应付债券 + 109.02 亿衍生负债）且 355 亿募资 100% 未动用；同时平安年派息 460 亿后净资产仍年增 <b>+5.43%</b>，补回化债漏项并剔除零增长双杀后应修至多少？", "plain": "<b>裁判叫暂停！启动加时赛限时答辩！</b>你们俩在“平安一年赚 1,300 亿”上已经几乎握手言和了，可合理价还差 14 块钱，因为第二轮各说各话没撞上！现在各答一题立刻交卷：<br>1️⃣ <b>多头回答</b>：空头抓你假装分红 88% 抓得太准了！把那个水货公式扔掉，用老老实实的两阶段分红折现和拆骨法重算到底值多少钱！<br>2️⃣ <b>空头回答</b>：多头查出转股会直接抹掉 412 亿账面负债、355 亿募资一分没花，而且平安发完分红净资产每年还涨 5.4%，补回漏算别再当零增长股杀，修正后给多少？", "cites": ["2026三季报 P27 应付债券与衍生金融负债", "2026中报 P102 募资使用情况"]}, {"id": "M12", "role": "bear", "topic": "cash_cb", "round": "加时赛 R2.5 · 空头交卷：认领 412 亿转债化债 + 上调永续增速至 3%", "round_plain": "加时赛 R2.5 · 空头交卷：认领转债化债把净资产抬到 57.05 元，增速提到 3%，上调至 62.0 元！", "time": "12:50", "act": {"text": "📝 空头终版 · 公允上调至 62.0 元（重锤 ≤45.3）", "cls": "act-bear"}, "replyTo": "M11", "text": "<b>遵裁判点题精准交卷：</b><br>① <b>可转债认一半</b>：市净率口径下，转股确实把账面 303.42 亿应付债券 + 109.02 亿衍生负债 = <b>412.44 亿元</b>转入净资产，摊薄每股净资产从 56.75 元升至 <b>57.05 元</b>（我次轮少算 0.30 元/股，痛快认领！）；但盈利倍数端本来没扣过债，转股只省约 10 亿/年利息，不重复加本金。<br>② <b>防双杀澄清</b>：我的估值锚定的是 5 年真实综合收益净资产收益率 <b>10.64%</b>（累计 -1,114.56 亿负其他综合收益是久期缺口导致的真实经济损失，不能当会计错配），并非重复清算折价。但我认可将可持续增速上调至 <b>3.0%</b>（隐含 72% 长期派息率，贴近名义 GDP）：(10.64%-3%)÷(10%-3%) = 1.09× × 57.05 = <b>62.3 元</b>（折现率取 9.5% 上限为 67.1 元）。空头终版定锚：公允 <b>62.0 元</b>（二档 48.4—52.7 元 / 重锤 ≤45.3 元）！", "plain": "<b>空头加时赛爽快交卷！</b>第一，可转债化债我认一半：转股确实抹掉 <b>412 亿</b>账面负债，摊薄后每股净资产涨到 <b>57.05 元</b>（我之前少算了 3 毛钱，认账！），但按盈利算不能重复加本金。第二，利率下行亏掉的那 1,115 亿负收益是真金白银的经济损失，不过我同意把平安的长期增速上调到 <b>3%</b>——重算完合理价上调到 <b>62.0 元</b>（45.3 元以下重锤）！", "cites": ["2026三季报 P27", "Python 自洽重算"], "impact": {"text": "空头 R2.5 认领摊薄 BVPS 57.05 元并调高 g 至 3% → 终版锚 62.0 元", "plain": "空头认账补齐漏项，合理价从 59.5 → 61.0 → 62.0 元！", "pos": true}}, {"id": "M13", "role": "bull", "topic": "ggm_valuation", "round": "加时赛 R2.5 · 多头痛快去水：丢掉 78 元锚，双模型重算收口至 67.0 元！", "round_plain": "加时赛 R2.5 · 多头痛快挤干水分：扔掉 78 元，用两套硬核模型重算降到 67.0 元！", "time": "12:51", "act": {"text": "📝 多头终版 · 去水下修至 67.0 元（分歧仅 5 元）", "cls": "act-bull"}, "replyTo": "M11", "text": "<b>痛快接受隐含 88% 派息率纠偏，丢弃 75—78 元虚高锚！</b>我按 <b>190.28 亿全面摊薄股本 + 358.5 亿化债回补</b>、常态自由盈余 <b>1,310 亿</b>，改用两套 100% 自洽的模型重新演练：<br>1️⃣ <b>两阶段股息折现（DDM）</b>：前 10 年维持 37% 真实派息（26E 股息 2.79 元按 4.5% 复利，严守低于净资产 5.43% 增速）；第 11 年起进入成熟期派息 60%、永续增速 2.5%、折现率 9.0%（超国债 725 个基点）→ 化债摊薄现值 = <b>65.82 元</b>；<br>2️⃣ <b>3.5% 极寒利率分部加总（SOTP，0 倍新业务）</b>：寿险 1.0× 压测内含价值（8,184 亿）+ 产险 1.15× 市净率（1,746 亿）+ 银行 0.65×（1,764 亿）+ 资管 0.7×（499 亿）+ 科技 0.5×（329 亿）+ 总部归零 = 12,522 亿 → (12,522 + 358.5) ÷ 190.28 = <b>67.69 元</b>。<br>多头终版锚定：公允 function getText(obj, proKey, plainKey) {
  if (currentMode === 'plain' && obj && obj[plainKey]) return obj[plainKey];
  return (obj && obj[proKey]) || '';
}

function linkifyTerms(htmlStr) {
  if (!htmlStr || !GLOSSARY.length) return htmlStr;
  // Highlight known abbreviations/keywords safely outside HTML tags using placeholder tokens
  // so later glossary rules NEVER match inside an earlier rule's title="..." attribute!
  const rules = [];
  GLOSSARY.forEach(g => {
    const keys = (g.match || [g.key]).filter(k => k && k.length >= 2);
    keys.forEach(k => rules.push({ k, key: g.key, tip: g.term + '：' + g.plain }));
  });
  rules.sort((a, b) => b.k.length - a.k.length);
  const parts = htmlStr.split(/(<[^>]+>)/g);
  for (let i = 0; i < parts.length; i += 2) {
    let seg = parts[i];
    if (!seg) continue;
    const replaced = new Set();
    const tokens = [];
    for (const r of rules) {
      if (replaced.has(r.key)) continue;
      const esc = r.k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(esc);
      if (re.test(seg)) {
        const safeTip = r.tip.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const safeKey = String(r.key).replace(/'/g, "\\'");
        seg = seg.replace(re, (m) => {
          const idx = tokens.length;
          tokens.push(`<span class="term-link" title="${safeTip}" onclick="jumpToTerm('${safeKey}')">${m}</span>`);
          return `\u0000T${idx}\u0000`;
        });
        replaced.add(r.key);
      }
    }
    if (tokens.length) {
      seg = seg.replace(/\u0000T(\d+)\u0000/g, (_, idx) => tokens[Number(idx)]);
    }
    parts[i] = seg;
  }
  return parts.join('');
}

function renderGlossary() {
  const q = (document.getElementById('glossarySearch').value || '').trim().toLowerCase();
  const list = GLOSSARY.filter(g =>
    !q || (g.term + ' ' + g.key + ' ' + g.plain + ' ' + (g.usage||'')).toLowerCase().includes(q)
  );
  document.getElementById('glossaryList').innerHTML = list.map(g => `
    <div class="g-card" id="term-${g.key}">
      <div class="g-term">📘 ${g.term}</div>
      <div class="g-plain">${g.plain}</div>
      ${g.usage ? `<div class="g-usage">🎯 实战用法：${g.usage}</div>` : ''}
    </div>
  `).join('') || `<div style="font-size:12px;color:var(--text-muted);text-align:center;padding:16px;">未找到匹配术语</div>`;
}

function toggleGlossary() {
  const layout = document.getElementById('mainLayout');
  const side = document.getElementById('glossarySidebar');
  if (window.innerWidth <= 1200) {
    side.classList.toggle('drawer-open');
  } else {
    layout.classList.toggle('hide-glossary');
  }
}

function jumpToTerm(key) {
  const layout = document.getElementById('mainLayout');
  const side = document.getElementById('glossarySidebar');
  if (window.innerWidth <= 1200) {
    side.classList.add('drawer-open');
  } else {
    layout.classList.remove('hide-glossary');
  }
  const search = document.getElementById('glossarySearch');
  if (search && search.value) { search.value = ''; renderGlossary(); }
  const card = document.getElementById('term-' + key);
  if (card) {
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.classList.remove('flash-term');
    void card.offsetWidth;
    card.classList.add('flash-term');
    setTimeout(() => card.classList.remove('flash-term'), 2400);
  }
}

function buildUnblindHTML() {
  if (!UNBLIND) return '';
  const statsArr = (currentMode === 'plain' && UNBLIND.stats_plain) ? UNBLIND.stats_plain : (UNBLIND.stats || []);
  const statsHtml = statsArr.map(s =>
    `<div class="stat-card"><div class="stat-k">${s.k}</div><div class="stat-v" style="color:${COLOR_MAP[s.color]||'var(--text-primary)'};">${s.v}</div></div>`
  ).join('');
  const hdrs = (currentMode === 'plain' && UNBLIND.grid_headers_plain) ? UNBLIND.grid_headers_plain : UNBLIND.grid_headers;
  const rows = (currentMode === 'plain' && UNBLIND.grid_rows_plain) ? UNBLIND.grid_rows_plain : UNBLIND.grid_rows;
  const tblHtml = (hdrs && rows)
    ? `<table class="mini-table" style="margin-top:10px;"><thead><tr>${hdrs.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`
      + rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')
      + `</tbody></table>` : '';
  return `<div class="unblind-box">
    <div class="unblind-sealed" id="unblindSealed" style="display:${isUnblinded?'none':'block'};">
      <div style="font-size:15px;font-weight:800;margin-bottom:6px;">${UNBLIND.sealed_title||'🔒 实时股价信封已封存'}</div>
      <div style="font-size:12.5px;color:var(--text-secondary);margin-bottom:12px;">${getText(UNBLIND, 'sealed_desc', 'sealed_desc_plain')}</div>
      <button class="btn btn-gold" onclick="doUnblind()" style="padding:8px 18px;font-size:13.5px;">🔓 拆封现价 · 揭盲对照挂单网</button>
    </div>
    <div class="unblind-content ${isUnblinded?'open':''}" id="unblindContent">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
        <span style="font-weight:800;font-size:15px;color:var(--accent-gold);">${UNBLIND.header_title||''}</span>
        ${UNBLIND.header_badge ? `<span class="act-tag act-concede">${UNBLIND.header_badge}</span>` : ''}
      </div>
      <div class="grid-cards">${statsHtml}</div>
      ${tblHtml}
    </div>
  </div>`;
}

function renderChat() {
  const container = document.getElementById('chatView');
  const filtered = MESSAGES.filter(m =>
    (currentTopic === 'all' || m.topic === currentTopic) &&
    (currentRole === 'all' || m.role === currentRole)
  );
  document.getElementById('msgCounter').textContent = `当前显示 ${filtered.length} / ${MESSAGES.length} 条发言`;
  let out = '', lastRound = '';
  filtered.forEach(m => {
    const rTitle = getText(m, 'round', 'round_plain');
    if (rTitle && rTitle !== lastRound && currentTopic === 'all' && currentRole === 'all') {
      out += `<div class="round-divider"><span class="round-pill">${rTitle}</span></div>`;
      lastRound = rTitle;
    }
    const r = ROLES[m.role] || { name: m.role, model: '', avatar: '💬', cls: 'host', side: 'left' };
    const tObj = TOPICS.find(t => t.id === m.topic);
    let quoteHtml = '';
    if (m.replyTo) {
      const target = MESSAGES.find(x => x.id === m.replyTo);
      if (target) {
        const tr = ROLES[target.role] || { avatar: '', name: target.role };
        const plain = getText(target, 'text', 'plain').replace(/<[^>]+>/g, '');
        const snippet = plain.length > 56 ? plain.slice(0, 56) + '…' : plain;
        quoteHtml = `<div class="quote-box" onclick="jumpToMsg('${target.id}')"><div class="quote-head"><span>↩ 回复 ${tr.avatar} ${tr.name} (${target.id})</span><span class="quote-jump">定位原话 ↗</span></div><div>${snippet}</div></div>`;
      }
    }
    const tblObj = (currentMode === 'plain' && m.table_plain) ? m.table_plain : m.table;
    let tableHtml = '';
    if (tblObj) {
      tableHtml = `<table class="mini-table"><thead><tr>${tblObj.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`
        + tblObj.rows.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('') + `</tbody></table>`;
    }
    let citesHtml = '';
    if ((m.cites && m.cites.length) || m.impact) {
      const impText = m.impact ? getText(m.impact, 'text', 'plain') : '';
      citesHtml = `<div class="cite-row">`
        + (m.cites || []).map(c => `<span class="cite-chip">${c}</span>`).join('')
        + (m.impact ? `<span class="impact-chip ${m.impact.pos?'pos':''}">${impText}</span>` : '')
        + `</div>`;
    }
    const bodyHtml = linkifyTerms(getText(m, 'text', 'plain'));
    out += `<div class="msg-row ${r.side==='right'?'side-right':''}" id="msg-${m.id}">
      <div class="avatar av-${r.cls}">${r.avatar}</div>
      <div class="msg-body-wrap">
        <div class="msg-meta">
          <span class="sender-name">${r.name}</span>
          <span class="model-tag">${r.model}</span>
          ${m.act ? `<span class="act-tag ${m.act.cls}">${m.act.text}</span>` : ''}
          ${tObj ? `<span class="topic-tag-mini" onclick="filterTopic('${m.topic}')">${tObj.icon||''} ${tObj.name.split('·')[0].trim()}</span>` : ''}
          <span class="msg-id">${m.id} · ${m.time||''}</span>
        </div>
        <div class="bubble bubble-${r.cls}" id="bubble-${m.id}">
          ${quoteHtml}<div>${bodyHtml}</div>${tableHtml}${m.isUnblindBox?buildUnblindHTML():''}${citesHtml}
        </div>
      </div>
    </div>`;
  });
  container.innerHTML = out || `<div style="text-align:center;padding:48px 16px;color:var(--text-muted);">当前筛选条件下暂无发言。</div>`;
}

function renderMatrix() {
  const el = document.getElementById('matrixView');
  const cards = (currentTopic === 'all' || !CLASH_CARDS.some(c => c.topic === currentTopic))
    ? CLASH_CARDS : CLASH_CARDS.filter(c => c.topic === currentTopic);
  el.innerHTML = cards.map(c => `<div class="clash-card">
    <div class="clash-header">
      <span class="clash-title">${getText(c, 'title', 'title_plain')}</span>
      <div style="display:flex;gap:8px;align-items:center;">
        <span class="act-tag act-verdict">${c.verdictBadge}</span>
        <button class="btn" style="padding:3px 9px;font-size:11.5px;" onclick="viewTopicInChat('${c.topic}')">💬 回群聊看原话</button>
      </div>
    </div>
    <div class="clash-grid">
      <div class="clash-col"><div class="clash-col-head" style="color:var(--accent-bear);">🐻 空头亮刺</div><div>${linkifyTerms(getText(c, 'bear', 'bear_plain'))}</div></div>
      <div class="clash-col"><div class="clash-col-head" style="color:var(--accent-bull);">🐂 多头反杀/认领</div><div>${linkifyTerms(getText(c, 'bull', 'bull_plain'))}</div></div>
      <div class="clash-col"><div class="clash-col-head" style="color:var(--accent-host);">🔄 核验补刀 / 撤回</div><div>${linkifyTerms(getText(c, 'rebuttal', 'rebuttal_plain'))}</div></div>
    </div>
    <div class="clash-verdict">${linkifyTerms(getText(c, 'judge', 'judge_plain'))}</div>
  </div>`).join('');
}

function filterTopic(tid) { currentTopic = tid; renderTopics(); renderChat(); renderMatrix(); }
function filterRole(role) { currentRole = role; renderRoster(); renderChat(); }
function switchView(v) {
  document.getElementById('btnChatView').classList.toggle('active', v === 'chat');
  document.getElementById('btnMatrixView').classList.toggle('active', v === 'matrix');
  document.getElementById('chatView').classList.toggle('hidden', v !== 'chat');
  document.getElementById('matrixView').classList.toggle('active', v === 'matrix');
}
function viewTopicInChat(tid) { switchView('chat'); filterRole('all'); filterTopic(tid); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function jumpToMsg(id) {
  let target = document.getElementById('msg-' + id);
  if (!target) { currentTopic = 'all'; currentRole = 'all'; renderRoster(); renderTopics(); renderChat(); target = document.getElementById('msg-' + id); }
  if (target) {
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const b = document.getElementById('bubble-' + id);
    if (b) { b.classList.remove('flash-highlight'); void b.offsetWidth; b.classList.add('flash-highlight'); setTimeout(() => b.classList.remove('flash-highlight'), 2200); }
  }
}
function doUnblind() { isUnblinded = true; const s = document.getElementById('unblindSealed'), c = document.getElementById('unblindContent'); if (s) s.style.display = 'none'; if (c) c.classList.add('open'); }
function jumpAndUnblind() {
  switchView('chat'); isUnblinded = true; currentTopic = 'all'; currentRole = 'all';
  renderRoster(); renderTopics(); renderChat();
  const ub = MESSAGES.find(m => m.isUnblindBox);
  if (ub) setTimeout(() => jumpToMsg(ub.id), 60);
}
function toggleTheme() {
  const h = document.documentElement, n = h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  h.setAttribute('data-theme', n); document.getElementById('btnTheme').textContent = n === 'dark' ? '☀️ 浅色' : '🌙 深色';
}

renderModeUI(); renderRoster(); renderConvergence(); renderTopics(); renderGlossary(); renderChat(); renderMatrix();
</script>
</body>
</html>
