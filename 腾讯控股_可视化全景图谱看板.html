  <style>
    * { box-sizing: border-box; }
    body {
      background: var(--background);
      color: var(--foreground);
      font-size: 14px;
      line-height: 1.55;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .tab-btn {
      transition: all 0.18s ease;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 600;
      background: color-mix(in srgb, var(--primary) 8%, transparent);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: border-color 0.18s ease, transform 0.18s ease;
    }
    .kpi-card:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }
    .panel-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .pill-btn {
      border: 1px solid var(--border);
      background: var(--background);
      color: var(--muted-foreground);
      transition: all 0.15s ease;
    }
    .pill-btn.active, .pill-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: color-mix(in srgb, var(--primary) 10%, transparent);
    }
    .svg-interactive { cursor: pointer; transition: opacity 0.15s ease, filter 0.15s ease; }
    .svg-interactive:hover { opacity: 0.9; filter: brightness(1.06); }
    #tooltip {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s ease;
      max-width: 320px;
      background: var(--card);
      color: var(--foreground);
      border: 1px solid var(--border);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.5;
    }
    .num-mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .badge-soft {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
    }
    .scrollbar-thin::-webkit-scrollbar { height: 6px; width: 6px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: var(--border);
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--primary);
      border: 3px solid var(--card);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
      cursor: pointer;
    }
    .data-table th {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted-foreground);
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--background) 65%, var(--card));
      white-space: nowrap;
    }
    .data-table td {
      font-size: 12px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--card-border);
      vertical-align: top;
    }
    .row-highlight {
      background: color-mix(in srgb, var(--primary) 7%, transparent);
    }
    .whitespace-nowrap { white-space: nowrap; }
    .leading-snug { line-height: 1.375; }
    @media print {
      .no-print { display: none !important; }
      .tab-panel { display: block !important; page-break-inside: avoid; margin-bottom: 24px; }
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased">

  <!-- Global Floating Tooltip -->
  <div id="tooltip"></div>

  <!-- Sticky Top Executive Header -->
  <header class="sticky top-0 z-40 bg-[var(--background)] border-b border-[var(--border)]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 pt-3 pb-0">
      <div class="flex flex-wrap items-center justify-between gap-3 pb-3">
        <div class="flex items-center gap-3">
          <div id="hdr-logo" class="w-10 h-10 rounded-xl flex items-center justify-center font-bold text-sm shrink-0"
               style="background: var(--primary); color: var(--primary-foreground);"></div>
          <div>
            <div class="flex flex-wrap items-center gap-2">
              <h1 id="hdr-title" class="text-lg sm:text-xl font-bold tracking-tight m-0"></h1>
              <div id="hdr-badges" class="flex flex-wrap items-center gap-1.5"></div>
            </div>
            <p id="hdr-subtitle" class="text-xs text-[var(--muted-foreground)] m-0 mt-0.5"></p>
          </div>
        </div>
        <div class="flex items-center gap-2 no-print">
          <a href="./index.html" class="pill-btn px-3 py-1.5 rounded-lg text-xs font-medium cursor-pointer" style="text-decoration:none;display:inline-flex;align-items:center;">← 书架</a>
          <button onclick="document.documentElement.classList.toggle('dark')" class="pill-btn px-3 py-1.5 rounded-lg text-xs font-medium cursor-pointer">
            🌓 浅/深色
          </button>
          <button onclick="window.print()" class="pill-btn px-3 py-1.5 rounded-lg text-xs font-medium cursor-pointer">
            🖨️ 打印 / 另存PDF
          </button>
        </div>
      </div>

      <!-- 7-Tab Navigation -->
      <nav id="tab-nav" class="flex items-center gap-1 overflow-x-auto scrollbar-thin -mb-px no-print">
        <button class="tab-btn active px-3.5 py-2.5 text-xs sm:text-sm rounded-t-lg cursor-pointer" data-tab="overview" id="nav-tab-overview">① 全景总览 &amp; 资金流向</button>
        <button class="tab-btn px-3.5 py-2.5 text-xs sm:text-sm rounded-t-lg cursor-pointer" data-tab="business" id="nav-tab-business">② 主营业务 &amp; 产品矩阵</button>
        <button class="tab-btn px-3.5 py-2.5 text-xs sm:text-sm rounded-t-lg cursor-pointer" data-tab="assets" id="nav-tab-assets">③ 核心资产 &amp; 资本结构</button>
        <button class="tab-btn px-3.5 py-2.5 text-xs sm:text-sm rounded-t-lg cursor-pointer" data-tab="history" id="nav-tab-history">④ 五年营收 &amp; 现金历程</button>
        <button class="tab-btn px-3.5 py-2.5 text-xs sm:text-sm rounded-t-lg cursor-pointer" data-tab="margins" id="nav-tab-margins">⑤ 毛利净利 &amp; 同行对质</button>
        <button class="tab-btn px-3.5 py-2.5 text-xs sm:text-sm rounded-t-lg cursor-pointer" data-tab="valuation" id="nav-tab-valuation">⑥ 造血底盘 &amp; 估值模拟</button>
        <button class="tab-btn px-3.5 py-2.5 text-xs sm:text-sm rounded-t-lg cursor-pointer" data-tab="verdict" id="nav-tab-verdict">⑦ 新业务证伪 &amp; 终极决策</button>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-5 space-y-5">
    <!-- Persistent 5 KPI Cards -->
    <section id="kpi-strip" class="grid grid-cols-2 md:grid-cols-5 gap-3"></section>

    <!-- =================================================================== -->

    <!-- =================================================================== -->
    <section id="tab-overview" class="tab-panel active space-y-5">
      <div class="panel-card p-4 sm:p-5">

        </div>

    return out + '…';
  }

  function escHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fmtNum(v, dec) {
    const n = Number(v);
    if (!Number.isFinite(n)) return '—';
    const d = dec == null ? 1 : dec;
    return n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  }

  function niceStep(range, targetTicks) {
    const rough = range / Math.max(1, targetTicks || 4);
    const pow = Math.pow(10, Math.floor(Math.log10(Math.max(1e-6, rough))));
    const frac = rough / pow;
    let nice = 1;
    if (frac <= 1.2) nice = 1;
    else if (frac <= 2.2) nice = 2;
    else if (frac <= 2.8) nice = 2.5;
    else if (frac <= 5.5) nice = 5;
    else nice = 10;
    return nice * pow;
  }

  function buildAxisTicks(minVal, maxVal, count) {
    const lo = Math.min(0, minVal);
    const hi = Math.max(0, maxVal);
    const span = Math.max(1e-3, hi - lo);
    const step = niceStep(span, count || 4);
    const axisMin = lo < 0 ? Math.floor(lo / step) * step : 0;
    const axisMax = Math.ceil((hi * 1.12) / step) * step;
    const ticks = [];
    for (let v = axisMin; v <= axisMax + step * 0.01; v += step) {
      ticks.push(Number(v.toFixed(4)));
    }
    return { min: axisMin, max: Math.max(axisMax, axisMin + step), ticks };
  }

  function setText(id, text) {
    const el = document.getElementById(id);
    if (el) el.textContent = text == null ? '' : text;
  }

  const tooltip = document.getElementById('tooltip');
  function showTip(evt, html) {
    if (!tooltip || !html) return;
    tooltip.innerHTML = html;
    tooltip.style.opacity = '1';
    moveTip(evt);
  }
  function moveTip(evt) {
    if (!tooltip) return;
    const pad = 14;
    const rect = tooltip.getBoundingClientRect();
    let left = evt.clientX + pad;
    let top = evt.clientY + pad;
    if (left + rect.width > window.innerWidth - 10) left = evt.clientX - rect.width - pad;
    if (top + rect.height > window.innerHeight - 10) top = evt.clientY - rect.height - pad;
    if (left < 8) left = 8;
    if (top < 8) top = 8;
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
  }
  function hideTip() {
    if (tooltip) tooltip.style.opacity = '0';
  }
  function bindTooltips(container) {
    if (!container) return;
    container.querySelectorAll('[data-tip]').forEach(el => {
      el.addEventListener('mouseenter', e => showTip(e, el.getAttribute('data-tip')));
      el.addEventListener('mousemove', moveTip);
      el.addEventListener('mouseleave', hideTip);
    });
  }

  // Generic Waterfall renderer used by True EV, Margin Bridge & OE Bridge
  function renderWaterfallSvg(opts) {
    const W = opts.width || 900;
    const steps = opts.steps || [];
    const unit = opts.unit || '';
    const dec = opts.dec == null ? 1 : opts.dec;
    const footerHtml = opts.footerHtml || '';
    const padL = opts.padL || 54;
    const padR = opts.padR || 20;
    const padT = 34;
    const chartH = opts.chartH || 196;
    const padB = footerHtml ? 62 : 42;
    const H = padT + chartH + padB;
    const chartW = W - padL - padR;

    // Precompute running values to get exact Y bounds
    let run = 0;
    let maxVal = 0;
    let minVal = 0;
    const computed = steps.map(s => {
      const val = Number(s.delta != null ? s.delta : s.val) || 0;
      let y0, y1;
      if (s.isTotal) {
        y0 = 0; y1 = val; run = val;
      } else {
        y0 = run; y1 = +(run + val).toFixed(4); run = y1;
      }
      maxVal = Math.max(maxVal, y0, y1);
      minVal = Math.min(minVal, y0, y1);
      return { ...s, val, y0, y1 };
    });

    const axis = buildAxisTicks(minVal, maxVal, 4);
    const yOf = v => padT + chartH - ((v - axis.min) / (axis.max - axis.min)) * chartH;

    let svg = `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto">`;
    axis.ticks.forEach(v => {
      const gy = yOf(v);
      const isZero = Math.abs(v) < 1e-6;
      svg += `<line x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}" stroke="${isZero ? 'var(--border)' : 'var(--card-border)'}" ${isZero ? '' : 'stroke-dasharray="3,3"'} />`;
      svg += `<text x="${padL - 8}" y="${gy + 4}" text-anchor="end" font-size="10.5" fill="var(--muted-foreground)" class="num-mono">${v}${opts.axisUnit || ''}</text>`;
    });

    const slotW = chartW / Math.max(1, computed.length);
    const barW = Math.min(82, slotW * 0.56);

    computed.forEach((s, idx) => {
      const x = padL + idx * slotW + (slotW - barW) / 2;
      const yTop = yOf(Math.max(s.y0, s.y1));
      const yBot = yOf(Math.min(s.y0, s.y1));
      const h = Math.max(4, yBot - yTop);
      const c = col(s.color, s.isTotal ? 'var(--primary)' : (s.val >= 0 ? 'var(--error)' : 'var(--success)'));

      if (idx > 0 && !s.isTotal) {
        const prevX = padL + (idx - 1) * slotW + (slotW + barW) / 2;
        const connY = yOf(s.y0);
        svg += `<line x1="${prevX}" y1="${connY}" x2="${x}" y2="${connY}" stroke="var(--border)" stroke-dasharray="2,2" />`;
      }

      const valText = s.isTotal
        ? `${s.val.toFixed(dec)}${unit}`
        : `${s.val >= 0 ? '+' : ''}${s.val.toFixed(dec)}${opts.deltaUnit != null ? opts.deltaUnit : ''}`;

      const lbl = fitText(s.label, slotW - 4, 10.5);
      svg += `<g class="svg-interactive" data-tip="${escHtml(s.tip || `<b>${s.label}</b><br>${valText}`)}">`;
      svg += `<rect x="${x}" y="${yTop}" width="${barW}" height="${h}" rx="5" fill="${c}" opacity="${s.isTotal ? 0.92 : 0.82}" />`;
      svg += `<text x="${x + barW / 2}" y="${yTop - 6}" text-anchor="middle" font-size="10.8" font-weight="700" fill="${c}" class="num-mono">${valText}</text>`;
      svg += `<text x="${x + barW / 2}" y="${padT + chartH + 18}" text-anchor="middle" font-size="10.5" font-weight="${s.isTotal ? '700' : '500'}" fill="var(--foreground)">${escHtml(lbl)}</text>`;
      svg += `</g>`;
    });

    if (footerHtml) {
      svg += `<text x="${padL}" y="${H - 12}" font-size="10.8" fill="var(--muted-foreground)">${footerHtml}</text>`;
    }
    svg += `</svg>`;
    return svg;
  }

  // =========================================================================
  // 1. HEADER, TABS, KPI STRIP & FOOTER
  // =========================================================================
  function initHeaderAndChrome() {
    const m = D.meta;
    document.title = m.pageTitle || `${m.name}（${m.code}）全景可视化图谱看板`;
    setText('hdr-logo', m.logoText || m.name.slice(0, 4));
    setText('hdr-title', m.title || `${m.name}（${m.code}）可视化看板`);
    setText('hdr-subtitle', m.subtitle || '');

    const badgesEl = document.getElementById('hdr-badges');
    if (badgesEl && Array.isArray(m.badges)) {
      badgesEl.innerHTML = m.badges.map(b => {
        const c = col(b.color, 'var(--primary)');
        return `<span class="badge-soft" style="background: color-mix(in srgb, ${c} 15%, transparent); color: ${c};">${escHtml(b.text)}</span>`;
      }).join('');
    }

    if (D.tabTitles) {
      Object.entries(D.tabTitles).forEach(([k, v]) => setText('nav-tab-' + k, v));
    }

    const kpiEl = document.getElementById('kpi-strip');
    if (kpiEl && Array.isArray(D.kpis)) {
      kpiEl.innerHTML = D.kpis.map(k => {
        const c = col(k.color, 'var(--primary)');
        return `
          <div class="kpi-card p-3.5">
            <div class="text-[11px] font-medium text-[var(--muted-foreground)]">${escHtml(k.label)}</div>
            <div class="text-lg font-bold num-mono mt-1" style="color: ${c};">${escHtml(k.value)}</div>
            <div class="text-[11px] text-[var(--muted-foreground)] mt-0.5 leading-snug">${escHtml(k.sub || '')}</div>
          </div>`;
      }).join('');
    }

    setText('footer-left', m.footerLeft || `${m.name}（${m.code}）全景可视化图谱看板 · 数据 100% 源自官方原表与深度投研原稿`);
    setText('footer-right', m.footerRight || '免责声明：本看板仅作个人深度基本面研究与数据可视化复盘，不构成任何证券投资建议');

    document.querySelectorAll('.tab-btn').forEach(btn => {

        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        const panel = document.getElementById('tab-' + target);
        if (panel) panel.classList.add('active');
      });

    // Support direct deep-linking via #tab=<name> or ?tab=<name>
    const hashMatch = (location.hash || '').match(/tab=([a-z]+)/i) || (location.search || '').match(/tab=([a-z]+)/i);
    if (hashMatch) {
      document.querySelectorAll('.tab-btn').forEach(b => {
        if (b.getAttribute('data-tab') === hashMatch[1]) b.click();

  // =========================================================================
  // 2. TAB 1: OVERVIEW (SANKEY + TENSION + TIMELINE)
  // =========================================================================
  let sankeyModeIdx = 0;
  function renderSankey() {
    const sk = D.overview && D.overview.sankey;
    if (!sk) return;
    setText('sankey-title', sk.title || '全景资金流向桑基图');
    setText('sankey-sub', sk.subtitle || '');

    const modes = sk.modes || [{ key: 'default', label: '按业务结构', sources: sk.sources || [] }];
    const modeWrap = document.getElementById('sankey-modes');
    if (modeWrap) {
      if (modes.length > 1) {
        modeWrap.innerHTML = modes.map((m, i) =>
          `<button class="pill-btn ${i === sankeyModeIdx ? 'active' : ''} px-2.5 py-1 rounded-lg text-xs cursor-pointer" data-sk-idx="${i}">${escHtml(m.label)}</button>`
        ).join('');
        modeWrap.querySelectorAll('[data-sk-idx]').forEach(btn => {
          btn.addEventListener('click', () => {
            sankeyModeIdx = Number(btn.getAttribute('data-sk-idx'));
            renderSankey();
          });
        });
      } else {
        modeWrap.innerHTML = '';
      }
    }

    const mode = modes[sankeyModeIdx] || modes[0];
    const leftNodes = mode.sources || [];
    const totalRev = Number(sk.totalRev) || leftNodes.reduce((a, b) => a + (Number(b.val) || 0), 0) || 100;
    const costVal = Number(sk.cost.val) || 0;
    const gpVal = Number(sk.grossProfit.val) || Math.max(1, totalRev - costVal);
    const opexItems = sk.opexAndProfit || [];
    const cfItems = sk.cashflowCards || [];

    const W = 940;
    const topY = 44;
    const wNode = 18;
    const x0 = 16, x1 = 232, x2 = 438, x3 = 656, c4X = 766, c4W = 164;
    const usableH = 320;
    const scale = usableH / Math.max(1, totalRev);

    // Col 0 layout
    const gap0 = leftNodes.length <= 3 ? 16 : 10;
    let curY = topY;
    const leftPos = leftNodes.map(n => {
      const h = Math.max(26, (Number(n.val) || 0) * scale);
      const o = { ...n, val: Number(n.val) || 0, color: col(n.color, 'var(--chart-1)'), x: x0, y: curY, h };
      curY += h + gap0;
      return o;
    });
    const col0Bot = curY - gap0;

    // Col 1 Total Rev
    const revH = Math.max(160, Math.min(340, totalRev * scale));
    const revNode = { x: x1, y: topY + 12, h: revH };

    // Col 2 Cost + Gross Profit
    const costH = Math.max(42, (costVal / totalRev) * revH);
    const gpH = Math.max(54, (gpVal / totalRev) * revH);
    const costNode = { x: x2, y: topY + 6, h: costH };
    const gpNode = { x: x2, y: topY + 6 + costH + 20, h: gpH };
    const col2Bot = gpNode.y + gpNode.h;

    // Col 3 Opex & Net Profit
    const opexSum = opexItems.reduce((a, b) => a + Math.max(0.01, Math.abs(Number(b.val) || 0)), 0) || 1;
    const c3Usable = 265;
    let y3 = topY + 8;
    const col3Pos = opexItems.map(it => {
      const v = Number(it.val) || 0;
      const h = Math.max(24, (Math.abs(v) / opexSum) * c3Usable);
      const o = { ...it, val: v, color: col(it.color, 'var(--chart-5)'), x: x3, y: y3, h };
      y3 += h + 14;
      return o;
    });
    const col3Bot = y3 - 14;

    // Col 4 Cashflow Cards
    let y4 = topY + 18;
    const col4Pos = cfItems.map(c => {
      const h = c.sub ? 62 : 44;
      const o = { ...c, color: col(c.color, 'var(--primary)'), x: c4X, y: y4, h };
      y4 += h + 14;
      return o;
    });
    const col4Bot = y4 - 14;

    const maxBot = Math.max(col0Bot, revNode.y + revNode.h, col2Bot, col3Bot, col4Bot);
    const H = maxBot + 42;

    function ribbon(xa, ya, ha, xb, yb, hb, color, tip) {
      const cx = (xa + xb) / 2;
      const d = `M ${xa} ${ya} C ${cx} ${ya}, ${cx} ${yb}, ${xb} ${yb} L ${xb} ${yb + hb} C ${cx} ${yb + hb}, ${cx} ${ya + ha}, ${xa} ${ya + ha} Z`;
      return `<path d="${d}" fill="${color}" fill-opacity="0.22" stroke="${color}" stroke-opacity="0.36" stroke-width="0.6" class="svg-interactive" data-tip="${escHtml(tip)}" />`;
    }

    let svg = `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto">`;
    const headers = [
      [x0, mode.col0Header || '① 核心收入来源'],
      [x1 - 22, sk.col1Header || '② 总营收汇集'],
      [x2 - 18, sk.col2Header || '③ 成本 vs 毛利'],
      [x3 - 20, sk.col3Header || '④ 费用与归母净利'],
      [c4X, sk.col4Header || '⑤ 折旧还原与 FCF']
    ];
    headers.forEach(([hx, ht]) => {
      svg += `<text x="${hx}" y="22" font-size="11" font-weight="700" fill="var(--muted-foreground)">${escHtml(ht)}</text>`;
    });

    // Ribbons Col 0 -> Col 1
    let revCursor = revNode.y;
    leftPos.forEach(n => {
      const segH = (n.val / totalRev) * revNode.h;
      svg += ribbon(n.x + wNode, n.y, n.h, revNode.x, revCursor, segH, n.color, n.tip || `<b>${n.label}</b><br>${fmtNum(n.val, 1)}亿`);
      revCursor += segH;
    });

    // Ribbons Col 1 -> Col 2
    const cSplit = (costVal / totalRev) * revNode.h;
    svg += ribbon(revNode.x + wNode, revNode.y, cSplit, costNode.x, costNode.y, costNode.h, col(sk.cost.color, 'var(--chart-5)'), sk.cost.tip || `<b>营业成本 ${fmtNum(costVal, 1)}亿</b>`);
    svg += ribbon(revNode.x + wNode, revNode.y + cSplit, Math.max(8, revNode.h - cSplit), gpNode.x, gpNode.y, gpNode.h, col(sk.grossProfit.color, 'var(--primary)'), sk.grossProfit.tip || `<b>综合毛利 ${fmtNum(gpVal, 1)}亿</b>`);

    // Ribbons Col 2 (GP) -> Col 3
    let gpCursor = gpNode.y;
    col3Pos.forEach(n => {
      const segH = Math.max(4, (Math.abs(n.val) / opexSum) * gpNode.h);
      svg += ribbon(gpNode.x + wNode, gpCursor, segH, n.x, n.y, n.h, n.color, n.tip || `<b>${n.label}</b><br>${fmtNum(n.val, 1)}亿`);
      gpCursor += segH;
    });

    // Connector Col 3 last (Net Profit) -> Col 4 OCF or middle card
    if (col3Pos.length > 0 && col4Pos.length > 0) {
      const niNode = col3Pos[col3Pos.length - 1];
      const targetC4 = col4Pos.find(c => /OCF|经营/i.test(c.label)) || col4Pos[0];
      svg += ribbon(niNode.x + wNode, niNode.y, niNode.h, c4X, targetC4.y + 4, Math.max(14, targetC4.h - 8), 'var(--success)', sk.bridgeTip || `<b>盈利向现金流转化</b><br>${niNode.label} + 非付现折旧摊销 → ${targetC4.label}`);
    }

    // Arrows between Col 4 cards
    for (let i = 0; i < col4Pos.length - 1; i++) {
      const a = col4Pos[i], b = col4Pos[i + 1];
      svg += `<line x1="${c4X + c4W / 2}" y1="${a.y + a.h}" x2="${c4X + c4W / 2}" y2="${b.y}" stroke="${b.color}" stroke-width="1.8" stroke-dasharray="3,2" />`;
    }

    // Draw Col 0
    leftPos.forEach(n => {
      svg += `<rect x="${n.x}" y="${n.y}" width="${wNode}" height="${n.h}" rx="4" fill="${n.color}" class="svg-interactive" data-tip="${escHtml(n.tip || n.label)}" />`;
      const midY = n.y + n.h / 2;
      const pct = ((n.val / totalRev) * 100).toFixed(1) + '%';
      svg += `<text x="${n.x + wNode + 8}" y="${midY - 3}" font-size="11.5" font-weight="600" fill="var(--foreground)">${escHtml(fitText(n.label, 148, 11.5))}</text>`;
      svg += `<text x="${n.x + wNode + 8}" y="${midY + 11}" font-size="10.2" fill="var(--muted-foreground)" class="num-mono">${fmtNum(n.val, 1)}亿 (${pct})</text>`;
    });

    // Draw Col 1 Total Rev Box
    svg += `<rect x="${revNode.x}" y="${revNode.y}" width="${wNode}" height="${revNode.h}" rx="4" fill="var(--primary)" class="svg-interactive" data-tip="${escHtml(sk.totalRevTip || `<b>总营收 ${fmtNum(totalRev, 1)}亿</b>`)}" />`;
    const revBoxW = 122;
    svg += `<rect x="${revNode.x - (revBoxW - wNode) / 2}" y="${revNode.y + revNode.h / 2 - 23}" width="${revBoxW}" height="46" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.2" />`;
    svg += `<text x="${revNode.x + wNode / 2}" y="${revNode.y + revNode.h / 2 - 4}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--foreground)">${escHtml(sk.totalRevLabel || '总营业收入')}</text>`;
    svg += `<text x="${revNode.x + wNode / 2}" y="${revNode.y + revNode.h / 2 + 13}" text-anchor="middle" font-size="12" font-weight="800" fill="var(--primary)" class="num-mono">${fmtNum(totalRev, 1)}亿</text>`;

    // Draw Col 2 Cost & GP
    const costPct = ((costVal / totalRev) * 100).toFixed(1) + '%';
    const gpPct = ((gpVal / totalRev) * 100).toFixed(1) + '%';
    svg += `<rect x="${costNode.x}" y="${costNode.y}" width="${wNode}" height="${costNode.h}" rx="4" fill="${col(sk.cost.color, 'var(--chart-5)')}" class="svg-interactive" data-tip="${escHtml(sk.cost.tip || '')}" />`;
    svg += `<text x="${costNode.x + wNode + 8}" y="${costNode.y + costNode.h / 2 - 4}" font-size="11.5" font-weight="700" fill="var(--foreground)">${escHtml(sk.cost.label || '营业成本')}</text>`;
    svg += `<text x="${costNode.x + wNode + 8}" y="${costNode.y + costNode.h / 2 + 11}" font-size="10.5" fill="var(--muted-foreground)" class="num-mono">${fmtNum(costVal, 1)}亿 (${costPct})</text>`;

    svg += `<rect x="${gpNode.x}" y="${gpNode.y}" width="${wNode}" height="${gpNode.h}" rx="4" fill="${col(sk.grossProfit.color, 'var(--primary)')}" class="svg-interactive" data-tip="${escHtml(sk.grossProfit.tip || '')}" />`;
    svg += `<text x="${gpNode.x + wNode + 8}" y="${gpNode.y + gpNode.h / 2 - 4}" font-size="11.5" font-weight="700" fill="var(--primary)">${escHtml(sk.grossProfit.label || '综合毛利')}</text>`;
    svg += `<text x="${gpNode.x + wNode + 8}" y="${gpNode.y + gpNode.h / 2 + 11}" font-size="10.5" fill="var(--foreground)" class="num-mono">${fmtNum(gpVal, 1)}亿 (${gpPct})</text>`;

    // Draw Col 3
    col3Pos.forEach(n => {
      svg += `<rect x="${n.x}" y="${n.y}" width="${wNode}" height="${n.h}" rx="4" fill="${n.color}" class="svg-interactive" data-tip="${escHtml(n.tip || n.label)}" />`;
      const my = n.y + n.h / 2;
      const pctText = n.pct || ((n.val / totalRev) * 100).toFixed(1) + '%';
      svg += `<text x="${n.x - 8}" y="${my - 2}" text-anchor="end" font-size="11" font-weight="600" fill="var(--foreground)">${escHtml(fitText(n.label, 128, 11))}</text>`;
      svg += `<text x="${n.x - 8}" y="${my + 11}" text-anchor="end" font-size="10.2" fill="var(--muted-foreground)" class="num-mono">${fmtNum(n.val, 1)}亿 (${escHtml(pctText)})</text>`;
    });

    // Draw Col 4 Cards
    col4Pos.forEach(c => {
      svg += `<g class="svg-interactive" data-tip="${escHtml(c.tip || c.label)}">`;
      svg += `<rect x="${c.x}" y="${c.y}" width="${c4W}" height="${c.h}" rx="8" fill="color-mix(in srgb, ${c.color} 12%, var(--card))" stroke="${c.color}" stroke-width="1.3" />`;
      svg += `<text x="${c.x + 10}" y="${c.y + 16}" font-size="10.8" font-weight="700" fill="${c.color}">${escHtml(fitText(c.label, c4W - 18, 10.8))}</text>`;
      svg += `<text x="${c.x + 10}" y="${c.y + 33}" font-size="12.5" font-weight="800" fill="var(--foreground)" class="num-mono">${escHtml(c.valText || (fmtNum(c.val, 1) + ' 亿'))}</text>`;
      if (c.sub) {
        svg += `<text x="${c.x + 10}" y="${c.y + 50}" font-size="9.8" fill="var(--muted-foreground)">${escHtml(fitText(c.sub, c4W - 18, 9.8))}</text>`;
      }
      svg += `</g>`;
    });

    if (sk.footnote) {
      svg += `<text x="16" y="${H - 12}" font-size="10.5" fill="var(--muted-foreground)">${escHtml(fitText(sk.footnote, W - 32, 10.5))}</text>`;
    }
    svg += `</svg>`;

    const wrap = document.getElementById('sankey-wrap');
    if (wrap) {
      wrap.innerHTML = svg;
      bindTooltips(wrap);
    }
  }

  function renderTension() {

  let activeBizIdx = 0;
  function layoutTreemap(items, W, H, gap) {
    // Auto 2-column proportional treemap (zero overlap guaranteed)
    const total = items.reduce((a, b) => a + Math.max(0.01, Number(b.rev) || 0), 0) || 1;
    const indexed = items.map((it, i) => ({ ...it, _idx: i, rev: Math.max(0.01, Number(it.rev) || 0) }));
    if (indexed.length <= 2) {
      let cx = gap;
      return indexed.map(it => {
        const w = (it.rev / total) * (W - gap * (indexed.length + 1));
        const res = { ...it, x: cx, y: gap, w, h: H - gap * 2 };
        cx += w + gap;
        return res;
      });
    }
    // Split into left & right columns closest to 50%
    const left = [], right = [];
    let sumL = 0;
    indexed.forEach((it, idx) => {
      if (idx === 0 || (sumL + it.rev <= total * 0.58 && left.length < Math.ceil(indexed.length / 2))) {
        left.push(it); sumL += it.rev;
      } else {
        right.push(it);
      }
    });
    if (!right.length) right.push(left.pop());
    sumL = left.reduce((a, b) => a + b.rev, 0);
    const sumR = right.reduce((a, b) => a + b.rev, 0);

    const availW = W - gap * 3;
    const leftW = Math.max(availW * 0.34, Math.min(availW * 0.66, (sumL / total) * availW));
    const rightW = availW - leftW;

    const placeCol = (arr, colSum, x, w) => {
      const minH = 74;
      const availH = H - gap * (arr.length + 1);
      let rawH = arr.map(it => Math.max(minH, (it.rev / colSum) * availH));
      const rawSum = rawH.reduce((a, b) => a + b, 0);
      rawH = rawH.map(h => (h / rawSum) * availH);
      let cy = gap;
      return arr.map((it, i) => {
        const h = rawH[i];
        const o = { ...it, x, y: cy, w, h };
        cy += h + gap;
        return o;
      });
    };
    return [...placeCol(left, sumL, gap, leftW), ...placeCol(right, sumR, gap * 2 + leftW, rightW)];
  }

              if (ch.tag) {
                body += `<text x="${W - 18}" y="${ry + 18}" text-anchor="end" font-size="10.5" font-weight="700" fill="${rc}">${escHtml(fitText(ch.tag, tagW + 4, 10.5))}</text>`;

    const bom = D.business && D.business.bom;

      setText('bom-title', bom.title || 'BOM / 成本构成环形图');
      setText('bom-sub', bom.subtitle || '');
      const segs = bom.segments || [];
      const total = segs.reduce((a, b) => a + (Number(b.pct) || 0), 0) || 100;
      const bW = 380;
      const legH = Math.max(200, segs.length * 46 + 44);
      const bH = Math.max(266, legH + 26);
      const cx = 104, cy = Math.min(130, bH / 2 - 10), rOuter = 76, rInner = 44;

      let startAng = -Math.PI / 2;
      let bsvg = `<svg viewBox="0 0 ${bW} ${bH}" class="w-full h-auto">`;
      segs.forEach((s, idx) => {
        const ang = ((Number(s.pct) || 0) / total) * Math.PI * 2;
        const endAng = startAng + ang;
        const large = ang > Math.PI ? 1 : 0;
        const x1o = cx + rOuter * Math.cos(startAng), y1o = cy + rOuter * Math.sin(startAng);
        const x2o = cx + rOuter * Math.cos(endAng), y2o = cy + rOuter * Math.sin(endAng);
        const x1i = cx + rInner * Math.cos(endAng), y1i = cy + rInner * Math.sin(endAng);
        const x2i = cx + rInner * Math.cos(startAng), y2i = cy + rInner * Math.sin(startAng);
        const d = `M ${x1o} ${y1o} A ${rOuter} ${rOuter} 0 ${large} 1 ${x2o} ${y2o} L ${x1i} ${y1i} A ${rInner} ${rInner} 0 ${large} 0 ${x2i} ${y2i} Z`;

    svg += `<text x="472" y="22" font-size="12.5" font-weight="700" fill="var(--error)">${escHtml(bs.rightHeader || '穿透刚性债与股东权益')}</text>`;

    const drawCol = (arr, x, w) => {
      arr.forEach((it, idx) => {
        const y = 34 + idx * (rowH + rowGap);
        const c = col(it.color, 'var(--primary)');
        const valStr = it.valText || `${fmtNum(it.val, 1)}亿`;
        const rightReserve = Math.max(estTextWidth(valStr, 13), estTextWidth(it.badge || '', 10)) + 26;
        const leftMax = w - rightReserve - 16;
        svg += `<g class="svg-interactive" data-tip="${escHtml(it.tip || `<b>${it.name}：${valStr}</b><br>${it.sub || ''}`)}">`;
        svg += `<rect x="${x}" y="${y}" width="${w}" height="${rowH}" rx="8" fill="color-mix(in srgb, ${c} 9%, var(--card))" stroke="${c}" stroke-width="1.2" />`;
        svg += `<text x="${x + 12}" y="${y + 18}" font-size="11.8" font-weight="700" fill="var(--foreground)">${escHtml(fitText(it.name, leftMax, 11.8))}</text>`;
        svg += `<text x="${x + 12}" y="${y + 36}" font-size="10.2" fill="var(--muted-foreground)">${escHtml(fitText(it.sub || '', leftMax, 10.2))}</text>`;
        svg += `<text x="${x + w - 12}" y="${y + 18}" text-anchor="end" font-size="12.8" font-weight="800" fill="${c}" class="num-mono">${escHtml(valStr)}</text>`;
        if (it.badge) {
          svg += `<text x="${x + w - 12}" y="${y + 36}" text-anchor="end" font-size="10" font-weight="600" fill="${c}">${escHtml(it.badge)}</text>`;
        }
        svg += `</g>`;
      });
    };
    drawCol(left, 14, 438);
    drawCol(right, 472, 434);
    svg += `</svg>`;

    const wrap = document.getElementById('balance-svg');
    if (wrap) {
      wrap.innerHTML = svg;
      bindTooltips(wrap);
    }
  }

    const be = D.assets && D.assets.breakeven;
    if (!uc && !be) {

        cw.innerHTML = uc.customSvg;
