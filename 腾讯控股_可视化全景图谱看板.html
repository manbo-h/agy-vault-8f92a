          svg += `<text x="${leftPad - 8}" y="${y + (r.peer != null ? 15 : 13)}" text-anchor="end" font-size="11" font-weight="600" fill="var(--foreground)">${escHtml(fitText(r.name, leftPad - 12, 11))}</text>`;
          svg += `<rect x="${leftPad}" y="${y}" width="${w1}" height="${r.peer != null ? 14 : 20}" rx="4" fill="${c}" />`;
          svg += `<text x="${leftPad + w1 + 6}" y="${y + (r.peer != null ? 11 : 14)}" font-size="10.5" font-weight="700" fill="${c}" class="num-mono">${escHtml(r.valText || (r.val + unit))}</text>`;
          if (r.peer != null) {
            const w2 = Math.max(4, ((Number(r.peer) || 0) / maxV) * barArea);
            svg += `<rect x="${leftPad}" y="${y + 17}" width="${w2}" height="10" rx="3" fill="var(--muted-foreground)" opacity="0.45" />`;
            svg += `<text x="${leftPad + w2 + 6}" y="${y + 26}" font-size="9.5" fill="var(--muted-foreground)">${escHtml(r.peerLbl || (r.peer + unit))}</text>`;
          }
          svg += `</g>`;
        });
        if (uc.footnote) {
          svg += `<text x="10" y="${H - 10}" font-size="10" fill="var(--muted-foreground)">${escHtml(fitText(uc.footnote, W - 20, 10))}</text>`;
        }
        svg += `</svg>`;
        cw.innerHTML = svg;
        bindTooltips(cw);
      }
    }

    // Right: Breakeven / Grouped Vertical Bar
    const bw = document.getElementById('breakeven-svg');
    if (be && bw) {
      setText('breakeven-title', be.title || '增量产能盈亏平衡与达标稼动率');
      setText('breakeven-sub', be.subtitle || '');
      if (be.customSvg) {
        bw.innerHTML = be.customSvg;
        bindTooltips(bw);
      } else {
        const items = be.items || [];
        const W = 540, H = 266;
        const padL = 46, padR = 16, padT = 30, chartH = 172, chartW = W - padL - padR;
        const maxRaw = Math.max(...items.flatMap(it => [Number(it.v1) || 0, Number(it.v2) || 0]), 10);
        const axis = buildAxisTicks(0, Math.max(be.maxY || 0, maxRaw), 4);
        const yOf = v => padT + chartH - (v / axis.max) * chartH;
        const unit = be.unit != null ? be.unit : '%';

        let svg = `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto">`;
        svg += `<rect x="${padL}" y="5" width="10" height="10" rx="2" fill="var(--chart-3)" /><text x="${padL + 14}" y="14" font-size="10.5" fill="var(--foreground)">${escHtml(be.legend1 || '指标一')}</text>`;
        if (be.legend2) {
          const lx2 = padL + 26 + estTextWidth(be.legend1 || '指标一', 10.5);
          svg += `<rect x="${lx2}" y="5" width="10" height="10" rx="2" fill="var(--warning)" /><text x="${lx2 + 14}" y="14" font-size="10.5" fill="var(--foreground)">${escHtml(be.legend2)}</text>`;
        }

        axis.ticks.forEach(v => {
          const gy = yOf(v);
          svg += `<line x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}" stroke="var(--card-border)" stroke-dasharray="3,3" />`;
          svg += `<text x="${padL - 6}" y="${gy + 4}" text-anchor="end" font-size="10" fill="var(--muted-foreground)" class="num-mono">${v}${unit}</text>`;
        });

        const grpW = chartW / Math.max(1, items.length);
        items.forEach((it, i) => {
          const has2 = it.v2 != null;
          const bwBar = has2 ? Math.min(34, grpW * 0.30) : Math.min(46, grpW * 0.46);
          const gx = padL + i * grpW + (has2 ? (grpW - bwBar * 2 - 5) / 2 : (grpW - bwBar) / 2);
          const y1 = yOf(Number(it.v1) || 0), h1 = padT + chartH - y1;
          svg += `<g class="svg-interactive" data-tip="${escHtml(it.tip || it.name)}">`;
          svg += `<rect x="${gx}" y="${y1}" width="${bwBar}" height="${Math.max(2, h1)}" rx="4" fill="var(--chart-3)" />`;
          svg += `<text x="${gx + bwBar / 2}" y="${y1 - 4}" text-anchor="middle" font-size="9.8" font-weight="700" fill="var(--chart-3)" class="num-mono">${it.v1}${unit}</text>`;
          if (has2) {
            const y2 = yOf(Number(it.v2) || 0), h2 = padT + chartH - y2;
            const c2 = it.highlight ? 'var(--error)' : 'var(--warning)';
            svg += `<rect x="${gx + bwBar + 5}" y="${y2}" width="${bwBar}" height="${Math.max(2, h2)}" rx="4" fill="${c2}" />`;
            svg += `<text x="${gx + bwBar + 5 + bwBar / 2}" y="${y2 - 4}" text-anchor="middle" font-size="9.8" font-weight="700" fill="${c2}" class="num-mono">${it.v2}${unit}</text>`;
          }
          const cx = padL + i * grpW + grpW / 2;
          svg += `<text x="${cx}" y="${padT + chartH + 17}" text-anchor="middle" font-size="10.5" font-weight="${it.highlight ? '700' : '500'}" fill="var(--foreground)">${escHtml(fitText(it.name, grpW - 4, 10.5))}</text>`;
          if (it.sub) {
            svg += `<text x="${cx}" y="${padT + chartH + 31}" text-anchor="middle" font-size="9.5" fill="var(--muted-foreground)">${escHtml(fitText(it.sub, grpW - 4, 9.5))}</text>`;
          }
          svg += `</g>`;
        });
        svg += `</svg>`;
        bw.innerHTML = svg;
        bindTooltips(bw);
      }
    }
  }

  let evMktIdx = 0, evModeIdx = 0;
  function renderTrueEV() {
    const ev = D.assets && D.assets.trueEV;
    if (!ev) return;
    setText('ev-title', ev.title || '买方铁尺 True EV 瀑布穿透图');
    setText('ev-sub', ev.subtitle || '');

    const mkts = ev.markets || [{ key: 'default', label: '', mcap: ev.mcap || 0, mcapLabel: '总市值' }];
    const modes = ev.modes || [{ key: 'default', label: '', steps: ev.steps || [], summaryHtml: ev.summaryHtml || '' }];

    const mWrap = document.getElementById('ev-mkt-btns');
    if (mWrap) {
      if (mkts.length > 1) {
        mWrap.innerHTML = mkts.map((m, i) =>
          `<button class="pill-btn ${i === evMktIdx ? 'active' : ''} px-2.5 py-1 rounded-lg text-xs cursor-pointer" data-ev-m="${i}">${escHtml(m.label)}</button>`
        ).join('');
        mWrap.querySelectorAll('[data-ev-m]').forEach(b => b.addEventListener('click', () => {
          evMktIdx = Number(b.getAttribute('data-ev-m'));
          renderTrueEV();
        }));
      } else {
        mWrap.innerHTML = '';
      }
    }

    const mdWrap = document.getElementById('ev-mode-btns');
    if (mdWrap) {
      if (modes.length > 1) {
        mdWrap.innerHTML = modes.map((m, i) =>
          `<button class="pill-btn ${i === evModeIdx ? 'active' : ''} px-2.5 py-1 rounded-lg text-xs cursor-pointer" data-ev-md="${i}">${escHtml(m.label)}</button>`
        ).join('');
        mdWrap.querySelectorAll('[data-ev-md]').forEach(b => b.addEventListener('click', () => {
          evModeIdx = Number(b.getAttribute('data-ev-md'));
          renderTrueEV();
        }));
      } else {
        mdWrap.innerHTML = '';
      }
    }

    const mkt = mkts[evMktIdx] || mkts[0];
    const mode = modes[evModeIdx] || modes[0];
    const midSteps = mode.steps || ev.baseSteps || [];
    const deltaSum = midSteps.reduce((a, b) => a + (Number(b.delta) || 0), 0);
    const mcap = Number(mkt.mcap) || 0;
    const trueEV = +(mcap + deltaSum).toFixed(2);
    const oeRef = Number(ev.oeRef) || 0;

    const fullSteps = [
      { label: mkt.mcapLabel || '总市值', delta: mcap, isTotal: true, color: 'var(--primary)', tip: mkt.tip || `<b>${mkt.mcapLabel || '总市值'}：${fmtNum(mcap, 2)}亿</b>` },
      ...midSteps,
      {
        label: ev.finalLabel || 'True EV 真实买价',
        delta: trueEV,
        isTotal: true,
        color: 'var(--chart-1)',
        tip: `<b>True EV = ${fmtNum(trueEV, 2)}亿元</b><br>净调整 ev_delta = ${deltaSum >= 0 ? '+' : ''}${deltaSum.toFixed(2)}亿` +
             (oeRef > 0 ? `<br>对应常态 OE (${oeRef}亿) 回报率 = ${((oeRef / trueEV) * 100).toFixed(2)}%` : '')
      }
    ];

    const deltaColor = deltaSum >= 0 ? 'var(--error)' : 'var(--success)';
    const footerHtml = mode.summaryHtml || (
      `当前口径：ev_delta = <tspan font-weight="700" fill="${deltaColor}">${deltaSum >= 0 ? '+' : ''}${deltaSum.toFixed(2)}亿</tspan>` +
      (mode.excessCash != null ? ` ｜ 超额可抵债现金 <tspan font-weight="700" fill="var(--success)">${Number(mode.excessCash).toFixed(2)}亿</tspan>` : '') +
      (oeRef > 0 ? ` ｜ 隐含常态 OE (${oeRef}亿) 回报率 = <tspan font-weight="700" fill="var(--primary)">${((oeRef / trueEV) * 100).toFixed(2)}%</tspan>` : '')
    );

    const wrap = document.getElementById('true-ev-svg');
    if (wrap) {
      wrap.innerHTML = renderWaterfallSvg({ width: 920, chartH: 210, steps: fullSteps, unit: '亿', dec: 1, footerHtml });
      bindTooltips(wrap);
    }
  }

  // =========================================================================
  // 5. TAB 4: 5-YEAR HISTORY, OCF/CAPEX/FCF & CAPITAL RETURN
  // =========================================================================
  let histViewIdx = 0;
  function renderHistory() {
    const h = D.history;
    if (!h) return;

    // 4A: Combo Chart
    const combo = h.combo;
    if (combo) {
      setText('hist-title', combo.title || '近五年一期营收与盈利轨迹');
      setText('hist-sub', combo.subtitle || '');
      const views = combo.views || [];
      const btnWrap = document.getElementById('hist-view-btns');
      if (btnWrap) {
        if (views.length > 1) {
          btnWrap.innerHTML = views.map((v, i) =>
            `<button class="pill-btn ${i === histViewIdx ? 'active' : ''} px-2.5 py-1 rounded-lg text-xs cursor-pointer" data-hv="${i}">${escHtml(v.label)}</button>`
          ).join('');
          btnWrap.querySelectorAll('[data-hv]').forEach(b => b.addEventListener('click', () => {
            histViewIdx = Number(b.getAttribute('data-hv'));
            renderHistory();
          }));
        } else {
          btnWrap.innerHTML = '';
        }
      }

      const v = views[histViewIdx] || views[0];
      const periods = combo.periods || [];
      if (v && periods.length) {
        const W = 860, H = 300;
        const padL = 56, padR = 52, padT = 40, chartH = 196, chartW = W - padL - padR;
        const bars = v.bars || [];
        const bMin = Math.min(0, ...bars), bMax = Math.max(0, ...bars);
        const axis = buildAxisTicks(bMin, bMax, 4);
        const yB = val => padT + chartH - ((val - axis.min) / (axis.max - axis.min)) * chartH;
        const zeroY = yB(0);

        let svg = `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto">`;
        axis.ticks.forEach(tv => {
          const gy = yB(tv);
          const isZ = Math.abs(tv) < 1e-6;
          svg += `<line x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}" stroke="${isZ ? 'var(--border)' : 'var(--card-border)'}" ${isZ ? '' : 'stroke-dasharray="3,3"'} />`;
          svg += `<text x="${padL - 8}" y="${gy + 4}" text-anchor="end" font-size="10.5" fill="var(--muted-foreground)" class="num-mono">${tv}</text>`;
        });

        const slotW = chartW / periods.length;
        const barW = Math.min(64, slotW * 0.44);
        const xs = [], barTops = [];
        const barCol = col(v.barColor, 'var(--primary)');
        const lastCol = col(v.lastBarColor, 'var(--chart-2)');

        bars.forEach((val, i) => {
          const x = padL + i * slotW + (slotW - barW) / 2;
          const cx = x + barW / 2;
          xs.push(cx);
          const isLast = v.highlightLast && i === periods.length - 1;
          const c = isLast ? lastCol : barCol;
          const yVal = yB(val);
          const yTop = Math.min(zeroY, yVal);
          const bh = Math.max(3, Math.abs(zeroY - yVal));
          barTops.push(yTop);
          const tip = (v.tips && v.tips[i]) || `<b>${periods[i]}</b><br>${v.barLegend || '数值'}：${fmtNum(val, 1)}`;
          svg += `<g class="svg-interactive" data-tip="${escHtml(tip)}">`;
          svg += `<rect x="${x}" y="${yTop}" width="${barW}" height="${bh}" rx="5" fill="${c}" opacity="${isLast ? 0.78 : 0.88}" />`;
          const lblY = val >= 0 ? yTop - 6 : yTop + bh + 12;
          svg += `<text x="${cx}" y="${lblY}" text-anchor="middle" font-size="10.8" font-weight="700" fill="${c}" class="num-mono">${fmtNum(val, 1)}</text>`;
          svg += `<text x="${cx}" y="${padT + chartH + 18}" text-anchor="middle" font-size="11" font-weight="${isLast ? '700' : '500'}" fill="var(--foreground)">${escHtml(periods[i])}</text>`;
          svg += `</g>`;
        });

        if (Array.isArray(v.line) && v.line.length === periods.length) {
          const lCol = col(v.lineColor, 'var(--warning)');
          const lMin = Math.min(...v.line), lMax = Math.max(...v.line);
          const lSpan = Math.max(1, lMax - lMin);
          const lo = lMin - lSpan * 0.35;
          const hi = lMax + lSpan * 0.45;
          const yL = val => padT + chartH - ((val - lo) / (hi - lo)) * chartH;

          let pathD = '';
          v.line.forEach((lv, i) => { pathD += (i === 0 ? 'M ' : ' L ') + `${xs[i]} ${yL(lv)}`; });
          svg += `<path d="${pathD}" fill="none" stroke="${lCol}" stroke-width="2.6" />`;

          v.line.forEach((lv, i) => {
            const px = xs[i], py = yL(lv);
            // Anti-overlap: if pill box would hit bar top label, push up or down
            let lblY = py - 18;
            if (Math.abs(lblY - (barTops[i] - 10)) < 20) lblY = Math.min(py, barTops[i]) - 26;
            lblY = Math.max(padT + 4, lblY);
            const txt = `${Number(lv).toFixed(v.lineDec == null ? 2 : v.lineDec)}${v.lineUnit || '%'}`;
            const pw = Math.max(46, estTextWidth(txt, 10) + 12);
            svg += `<circle cx="${px}" cy="${py}" r="4.5" fill="var(--card)" stroke="${lCol}" stroke-width="2.3" />`;
            svg += `<rect x="${px - pw / 2}" y="${lblY - 10}" width="${pw}" height="16" rx="4" fill="var(--card)" stroke="${lCol}" stroke-width="0.9" />`;
            svg += `<text x="${px}" y="${lblY + 1.5}" text-anchor="middle" font-size="10" font-weight="700" fill="${lCol}" class="num-mono">${txt}</text>`;
          });
          svg += `<rect x="${padL}" y="10" width="12" height="10" rx="2" fill="${barCol}" /><text x="${padL + 16}" y="19" font-size="11" fill="var(--foreground)">${escHtml(v.barLegend || '')}</text>`;
          const lx = padL + 28 + estTextWidth(v.barLegend || '', 11);
          svg += `<line x1="${lx}" y1="15" x2="${lx + 20}" y2="15" stroke="${lCol}" stroke-width="2.5" /><text x="${lx + 26}" y="19" font-size="11" fill="${lCol}">${escHtml(v.lineLegend || '')}</text>`;
        } else if (v.banner) {
          const bw = Math.min(W - padL - padR, estTextWidth(v.banner, 11) + 28);
          svg += `<rect x="${padL}" y="8" width="${bw}" height="22" rx="6" fill="color-mix(in srgb, var(--success) 12%, var(--card))" stroke="var(--success)" stroke-width="0.9" />`;
          svg += `<text x="${padL + 12}" y="23" font-size="11" font-weight="700" fill="var(--success)">${escHtml(fitText(v.banner, bw - 20, 11))}</text>`;
        }

        if (combo.footnote) {
          svg += `<text x="${padL}" y="${H - 10}" font-size="10.5" fill="var(--muted-foreground)">${escHtml(fitText(combo.footnote, W - padL - 16, 10.5))}</text>`;
        }
        svg += `</svg>`;
        const cw = document.getElementById('hist-combo-svg');
        if (cw) { cw.innerHTML = svg; bindTooltips(cw); }
      }
    }

    // 4B: OCF vs CapEx vs FCF (supports negative FCF gracefully!)
    const cf = h.cashflow;
    if (cf && Array.isArray(cf.periods)) {
      setText('fcf-title', cf.title || '造血硬账本：OCF vs CapEx vs 自由现金流 FCF');
      setText('fcf-sub', cf.subtitle || '');
      const W = 860, H = 310;
      const padL = 52, padR = 20, padT = 36, chartH = 202, chartW = W - padL - padR;
      const allVals = [...(cf.ocf || []), ...(cf.capex || []), ...(cf.fcf || [])];
      const axis = buildAxisTicks(Math.min(0, ...allVals), Math.max(0, ...allVals), 4);
      const yV = v => padT + chartH - ((v - axis.min) / (axis.max - axis.min)) * chartH;
      const zY = yV(0);

      let svg = `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto">`;
      axis.ticks.forEach(tv => {
        const gy = yV(tv);
        const isZ = Math.abs(tv) < 1e-6;
        svg += `<line x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}" stroke="${isZ ? 'var(--border)' : 'var(--card-border)'}" ${isZ ? 'stroke-width="1.2"' : 'stroke-dasharray="3,3"'} />`;
        svg += `<text x="${padL - 8}" y="${gy + 4}" text-anchor="end" font-size="10.5" fill="var(--muted-foreground)" class="num-mono">${tv}</text>`;
      });

      const slotW = chartW / Math.max(1, cf.periods.length);
      const bw = Math.min(28, slotW * 0.23);
      cf.periods.forEach((p, i) => {
        const gx = padL + i * slotW + (slotW - (bw * 3 + 8)) / 2;
        const o = Number((cf.ocf || [])[i]) || 0;
        const c = Number((cf.capex || [])[i]) || 0;
        const f = Number((cf.fcf || [])[i]) || 0;
        const rat = (cf.ratios || [])[i];
        const tip = `<b>${p} 现金流账本</b><br>OCF：${o.toFixed(2)}亿<br>CapEx：${c.toFixed(2)}亿<br>FCF：${f.toFixed(2)}亿` + (rat != null ? `<br>净现比：${rat}%` : '');
        svg += `<g class="svg-interactive" data-tip="${escHtml(tip)}">`;
        const triplets = [
          [o, 'var(--primary)', gx],
          [c, 'var(--warning)', gx + bw + 4],
          [f, f >= 0 ? 'var(--success)' : 'var(--error)', gx + (bw + 4) * 2]
        ];
        triplets.forEach(([val, color, bx]) => {
          const vy = yV(val);
          const yt = Math.min(zY, vy);
          const bh = Math.max(2, Math.abs(zY - vy));
          svg += `<rect x="${bx}" y="${yt}" width="${bw}" height="${bh}" rx="3" fill="${color}" />`;
          const ly = val >= 0 ? yt - 4 : yt + bh + 11;
          svg += `<text x="${bx + bw / 2}" y="${ly}" text-anchor="middle" font-size="9.2" font-weight="700" fill="${color}" class="num-mono">${val.toFixed(0)}</text>`;
        });
        const cx = padL + i * slotW + slotW / 2;
        svg += `<text x="${cx}" y="${padT + chartH + 22}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--foreground)">${escHtml(p)}</text>`;
        if (rat != null) {
          const warnRat = Number(rat) < 90;
          svg += `<text x="${cx}" y="${padT + chartH + 36}" text-anchor="middle" font-size="9.5" fill="${warnRat ? 'var(--error)' : 'var(--muted-foreground)'}" class="num-mono">净现比 ${rat}%</text>`;
        }
        svg += `</g>`;
      });

      svg += `<rect x="${padL}" y="8" width="11" height="10" rx="2" fill="var(--primary)" /><text x="${padL + 15}" y="17" font-size="11" fill="var(--foreground)">经营现金流 OCF</text>`;
      svg += `<rect x="${padL + 128}" y="8" width="11" height="10" rx="2" fill="var(--warning)" /><text x="${padL + 143}" y="17" font-size="11" fill="var(--foreground)">资本开支 CapEx</text>`;
      svg += `<rect x="${padL + 258}" y="8" width="11" height="10" rx="2" fill="var(--success)" /><text x="${padL + 273}" y="17" font-size="11" fill="var(--foreground)">${escHtml(cf.fcfLegend || '自由现金流 FCF')}</text>`;
      svg += `</svg>`;

      const fw = document.getElementById('fcf-svg');
      if (fw) { fw.innerHTML = svg; bindTooltips(fw); }
    }

    // 4C Left: Capital Return Ledger
    const ret = h.capitalReturn;
    if (ret && Array.isArray(ret.items)) {
      setText('return-title', ret.title || '上市以来资本回报总账本');
      setText('return-sub', ret.subtitle || '');
      const W = 380, H = Math.max(210, 20 + ret.items.length * 66 + 10);
      const maxV = Math.max(...ret.items.map(it => Number(it.val) || 0), 1) * 1.12;
      let svg = `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto">`;
      ret.items.forEach((it, idx) => {
        const y = 14 + idx * 66;
        const c = col(it.color, 'var(--primary)');
        const barW = Math.max(24, ((Number(it.val) || 0) / maxV) * 238);
        svg += `<g class="svg-interactive" data-tip="${escHtml(it.tip || `<b>${it.label}</b><br>${it.valText || it.val + '亿'}<br>${it.sub || ''}`)}">`;
        svg += `<text x="8" y="${y + 13}" font-size="11.5" font-weight="700" fill="var(--foreground)">${escHtml(fitText(it.label, W - 16, 11.5))}</text>`;
        svg += `<rect x="8" y="${y + 20}" width="${barW}" height="18" rx="5" fill="${c}" />`;
        svg += `<text x="${8 + barW + 8}" y="${y + 33}" font-size="12.2" font-weight="800" fill="${c}" class="num-mono">${escHtml(it.valText || (it.val + '亿'))}</text>`;
        svg += `<text x="8" y="${y + 52}" font-size="10" fill="var(--muted-foreground)">${escHtml(fitText(it.sub || '', W - 16, 10))}</text>`;
        svg += `</g>`;
      });
      svg += `</svg>`;
      const rw = document.getElementById('return-ledger-svg');
      if (rw) { rw.innerHTML = svg; bindTooltips(rw); }
    }

    // 4C Right: Payout Ladder
    const pay = h.payout;
    if (pay && Array.isArray(pay.years)) {
      setText('payout-title', pay.title || '年度现金分红支付率跃升阶梯');
      setText('payout-sub', pay.subtitle || '');
      const pW = 540, pH = 232;
      const padL = 44, padR = 16, padT = 28, cH = 148, cW = pW - padL - padR;
      const vals = pay.values || [];
      const axis = buildAxisTicks(0, Math.max(...vals, 10), 4);
      const yOf = v => padT + cH - (v / axis.max) * cH;
      const unit = pay.unit != null ? pay.unit : '%';

      let psvg = `<svg viewBox="0 0 ${pW} ${pH}" class="w-full h-auto">`;
      axis.ticks.forEach(tv => {
        const gy = yOf(tv);
        psvg += `<line x1="${padL}" y1="${gy}" x2="${pW - padR}" y2="${gy}" stroke="var(--card-border)" stroke-dasharray="3,3" />`;
        psvg += `<text x="${padL - 6}" y="${gy + 4}" text-anchor="end" font-size="10" fill="var(--muted-foreground)" class="num-mono">${tv}${unit}</text>`;
      });

      const sw = cW / Math.max(1, pay.years.length);
      const bw = Math.min(44, sw * 0.56);
      pay.years.forEach((yr, i) => {
        const v = Number(vals[i]) || 0;
        const x = padL + i * sw + (sw - bw) / 2;
        const y = yOf(v);
        const bh = Math.max(3, padT + cH - y);
        const isEst = Array.isArray(pay.estIndices) ? pay.estIndices.includes(i) : /\*/.test(yr);
        const c = isEst ? 'var(--chart-3)' : 'var(--primary)';
        psvg += `<g class="svg-interactive" data-tip="${escHtml((pay.tips && pay.tips[i]) || `<b>${yr}</b><br>${v}${unit}`)}">`;
        psvg += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${c}" opacity="${isEst ? 0.55 : 0.88}" ${isEst ? 'stroke="var(--chart-3)" stroke-dasharray="3,2"' : ''} />`;
        psvg += `<text x="${x + bw / 2}" y="${y - 6}" text-anchor="middle" font-size="10.2" font-weight="700" fill="${c}" class="num-mono">${isEst ? (pay.estPrefix || '≥') : ''}${v}${unit}</text>`;
        psvg += `<text x="${x + bw / 2}" y="${padT + cH + 17}" text-anchor="middle" font-size="10.2" fill="var(--foreground)">${escHtml(yr)}</text>`;
        psvg += `</g>`;
      });
      if (pay.footnote) {
        psvg += `<text x="10" y="${pH - 8}" font-size="10" fill="${col(pay.footnoteColor, 'var(--muted-foreground)')}">${escHtml(fitText(pay.footnote, pW - 20, 10))}</text>`;
      }
      psvg += `</svg>`;
      const pw = document.getElementById('payout-svg');
      if (pw) { pw.innerHTML = psvg; bindTooltips(pw); }
    }
  }

  // =========================================================================
  // 6. TAB 5: MARGIN BRIDGE, PEER BARS, INVENTORY QUADRANT & AUDIT TABLE
  // =========================================================================
  let bridgeIdx = 0;
  function renderMarginsTab() {
    const mg = D.margins;
    if (!mg) return;

    // 5A: Margin Bridge
    const br = mg.bridge;
    if (br) {
      setText('bridge-title', br.title || '盈利剪刀差“手术刀桥接图”');
      setText('bridge-sub', br.subtitle || '');
      const peers = br.peers || [{ label: '', steps: br.steps || [], footnote: br.footnote || '' }];
      const bWrap = document.getElementById('bridge-peer-btns');
      if (bWrap) {
        if (peers.length > 1) {
          bWrap.innerHTML = peers.map((p, i) =>
            `<button class="pill-btn ${i === bridgeIdx ? 'active' : ''} px-2.5 py-1 rounded-lg text-xs cursor-pointer" data-br="${i}">${escHtml(p.label)}</button>`
          ).join('');
          bWrap.querySelectorAll('[data-br]').forEach(b => b.addEventListener('click', () => {
            bridgeIdx = Number(b.getAttribute('data-br'));
            renderMarginsTab();
          }));
        } else {
          bWrap.innerHTML = '';
        }
      }
      const cur = peers[bridgeIdx] || peers[0];
      const wrap = document.getElementById('margin-bridge-svg');
      if (wrap) {
        wrap.innerHTML = renderWaterfallSvg({
          width: 860, chartH: 186, steps: cur.steps || [],
          unit: '%', deltaUnit: 'pct', axisUnit: '%', dec: 2,
          footerHtml: escHtml(cur.footnote || br.footnote || '')
        });
        bindTooltips(wrap);
      }
    }

    // 5B: Peer Bars
    const pb = mg.peerBars;
    if (pb && Array.isArray(pb.metrics)) {
      setText('peer-bars-title', pb.title || '核心同行盈利剪刀差对质');
      setText('peer-bars-sub', pb.subtitle || '');
      const companies = pb.companies || [];
      const nComp = Math.max(1, companies.length);
      const rowH = nComp * 14 + 14;
      const W = 540, H = Math.max(246, 36 + pb.metrics.length * rowH + 22);
      const bx = 136, maxBar = 310;

      let svg = `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto">`;
      let lx = 14;
      companies.forEach((cp, idx) => {
        const c = col(cp.color, `var(--chart-${idx + 1})`);
        svg += `<rect x="${lx}" y="6" width="10" height="10" rx="2" fill="${c}" /><text x="${lx + 14}" y="15" font-size="11" font-weight="${idx === 0 ? '700' : '500'}" fill="${idx === 0 ? c : 'var(--foreground)'}">${escHtml(cp.name)}</text>`;
        lx += estTextWidth(cp.name, 11) + 32;
      });

      pb.metrics.forEach((m, idx) => {
        const y = 32 + idx * rowH;
        const vals = m.values || [];
        const maxAbs = Math.max(...vals.map(v => Math.abs(Number(v) || 0)), 1) * 1.15;
        svg += `<g class="svg-interactive" data-tip="${escHtml(m.tip || m.name)}">`;
        svg += `<text x="10" y="${y + (nComp * 14) / 2 + 3}" font-size="11" font-weight="700" fill="var(--foreground)">${escHtml(fitText(m.name, bx - 18, 11))}</text>`;
        vals.forEach((v, j) => {
          const num = Number(v) || 0;
          const by = y + j * 14;
          const w = Math.max(3, (Math.abs(num) / maxAbs) * maxBar);
          const c = col(companies[j] && companies[j].color, `var(--chart-${j + 1})`);
          svg += `<rect x="${bx}" y="${by}" width="${w}" height="10" rx="3" fill="${c}" opacity="${j === 0 ? 0.95 : 0.72}" />`;
          svg += `<text x="${bx + w + 6}" y="${by + 9}" font-size="10" font-weight="${j === 0 ? '700' : '500'}" fill="${j === 0 ? c : 'var(--muted-foreground)'}" class="num-mono">${num > 0 && m.showSign ? '+' : ''}${num.toFixed(m.dec == null ? 2 : m.dec)}${m.unit != null ? m.unit : '%'}</text>`;
        });
        svg += `</g>`;
      });
      if (pb.footnote) {
        svg += `<text x="10" y="${H - 8}" font-size="10" fill="var(--muted-foreground)">${escHtml(fitText(pb.footnote, W - 20, 10))}</text>`;
      }
      svg += `</svg>`;
      const pw = document.getElementById('peer-bars-svg');
      if (pw) { pw.innerHTML = svg; bindTooltips(pw); }
    }

    // 5C: Inventory Quadrant
    const q = mg.quadrant;
    if (q && Array.isArray(q.points)) {
      setText('quadrant-inv-title', q.title || '寒冬压库风险四象限');
      setText('quadrant-inv-sub', q.subtitle || '');
      const qW = 380, qH = 266;
      const padL = 48, padR = 20, padT = 24, padB = 42;
      const cW = qW - padL - padR, cH = qH - padT - padB;
      const xs = q.points.map(p => Number(p.x) || 0);
      const ys = q.points.map(p => Number(p.y) || 0);
      const xMin = q.xMin != null ? q.xMin : Math.min(-20, ...xs) - 12;
      const xMax = q.xMax != null ? q.xMax : Math.max(10, ...xs) + 12;
      const yMin = q.yMin != null ? q.yMin : Math.min(-15, ...ys) - 8;
      const yMax = q.yMax != null ? q.yMax : Math.max(10, ...ys) + 8;

      const xOf = v => padL + ((v - xMin) / Math.max(1, xMax - xMin)) * cW;
      const yOf = v => padT + ((yMax - v) / Math.max(1, yMax - yMin)) * cH;

      let qsvg = `<svg viewBox="0 0 ${qW} ${qH}" class="w-full h-auto">`;
      qsvg += `<rect x="${padL}" y="${padT}" width="${cW}" height="${cH}" rx="6" fill="var(--background)" stroke="var(--border)" />`;
      const x0 = Math.max(padL, Math.min(padL + cW, xOf(0)));
      const y0 = Math.max(padT, Math.min(padT + cH, yOf(0)));
      if (y0 < padT + cH) {
        qsvg += `<rect x="${Math.max(padL, x0 - cW * 0.25)}" y="${y0}" width="${padL + cW - Math.max(padL, x0 - cW * 0.25)}" height="${padT + cH - y0}" fill="var(--success)" opacity="0.08" />`;
      }
      qsvg += `<line x1="${padL}" y1="${y0}" x2="${padL + cW}" y2="${y0}" stroke="var(--border)" stroke-dasharray="4,3" />`;
      qsvg += `<line x1="${x0}" y1="${padT}" x2="${x0}" y2="${padT + cH}" stroke="var(--border)" stroke-dasharray="4,3" />`;

      qsvg += `<text x="${padL + 8}" y="${padT + 15}" font-size="9.5" fill="var(--error)" font-weight="600">${escHtml(q.tlLabel || '压库失速区(库增+款降)')}</text>`;
      qsvg += `<text x="${padL + cW - 8}" y="${padT + cH - 8}" text-anchor="end" font-size="9.5" fill="var(--success)" font-weight="600">${escHtml(q.brLabel || '健康去库区(库存主动下降)')}</text>`;

      q.points.forEach((p, idx) => {
        const px = xOf(Number(p.x) || 0), py = yOf(Number(p.y) || 0);
        const r = p.r || 10;
        const c = col(p.color, `var(--chart-${idx + 1})`);
        const nearRight = px > padL + cW * 0.62;
        const dx = p.dx != null ? p.dx : (nearRight ? -(r + 6) : (r + 6));
        const dy = p.dy != null ? p.dy : -2;
        const anchor = p.anchor || (nearRight ? 'end' : 'start');
        qsvg += `<g class="svg-interactive" data-tip="${escHtml(p.tip || `<b>${p.name}</b><br>(${p.x}%, ${p.y}%)`)}">`;
        qsvg += `<circle cx="${px}" cy="${py}" r="${r}" fill="${c}" fill-opacity="0.85" stroke="var(--card)" stroke-width="2" />`;
        qsvg += `<text x="${px + dx}" y="${py + dy}" text-anchor="${anchor}" font-size="11" font-weight="700" fill="${c}">${escHtml(p.name)}</text>`;
        qsvg += `<text x="${px + dx}" y="${py + dy + 12}" text-anchor="${anchor}" font-size="9.5" fill="var(--muted-foreground)" class="num-mono">(${p.x}%, ${p.y}%)</text>`;
        qsvg += `</g>`;
      });

      qsvg += `<text x="${padL + cW / 2}" y="${qH - 10}" text-anchor="middle" font-size="10.2" fill="var(--muted-foreground)">${escHtml(q.xAxisLabel || '合同负债 / 预收增速（%）')}</text>`;
      qsvg += `<text x="14" y="${padT + cH / 2}" text-anchor="middle" font-size="10.2" fill="var(--muted-foreground)" transform="rotate(-90 14 ${padT + cH / 2})">${escHtml(q.yAxisLabel || '存货增速（%）')}</text>`;
      qsvg += `</svg>`;
      const qw = document.getElementById('quadrant-inv-svg');
      if (qw) { qw.innerHTML = qsvg; bindTooltips(qw); }
    }

    // 5D: Accounting Audit & Peer Valuation Table
    const tbl = mg.auditTable;
    if (tbl && Array.isArray(tbl.columns)) {
      setText('audit-table-title', tbl.title || '会计诚实度“四阀照妖镜” & 全球同行身位表');
      setText('audit-table-sub', tbl.subtitle || '');
      const html = `
        <table class="data-table w-full border-collapse text-left">
          <thead>
            <tr>${tbl.columns.map(c => `<th>${escHtml(c)}</th>`).join('')}</tr>
          </thead>
          <tbody>
            ${(tbl.rows || []).map(r => {
              const cells = Array.isArray(r) ? r : (r.cells || []);
              const hl = !Array.isArray(r) && r.highlight;
              return `<tr class="${hl ? 'row-highlight font-semibold' : ''}">${cells.map((cell, ci) => {
                if (cell && typeof cell === 'object') {
                  const cc = col(cell.color, 'var(--primary)');
                  return `<td><span class="badge-soft text-[11px] font-bold" style="background: color-mix(in srgb, ${cc} 14%, transparent); color: ${cc};">${escHtml(cell.badge || cell.text)}</span>${cell.note ? `<div class="text-[11px] text-[var(--muted-foreground)] mt-0.5">${escHtml(cell.note)}</div>` : ''}</td>`;
                }
                return `<td class="${ci === 0 ? 'font-bold whitespace-nowrap' : ''}">${escHtml(cell)}</td>`;
              }).join('')}</tr>`;
            }).join('')}
          </tbody>
        </table>`;
      const tw = document.getElementById('audit-table-wrap');
      if (tw) tw.innerHTML = html;
    }
  }

  // =========================================================================
  // 7. TAB 6: OE BRIDGE, STRESS TEST, REVERSE SOTP & INTERACTIVE SIMULATOR
  // =========================================================================
  function renderValuationCharts() {
    const val = D.valuation;
    if (!val) return;

    // 6A: OE Bridge
    const oe = val.oeBridge;
    if (oe) {
      setText('oe-bridge-title', oe.title || '账面净利 → 常态 Owner Earnings 桥接瀑布');
      setText('oe-bridge-sub', oe.subtitle || '');
      const ow = document.getElementById('oe-bridge-svg');
      if (ow) {
        ow.innerHTML = renderWaterfallSvg({
          width: 560, chartH: 184, padL: 44, padR: 12,
          steps: oe.steps || [], unit: '亿', dec: 1,
          footerHtml: escHtml(oe.footnote || '')
        });
        bindTooltips(ow);
      }
    }

    // 6B: Stress Test Horizontal Bars
    const st = val.stressTest;
    if (st && Array.isArray(st.scenarios)) {
      setText('stress-title', st.title || '多情景 OE 阶梯 & 极限压力测试舱');
      setText('stress-sub', st.subtitle || '');
      const sW = 396;
      const scens = st.scenarios;
      const sH = Math.max(256, 20 + scens.length * 48 + 26);
      const maxV = Math.max(...scens.map(s => Math.abs(Number(s.val) || 0)), 1) * 1.1;
      const maxBarW = 192;

      let ssvg = `<svg viewBox="0 0 ${sW} ${sH}" class="w-full h-auto">`;
      scens.forEach((sc, i) => {
        const y = 12 + i * 48;
        const c = col(sc.color, 'var(--primary)');
        const barW = Math.max(8, (Math.abs(Number(sc.val) || 0) / maxV) * maxBarW);
        const rightLbl = sc.rightLabel || `OE ${fmtNum(sc.val, 1)}亿`;
        ssvg += `<g class="svg-interactive" data-tip="${escHtml(sc.tip || `<b>${sc.name}</b><br>${rightLbl}`)}">`;
        ssvg += `<text x="6" y="${y + 12}" font-size="10.5" font-weight="600" fill="var(--foreground)">${escHtml(fitText(sc.name, sW - 14, 10.5))}</text>`;
        ssvg += `<rect x="6" y="${y + 18}" width="${barW}" height="16" rx="4" fill="${c}" opacity="0.88" />`;
        ssvg += `<text x="${6 + barW + 8}" y="${y + 30}" font-size="10.2" font-weight="700" fill="${c}">${escHtml(fitText(rightLbl, sW - (6 + barW + 12), 10.2))}</text>`;
        ssvg += `</g>`;
      });
      if (st.footnote) {
        ssvg += `<text x="6" y="${sH - 8}" font-size="9.8" fill="var(--muted-foreground)">${escHtml(fitText(st.footnote, sW - 12, 9.8))}</text>`;
      }
      ssvg += `</svg>`;
      const sw = document.getElementById('stress-svg');
      if (sw) { sw.innerHTML = ssvg; bindTooltips(sw); }
    }

    // 6C: Reverse SOTP (Strict Rule 3: short labels inside, >=50px channel, wrapping bottom legend)
    const sotp = val.sotp;
    if (sotp) {
      setText('sotp-title', sotp.title || 'Reverse SOTP 手术刀拆骨估值对比');
      setText('sotp-sub', sotp.subtitle || '');
      const W = 920;
      const coreSegs = sotp.coreSegments || [];
      const coreTotal = coreSegs.reduce((a, b) => a + (Number(b.val) || 0), 0) || Number(sotp.coreTotal) || 1;
      const rows = sotp.rows || [];
      const maxVal = Math.max(coreTotal, ...rows.map(r => Number(r.total) || 0)) * 1.06;

      const leftX = 166;
      const rightCardX = 718;
      const rightCardW = 190;
      const barMaxW = rightCardX - leftX - 56; // Guaranteed >= 56px channel!
      const px = v => Math.max(0, (v / maxVal) * barMaxW);

      // Pre-layout wrapping bottom legend items
      const legItems = [
        ...coreSegs.map((s, idx) => ({ color: col(s.color, `var(--chart-${idx + 1})`), text: `${s.name} ${fmtNum(s.val, 0)}亿` })),
        ...(sotp.stubLegend ? [{ color: 'var(--warning)', text: sotp.stubLegend }] : [])
      ];
      const legLines = [[]];
      let curLX = 26;
      legItems.forEach(item => {
        const iw = estTextWidth(item.text, 10.2) + 30;
        if (curLX + iw > W - 24 && legLines[legLines.length - 1].length > 0) {
          legLines.push([]);
          curLX = 26;
        }
        legLines[legLines.length - 1].push({ ...item, x: curLX });
        curLX += iw;
      });

      const rowsH = 18 + rows.length * 46;
      const legY = rowsH + 10;
      const legBoxH = 14 + legLines.length * 22;
      const H = legY + legBoxH + 14;

      let svg = `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto">`;
      rows.forEach((r, idx) => {
        const y = 16 + idx * 46;
        const nc = col(r.noteColor || r.color, 'var(--primary)');
        svg += `<text x="${leftX - 10}" y="${y + 21}" text-anchor="end" font-size="11.2" font-weight="700" fill="var(--foreground)">${escHtml(fitText(r.title, leftX - 18, 11.2))}</text>`;
        if (r.isCore) {
          let cx = leftX;
          coreSegs.forEach((seg, si) => {
            const w = px(Number(seg.val) || 0);
            const sc = col(seg.color, `var(--chart-${(si % 6) + 1})`);
            const shortLbl = seg.short || `${Math.round(seg.val)}`;
            svg += `<g class="svg-interactive" data-tip="${escHtml(seg.tip || `<b>${seg.name}</b><br>${seg.val}亿`)}">`;
            svg += `<rect x="${cx}" y="${y + 4}" width="${Math.max(2, w - 1)}" height="28" rx="4" fill="${sc}" />`;
            if (w >= estTextWidth(shortLbl, 10) + 10) {
              svg += `<text x="${cx + w / 2}" y="${y + 22}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">${escHtml(shortLbl)}</text>`;
            }
            svg += `</g>`;
            cx += w;
          });
        } else {
          const total = Number(r.total) || 0;
          const stub = r.stub != null ? Number(r.stub) : (total - coreTotal);
          const wCore = px(Math.min(coreTotal, total));
          svg += `<rect x="${leftX}" y="${y + 4}" width="${wCore}" height="28" rx="4" fill="var(--chart-1)" opacity="0.26" stroke="var(--chart-1)" stroke-width="0.9" />`;
          const coreLbl = `基石 ${fmtNum(coreTotal, 0)}亿`;
          if (wCore >= estTextWidth(coreLbl, 10.2) + 12) {
            svg += `<text x="${leftX + wCore / 2}" y="${y + 22}" text-anchor="middle" font-size="10.2" font-weight="700" fill="var(--foreground)">${coreLbl}</text>`;
          }
          if (stub > 0) {
            const wStub = px(stub);
            const rc = col(r.color, 'var(--warning)');
            const shortStub = `${Math.round(stub)}亿`;
            const tip = r.tip || `<b>${r.title}（True EV ${fmtNum(total, 1)}亿）</b><br>扣除成熟基石 ${fmtNum(coreTotal, 0)}亿后，剩余资产隐含标价 <b>${fmtNum(stub, 1)}亿</b>。`;
            svg += `<g class="svg-interactive" data-tip="${escHtml(tip)}">`;
            svg += `<rect x="${leftX + wCore + 2}" y="${y + 4}" width="${Math.max(4, wStub)}" height="28" rx="4" fill="${rc}" />`;
            if (wStub >= estTextWidth(shortStub, 10.2) + 10) {
              svg += `<text x="${leftX + wCore + 2 + wStub / 2}" y="${y + 22}" text-anchor="middle" font-size="10.2" font-weight="700" fill="#fff" class="num-mono">${shortStub}</text>`;
            }
            svg += `</g>`;
          }
        }
        svg += `<rect x="${rightCardX}" y="${y + 4}" width="${rightCardW}" height="28" rx="6" fill="color-mix(in srgb, ${nc} 12%, var(--card))" stroke="${nc}" stroke-width="1" />`;
        svg += `<text x="${rightCardX + rightCardW / 2}" y="${y + 22}" text-anchor="middle" font-size="10.3" font-weight="700" fill="${nc}">${escHtml(fitText(r.note || '', rightCardW - 14, 10.3))}</text>`;
      });

      const refX = leftX + px(coreTotal);
      svg += `<line x1="${refX}" y1="12" x2="${refX}" y2="${rowsH}" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="4,3" />`;

      svg += `<rect x="14" y="${legY}" width="${W - 28}" height="${legBoxH}" rx="8" fill="var(--background)" stroke="var(--card-border)" />`;
      legLines.forEach((line, li) => {
        const ly = legY + 18 + li * 22;
        line.forEach(item => {
          svg += `<rect x="${item.x}" y="${ly - 9}" width="10" height="10" rx="2" fill="${item.color}" />`;
          svg += `<text x="${item.x + 14}" y="${ly}" font-size="10.2" fill="var(--foreground)">${escHtml(item.text)}</text>`;
        });
      });

      svg += `</svg>`;
      const wrap = document.getElementById('sotp-svg');
      if (wrap) { wrap.innerHTML = svg; bindTooltips(wrap); }
    }
  }

  // 6D: Interactive Valuation Simulator (Single or Multi-Market A/H)
  let simMktIdx = 0;
  function renderThermometer(cfg, price) {
    const wrap = document.getElementById('thermo-svg');
    if (!wrap) return;
    const W = 860, H = 98;
    const padL = 24, padR = 24, barW = W - padL - padR, barY = 34, barH = 26;
    const xOf = p => padL + ((Math.max(cfg.min, Math.min(cfg.max, p)) - cfg.min) / Math.max(0.01, cfg.max - cfg.min)) * barW;

    const zones = [
      { from: cfg.min, to: cfg.z1, lbl: `重锤黄金坑 ≤${cfg.z1}`, col: 'var(--success)' },
      { from: cfg.z1, to: cfg.z2, lbl: `左侧分批 ${cfg.z1}–${cfg.z2}`, col: 'var(--chart-3)' },
      { from: cfg.z2, to: cfg.z3, lbl: `观察/不追高 ${cfg.z2}–${cfg.z3}`, col: 'var(--warning)' },
      { from: cfg.z3, to: cfg.max, lbl: `兑现/透支 >${cfg.z3}`, col: 'var(--error)' }
    ];

    let svg = `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto">`;
    zones.forEach(z => {
      const x1 = xOf(z.from), x2 = xOf(z.to), w = Math.max(0, x2 - x1);
      svg += `<rect x="${x1}" y="${barY}" width="${w}" height="${barH}" fill="${z.col}" opacity="0.22" stroke="${z.col}" stroke-width="1" />`;
      if (w >= estTextWidth(z.lbl, 10.2) + 12) {
        svg += `<text x="${x1 + w / 2}" y="${barY + 17}" text-anchor="middle" font-size="10.2" font-weight="700" fill="${z.col}">${escHtml(z.lbl)}</text>`;
      }
    });

    const curX = xOf(cfg.cur);
    svg += `<line x1="${curX}" y1="${barY - 6}" x2="${curX}" y2="${barY + barH + 14}" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-dasharray="3,2" />`;
    svg += `<text x="${curX}" y="${barY + barH + 28}" text-anchor="middle" font-size="10" fill="var(--muted-foreground)" class="num-mono">现价 ${cfg.cur}${escHtml(cfg.unit)}</text>`;

    const simX = xOf(price);
    svg += `<polygon points="${simX},${barY - 2} ${simX - 7},${barY - 12} ${simX + 7},${barY - 12}" fill="var(--primary)" />`;
    svg += `<line x1="${simX}" y1="${barY}" x2="${simX}" y2="${barY + barH}" stroke="var(--primary)" stroke-width="3" />`;
    const simLblX = Math.max(66, Math.min(W - 66, simX));
    svg += `<text x="${simLblX}" y="15" text-anchor="middle" font-size="11.5" font-weight="800" fill="var(--primary)" class="num-mono">模拟 ${price.toFixed(2)}${escHtml(cfg.unit)}</text>`;
    svg += `</svg>`;
    wrap.innerHTML = svg;
  }

  function updateSimulator(val) {
    const sim = D.valuation && D.valuation.simulator;
    if (!sim || !Array.isArray(sim.markets)) return;
    const cfg = sim.markets[simMktIdx] || sim.markets[0];
    const p = Number(val);
    const fx = Number(cfg.fxToReportCcy) || 1;
    const pBase = p * fx;
    const shares = Number(sim.shares) || 1;
    const bvps = Number(sim.bvps) || 1;
    const evDelta = Number(sim.evDelta) || 0;
    const oeSteady = Number(sim.oeSteady) || 1;
    const oeAlt = Number(sim.oeAlt) || oeSteady;
    const div1 = Number(sim.div1) || 0;
    const div2 = Number(sim.div2) || 0;
    const sotpBase = sim.sotpBase != null ? Number(sim.sotpBase) : null;
    const sotpDenom = sim.sotpStubDenom != null ? Number(sim.sotpStubDenom) : null;

    const mcap = shares * pBase;
    const ev = mcap + evDelta;
    const pb = pBase / bvps;
    const evOe = ev / oeSteady;
    const ySteady = (oeSteady / ev) * 100;
    const yAlt = (oeAlt / ev) * 100;
    const d1 = (div1 / Math.max(0.01, pBase)) * 100;
    const d2 = (div2 / Math.max(0.01, pBase)) * 100;

    setText('sim-price-display', `${p.toFixed(2)} ${cfg.unit}`);
    let subTxt = '';
    if (cfg.fxToReportCcy && cfg.fxToReportCcy !== 1) {
      subTxt = `(折人民币 ${pBase.toFixed(2)} 元`;
      if (cfg.comparePriceRmb) {
        const diff = (1 - pBase / cfg.comparePriceRmb) * 100;
        subTxt += ` · 较对标${diff >= 0 ? '折价 ' + diff.toFixed(1) : '溢价 ' + (-diff).toFixed(1)}%`;
      }
      subTxt += ')';
    } else if (cfg.comparePriceRmb) {
      const diff = (pBase / cfg.comparePriceRmb - 1) * 100;
      subTxt = `(较对标${diff >= 0 ? '溢价 +' + diff.toFixed(1) : '折价 ' + diff.toFixed(1)}%)`;
    }
    setText('sim-rmb-sub', subTxt);

    setText('out-mcap', `${mcap.toFixed(1)} 亿`);
    setText('out-pb', `PB ${pb.toFixed(2)}x`);
    setText('out-ev', `${ev.toFixed(1)} 亿`);
    setText('out-evoe', `EV/OE ${evOe.toFixed(2)}x`);
    setText('out-oe-steady', `${ySteady.toFixed(2)}%`);
    setText('sub-oe-steady', sim.oeSteadySub || `分子 ${oeSteady} 亿`);
    setText('out-oe-full', `${yAlt.toFixed(2)}%`);
    setText('sub-oe-alt', sim.oeAltSub || `分子 ${oeAlt} 亿`);
    setText('out-div', div2 > 0 ? `${d1.toFixed(2)}% / ${d2.toFixed(2)}%` : `${d1.toFixed(2)}%`);
    setText('out-div-sub', cfg.divTaxFactor && div2 > 0
      ? `税后预期息 ${(d2 * cfg.divTaxFactor).toFixed(2)}%`
      : (sim.divSub || `每股 ${div1} 元`));

    if (sotpBase != null) {
      const stub = ev - sotpBase;
      setText('out-stub', `${stub.toFixed(0)} 亿`);
      if (sotpDenom && sotpDenom > 0) {
        setText('out-stub-ps', `隐含 ${(stub / sotpDenom).toFixed(2)}x ${sim.sotpStubUnit || 'PS'}`);
      } else {
        setText('out-stub-ps', stub <= 0 ? '负值白送!' : `占EV ${(stub / ev * 100).toFixed(0)}%`);
      }
    } else {
      setText('out-stub', `${(mcap / oeSteady).toFixed(1)}x`);
      setText('out-stub-ps', '市值 / 常态 OE');
    }

    const g = cfg.guides || {};
    let zText = '', zCol = '', guide = '';
    if (p <= cfg.z1) {
      zText = '🟢 第一档 · 重锤黄金坑区';
      zCol = 'var(--success)';
      guide = g.z1 || `<b>实战纪律（满弓重锤区）：</b>当前价格落入第一档极端错杀区，True EV/OE 仅 <b>${evOe.toFixed(2)}x</b>，常态内生回报率 <b>${ySteady.toFixed(2)}%</b>（进阶 <b>${yAlt.toFixed(2)}%</b>），赔率极厚，可按纪律左侧重锤。`;
    } else if (p <= cfg.z2) {
      zText = '🟢 第二档 · 左侧分批建仓区';
      zCol = 'var(--chart-3)';
      guide = g.z2 || `<b>实战纪律（左侧分批建底仓）：</b>落入合理安全边际击球区，True EV 内生回报率 <b>${ySteady.toFixed(2)}%</b>，可分批建底仓并跟踪季度核心催化。`;
    } else if (p <= cfg.z3) {
      zText = '🟡 第三档 · 观察 / 退出买区';
      zCol = 'var(--warning)';
      guide = g.z3 || `<b>实战纪律（观察不追高）：</b>当前 EV/OE 为 <b>${evOe.toFixed(2)}x</b>、内生回报率 <b>${ySteady.toFixed(2)}%</b>，赔率不足以支持重仓追高，建议持有观望或耐心等待回踩至 <b>≤${cfg.z2}${cfg.unit}</b>。`;
    } else {
      zText = '🔴 第四档 · 公允兑现 / 透支区';
      zCol = 'var(--error)';
      guide = g.z4 || `<b>实战纪律（分批兑现落袋）：</b>价格进入透支/兑现区，True EV/OE 升至 <b>${evOe.toFixed(2)}x</b>，常态内生回报降至 <b>${ySteady.toFixed(2)}%</b>，安全边际收窄，宜分批减仓止盈。`;
    }

    const badge = document.getElementById('sim-zone-badge');
    if (badge) {
      badge.textContent = zText;
      badge.style.background = `color-mix(in srgb, ${zCol} 15%, transparent)`;
      badge.style.color = zCol;
    }
    const gEl = document.getElementById('sim-action-guide');
    if (gEl) gEl.innerHTML = guide;
    renderThermometer(cfg, p);
  }

  function initSimulator() {
    const sim = D.valuation && D.valuation.simulator;
    if (!sim || !Array.isArray(sim.markets) || !sim.markets.length) return;
    setText('sim-title', sim.title || '四档击球区温度计 & 可拖动股价滑块实时测算器');
    setText('sim-sub', sim.subtitle || '拖动滑块或点击快捷锚点，实时重算 True EV、内生回报率与仓位纪律');

    if (sim.labels) {
      if (sim.labels.mcap) setText('lbl-mcap', sim.labels.mcap);
      if (sim.labels.ev) setText('lbl-ev', sim.labels.ev);
      if (sim.labels.oeSteady) setText('lbl-oe-steady', sim.labels.oeSteady);
      if (sim.labels.oeAlt) setText('lbl-oe-alt', sim.labels.oeAlt);
      if (sim.labels.div) setText('lbl-div', sim.labels.div);
      if (sim.labels.stub) setText('lbl-stub', sim.labels.stub);
    }

    const mWrap = document.getElementById('sim-mkt-btns');
    if (mWrap) {
      if (sim.markets.length > 1) {
        mWrap.innerHTML = sim.markets.map((m, i) =>
          `<button class="pill-btn ${i === simMktIdx ? 'active' : ''} px-2.5 py-1 rounded-lg text-xs cursor-pointer" data-sm="${i}">${escHtml(m.label)}</button>`
        ).join('');
        mWrap.querySelectorAll('[data-sm]').forEach(b => b.addEventListener('click', () => {
          simMktIdx = Number(b.getAttribute('data-sm'));
          initSimulator();
        }));
      } else {
        mWrap.innerHTML = '';
      }
    }

    const cfg = sim.markets[simMktIdx] || sim.markets[0];
    const slider = document.getElementById('price-slider');
    if (slider) {
      slider.min = cfg.min;
      slider.max = cfg.max;
      slider.step = cfg.step || (cfg.max - cfg.min > 50 ? '0.1' : '0.01');
      slider.value = cfg.cur;
      slider.oninput = e => updateSimulator(e.target.value);
    }
    const ticksEl = document.getElementById('slider-ticks');
    if (ticksEl) {
      ticksEl.innerHTML = `<span>${cfg.min}${escHtml(cfg.unit)}</span><span>重锤 ${cfg.z1}</span><span>分批 ${cfg.z2}</span><span>兑现 ${cfg.z3}</span><span>${cfg.max}${escHtml(cfg.unit)}</span>`;
    }
    const pWrap = document.getElementById('sim-presets');
    if (pWrap) {
      pWrap.innerHTML = (cfg.presets || []).map(pr =>
        `<button class="pill-btn px-2.5 py-1 rounded-md text-xs cursor-pointer" data-preset="${pr.val}">${escHtml(pr.label)}</button>`
      ).join('');
      pWrap.querySelectorAll('[data-preset]').forEach(btn => {
        btn.addEventListener('click', () => {
          const v = Number(btn.getAttribute('data-preset'));
          if (slider) slider.value = v;
          updateSimulator(v);
        });
      });
    }
    updateSimulator(cfg.cur);
  }

  // =========================================================================

    const padL = 44, padR = 20, padT = 24, padB = 42;

    svg += `<text x="${padL + cW - 8}" y="${padT + 15}" text-anchor="end" font-size="9.5" font-weight="600" fill="var(--success)">${escHtml(nb.trLabel || '真增长引擎区')}</text>`;
    svg += `<text x="${padL + 8}" y="${padT + cH - 8}" font-size="9.5" font-weight="600" fill="var(--error)">${escHtml(nb.blLabel || '证伪收缩/资本陷阱区')}</text>`;
    svg += `<text x="${padL + cW - 8}" y="${padT + cH - 8}" text-anchor="end" font-size="9.5" font-weight="600" fill="var(--warning)">${escHtml(nb.brLabel || '成熟薄利改造区')}</text>`;

    nb.bubbles.forEach((b, idx) => {

  let masterMktIdx = 0, activeMasterIdx = 0;
  function renderMasters() {
    const ms = D.verdict && D.verdict.masters;
    if (!ms || !Array.isArray(ms.items) || !ms.items.length) return;
    setText('masters-title', ms.title || '投资大师圆桌价格坐标图');
    setText('masters-sub', ms.subtitle || '点击任意大师行展开闭门判词');

    const mkts = ms.markets || [{ key: 'default', label: '', min: ms.min, max: ms.max, cur: ms.cur, unit: ms.unit || '元' }];
    const bWrap = document.getElementById('masters-mkt-btns');
    if (bWrap) {
      if (mkts.length > 1) {
        bWrap.innerHTML = mkts.map((m, i) =>
          `<button class="pill-btn ${i === masterMktIdx ? 'active' : ''} px-2 py-1 rounded text-xs cursor-pointer" data-mm="${i}">${escHtml(m.label)}</button>`
        ).join('');
        bWrap.querySelectorAll('[data-mm]').forEach(b => b.addEventListener('click', () => {
          masterMktIdx = Number(b.getAttribute('data-mm'));
          renderMasters();
        }));
      } else {
        bWrap.innerHTML = '';
      }
    }

    const mkt = mkts[masterMktIdx] || mkts[0];
    const items = ms.items;
    if (activeMasterIdx >= items.length) activeMasterIdx = 0;

    // Auto range calculation if min/max not explicit
    const allPrices = [Number(mkt.cur) || 0];
    items.forEach(it => {
      const r = (it.ranges && it.ranges[mkt.key]) || it.range || [0, 0];
      allPrices.push(Number(r[0]) || 0, Number(r[1]) || 0);
    });
    const minP = mkt.min != null ? mkt.min : Math.floor(Math.min(...allPrices) * 0.88);
    const maxP = mkt.max != null ? mkt.max : Math.ceil(Math.max(...allPrices) * 1.12);
    const curP = Number(mkt.cur) || 0;
    const unit = mkt.unit || '元';

    const W = 460;
    const padL = 108, padR = 18, padT = 26;
    const rowStep = 42;
    const H = padT + 14 + items.length * rowStep + 34;
    const cW = W - padL - padR;
    const xOf = p => padL + ((Math.max(minP, Math.min(maxP, p)) - minP) / Math.max(0.01, maxP - minP)) * cW;

    let svg = `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto">`;
    const tickCount = 5;
    for (let i = 0; i <= tickCount; i++) {
      const t = +(minP + ((maxP - minP) / tickCount) * i).toFixed(maxP - minP > 20 ? 0 : 1);
      const tx = xOf(t);
      svg += `<line x1="${tx}" y1="${padT}" x2="${tx}" y2="${H - 30}" stroke="var(--card-border)" stroke-dasharray="2,3" />`;
      svg += `<text x="${tx}" y="${H - 13}" text-anchor="middle" font-size="10" fill="var(--muted-foreground)" class="num-mono">${t}${escHtml(unit)}</text>`;
    }

    const cx = xOf(curP);
    svg += `<line x1="${cx}" y1="${padT - 4}" x2="${cx}" y2="${H - 28}" stroke="var(--error)" stroke-width="1.8" stroke-dasharray="4,2" />`;
    const curLblX = Math.max(padL + 36, Math.min(W - 44, cx));
    svg += `<text x="${curLblX}" y="16" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--error)" class="num-mono">现价 ${curP}${escHtml(unit)}</text>`;

    items.forEach((m, idx) => {
      const y = padT + 10 + idx * rowStep;
      const rng = (m.ranges && m.ranges[mkt.key]) || m.range || [minP, minP];
      const vote = (m.votes && m.votes[mkt.key]) || m.vote || '';
      const x1 = xOf(rng[0]), x2 = xOf(rng[1]), bw = Math.max(8, x2 - x1);
      const isAct = idx === activeMasterIdx;
      const c = col(m.color, `var(--chart-${(idx % 6) + 1})`);
      const lbl = `${rng[0]}–${rng[1]}${unit}`;
      const fs = 10;

      svg += `<g class="svg-interactive" data-master="${idx}" data-tip="${escHtml(`<b>${m.name}（${vote}）</b><br>击球区间：${lbl}<br>${m.tag || ''}`)}">`;
      if (isAct) {
        svg += `<rect x="2" y="${y - 5}" width="${W - 4}" height="34" rx="7" fill="color-mix(in srgb, ${c} 9%, transparent)" />`;
      }
      svg += `<text x="${padL - 8}" y="${y + 15}" text-anchor="end" font-size="11" font-weight="${isAct ? '800' : '600'}" fill="${isAct ? c : 'var(--foreground)'}">${escHtml(fitText(m.name, padL - 14, 11))}</text>`;
      svg += `<rect x="${x1}" y="${y + 1}" width="${bw}" height="22" rx="11" fill="${c}" opacity="${isAct ? 0.95 : 0.80}" />`;

      // Strict Rule 3: Adaptive inside/outside pill label, ZERO white text on light bg!
      const lblW = estTextWidth(lbl, fs);
      if (bw >= lblW + 18) {
        svg += `<text x="${x1 + bw / 2}" y="${y + 15.5}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="#fff" class="num-mono">${escHtml(lbl)}</text>`;
      } else if (W - padR - x2 >= lblW + 10) {
        svg += `<text x="${x2 + 7}" y="${y + 15.5}" text-anchor="start" font-size="${fs}" font-weight="700" fill="${c}" class="num-mono">${escHtml(lbl)}</text>`;
      } else {
        svg += `<text x="${x1 - 7}" y="${y + 15.5}" text-anchor="end" font-size="${fs}" font-weight="700" fill="${c}" class="num-mono">${escHtml(lbl)}</text>`;
      }
      svg += `</g>`;
    });

    svg += `</svg>`;
    const wrap = document.getElementById('masters-svg');
    if (wrap) {
      wrap.innerHTML = svg;
      bindTooltips(wrap);
      wrap.querySelectorAll('[data-master]').forEach(el => {
        el.addEventListener('click', () => {
          activeMasterIdx = Number(el.getAttribute('data-master'));
          renderMasters();
        });
      });
    }

    const cur = items[activeMasterIdx];
    const c = col(cur.color, 'var(--primary)');
    const rng = (cur.ranges && cur.ranges[mkt.key]) || cur.range || [0, 0];
    const vote = (cur.votes && cur.votes[mkt.key]) || cur.vote || '';
    const vCol = /追高|回避|卖出|0票/.test(vote) ? 'var(--error)' : (/买入|重锤|建仓/.test(vote) ? 'var(--success)' : 'var(--warning)');
    const det = document.getElementById('master-detail');
    if (det) {
      det.innerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-2 mb-1">
          <div class="font-bold" style="color: ${c};">${escHtml(cur.name)} · <span class="font-normal text-[var(--muted-foreground)]">${escHtml(cur.tag || '')}</span></div>
          <span class="badge-soft font-bold" style="background: color-mix(in srgb, ${vCol} 14%, transparent); color: ${vCol};">${escHtml(mkt.label ? mkt.label + '：' : '')}${escHtml(vote)} (${rng[0]}–${rng[1]}${escHtml(unit)})</span>
        </div>
        <p class="m-0 leading-relaxed text-[var(--foreground)]">${escHtml(cur.verdict || '')}</p>`;
    }
  }

  function renderVerdictPanels() {
    const vd = D.verdict;
    if (!vd) return;

    // Traffic lights
    const tl = vd.trafficLights;
    if (tl && Array.isArray(tl.items)) {
      setText('lights-title', tl.title || '六维红绿灯季度跟踪仪表盘');
      setText('lights-sub', tl.subtitle || '浓缩为 6 个可量化、可证伪的季度验证开关');
      const mapCol = { green: 'var(--success)', yellow: 'var(--warning)', red: 'var(--error)' };
      const el = document.getElementById('traffic-lights');
      if (el) {
        el.innerHTML = tl.items.map(l => {
          const c = mapCol[l.status] || col(l.status, 'var(--warning)');
          return `
            <div class="p-3.5 rounded-xl border border-[var(--border)] bg-[var(--background)] space-y-1.5">
              <div class="flex items-center justify-between gap-2">
                <div class="font-bold text-xs text-[var(--foreground)]">${escHtml(l.title)}</div>
                <span class="badge-soft text-[11px] font-bold" style="background: color-mix(in srgb, ${c} 15%, transparent); color: ${c};">${escHtml(l.tag)}</span>
              </div>
              <div class="text-xs font-semibold num-mono" style="color: ${c};">${escHtml(l.metric)}</div>
              <div class="text-xs text-[var(--muted-foreground)] leading-relaxed">${escHtml(l.target)}</div>
            </div>`;
        }).join('');
      }
    }

    // Redlines
    const rl = vd.redlines;
    if (rl && Array.isArray(rl.items)) {
      setText('redlines-title', rl.title || '🚨 三条无条件清仓“死刑证伪红线”');
      const el = document.getElementById('redlines-list');
      if (el) {
        el.innerHTML = rl.items.map(r => `
          <div class="p-2.5 rounded-lg border border-[var(--card-border)] bg-[var(--background)]">
            <div class="font-bold" style="color: var(--error);">${escHtml(r.title)}</div>
            <div class="text-[var(--muted-foreground)] mt-0.5 leading-relaxed">${r.descHtml || escHtml(r.desc)}</div>
          </div>`).join('');
      }
    }

    // 1-Minute Briefing
    const br = vd.briefing;
    if (br) {
      setText('briefing-title', br.title || '💼 买方研究员 1 分钟闭门交底');
      setText('briefing-badge', br.badge || '');
      const el = document.getElementById('briefing-list');
      if (el && Array.isArray(br.paragraphs)) {
        el.innerHTML = br.paragraphs.map(p =>
          typeof p === 'string'
            ? `<p class="m-0">${p}</p>`
            : `<p class="m-0"><b>${escHtml(p.lead)}</b>${p.html || escHtml(p.text)}</p>`
        ).join('');
      }
    }
  }

  // =========================================================================
  // BOOTSTRAP ALL 7 TABS
  // =========================================================================
  initHeaderAndChrome();
  renderSankey();
  renderTension();
  renderTimeline();
  renderTreemap();
  renderProductTree();
  renderEconomicsAndBom();
  renderBalanceSheet();
  renderAssetsMidRow();
  renderTrueEV();
  renderHistory();
  renderMarginsTab();
  renderValuationCharts();
  initSimulator();
  renderNewBizQuadrant();
  renderMasters();
  renderVerdictPanels();
})();

  </script>
</body>
</html>
