      currentView = v;
      document.getElementById('btn-view-list').classList.toggle('active', v === 'list');
      document.getElementById('btn-view-grid').classList.toggle('active', v === 'grid');
      renderMain();
    }
    function setSort(s) {
      currentSort = s;
      document.getElementById('btn-sort-time').classList.toggle('active', s === 'time');
      document.getElementById('btn-sort-cat').classList.toggle('active', s === 'cat');
      renderMain();
    }

    function badgesHtml(x) {
      let h = '';
      if (x.has_pod) h += '<span class="mini-b mb-pod">🎧播客</span>';
      if (x.is_v3) h += '<span class="mini-b mb-v3">✨新流程</span>';
      if (x.is_swarm) h += '<span class="mini-b mb-swarm">👑Swarm</span>';
      return h;
    }

    function renderMain() {
      const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      const tabObj = TABS.find(t => t.id === currentTab) || TABS[0];
      document.getElementById('recentBox').style.display = (!q && currentTab === 'all') ? 'block' : 'none';

      let list = ITEMS.filter(x => {
        if (!tabObj.filter(x)) return false;
        if (q) {
          const hay = (x.title + ' ' + x.fname + ' ' + x.tags + ' ' + x.cat_label).toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      if (currentSort === 'time') {
        list.sort((a, b) => {
          if (currentTab === 'metamorphosis' && a.pin_order !== b.pin_order) return a.pin_order - b.pin_order;
          return b.mtime - a.mtime;
        });
      } else {
        list.sort((a, b) => (a.cat_order - b.cat_order) || (a.pin_order - b.pin_order) || (b.mtime - a.mtime));
      }

      document.getElementById('resultCount').textContent = `当前显示 ${list.length} 份报告（${currentSort==='time'?'按最新更新时间倒序':'按类别分组排序'}）`;
      const mount = document.getElementById('reportMount');

      if (!list.length) {
        mount.innerHTML = '<div style="padding:36px;text-align:center;color:var(--muted)">未找到匹配的报告</div>';
        return;
      }

      if (currentView === 'list') {
        mount.innerHTML = `<div class="report-list">${list.map(x => `
          <a class="row-item" href="./${encodeURIComponent(x.fname)}" target="_blank" rel="noopener noreferrer">
            <span class="cat-tag c-${x.kind}">${esc(x.cat_label)}</span>
            <span class="row-title" title="${esc(x.title)}">${esc(x.title)} ${relTimeBadge(x.mtime)}</span>
            <span class="row-badges">${badgesHtml(x)}</span>
            <span class="row-time num">${esc(x.mtime_str)}</span>
            <span class="row-size num">${x.size_kb} KB</span>
          </a>
        `).join('')}</div>`;
      } else {
        mount.innerHTML = `<div class="report-grid">${list.map(x => `
          <a class="gcard" href="./${encodeURIComponent(x.fname)}" target="_blank" rel="noopener noreferrer">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap">
              <span class="cat-tag c-${x.kind}">${esc(x.cat_label)}</span>
              ${relTimeBadge(x.mtime)}
            </div>
            <div class="gcard-title">${esc(x.title)}</div>
            <div style="display:flex;gap:4px;flex-wrap:wrap">${badgesHtml(x)}</div>
            <div class="gcard-meta num"><span>🕒 ${esc(x.mtime_str)}</span><span>${x.size_kb} KB</span></div>
          </a>
        `).join('')}</div>`;
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }

    async function cacheAllReports() {
      var st = document.getElementById('cache-status');
      var btn = document.getElementById('btn-cache');
      st.style.display = 'block';
      btn.disabled = true;
      try {
        var cache = await caches.open('agy-reports-v6');
        var done = 0;
        for (var i = 0; i < REPORT_URLS.length; i++) {
          st.textContent = '⏳ 正在离线缓存到平板本地 (' + (i+1) + '/' + REPORT_URLS.length + ')...';
          try { await cache.add(new Request(REPORT_URLS[i], { cache: 'reload' })); done++; } catch(e) {}
        }
        st.textContent = '✅ 已成功将全部 ' + done + ' 份报告缓存到本地！断网也能秒开阅读！';
        btn.textContent = '✅ 已离线缓存';
      } catch(e) {
        st.textContent = '⚠️ 当前浏览器环境使用自动阅读缓存（点开过的报告会自动保存）。';
        btn.disabled = false;
      }
    }

    renderTabs();
    renderRecentSpotlight();
    renderMain();
  </script>
</body>
</html>
